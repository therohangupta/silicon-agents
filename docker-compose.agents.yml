# Generated by scripts/startup.sh. The fleet YAML selects these agents.
name: silicon-agents
services:
  requirements:
    image: agentfleet/silicon-agent:dev
    build:
      context: .
      dockerfile: services/silicon_agent/Dockerfile
    working_dir: /app/agents/frontend/architecture/requirements
    command:
    - python
    - server.py
    ports:
    - 8202:8202
    restart: unless-stopped
    environment:
      MEMORY_BACKEND: plane
      DATABASE_URL: postgresql://agent_user:${AGENT_FLEET_POSTGRES_PASSWORD:?set AGENT_FLEET_POSTGRES_PASSWORD
        in the repository .env}@db:5432/agent_fleet
      MEMORY_DATABASE_URL: postgresql://agent_user:${AGENT_FLEET_POSTGRES_PASSWORD:?set
        AGENT_FLEET_POSTGRES_PASSWORD in the repository .env}@db:5432/agent_fleet
      MEMORY_CASSANDRA_HOSTS: cassandra
      MEMORY_CASSANDRA_PORT: '9042'
      MEMORY_S3_ENDPOINT: http://minio:9000
      MEMORY_S3_ACCESS_KEY: minio
      MEMORY_S3_SECRET_KEY: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?set AGENT_FLEET_MINIO_ROOT_PASSWORD
        in the repository .env}
      MEMORY_S3_BUCKET: silicon-artifacts
      MEMORY_OPENSEARCH_URL: http://opensearch:9200
      MEMORY_CLICKHOUSE_URL: http://clickhouse:8123
      MEMORY_CLICKHOUSE_USER: silicon
      MEMORY_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?set AGENT_FLEET_CLICKHOUSE_PASSWORD
        in the repository .env}
      MEMORY_CLICKHOUSE_DATABASE: silicon
      MEMORY_VAULT_ADDR: http://vault:8200
      MEMORY_VAULT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?set AGENT_FLEET_VAULT_DEV_ROOT_TOKEN
        in the repository .env}
      MEMORY_GIT_DIR: /tmp/memory-source/repo
      MEMORY_NATS_URL: nats://nats:4222
      NATS_URL: nats://nats:4222
      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_GRPC_PORT: '9001'
      TELEMETRY_GRPC_TARGET: telemetry:9001
    networks:
    - agent_fleet
  rtl_implementation:
    image: agentfleet/silicon-agent:dev
    build:
      context: .
      dockerfile: services/silicon_agent/Dockerfile
    working_dir: /app/agents/frontend/rtl/rtl_implementation
    command:
    - python
    - server.py
    ports:
    - 8209:8209
    restart: unless-stopped
    environment:
      MEMORY_BACKEND: plane
      DATABASE_URL: postgresql://agent_user:${AGENT_FLEET_POSTGRES_PASSWORD:?set AGENT_FLEET_POSTGRES_PASSWORD
        in the repository .env}@db:5432/agent_fleet
      MEMORY_DATABASE_URL: postgresql://agent_user:${AGENT_FLEET_POSTGRES_PASSWORD:?set
        AGENT_FLEET_POSTGRES_PASSWORD in the repository .env}@db:5432/agent_fleet
      MEMORY_CASSANDRA_HOSTS: cassandra
      MEMORY_CASSANDRA_PORT: '9042'
      MEMORY_S3_ENDPOINT: http://minio:9000
      MEMORY_S3_ACCESS_KEY: minio
      MEMORY_S3_SECRET_KEY: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?set AGENT_FLEET_MINIO_ROOT_PASSWORD
        in the repository .env}
      MEMORY_S3_BUCKET: silicon-artifacts
      MEMORY_OPENSEARCH_URL: http://opensearch:9200
      MEMORY_CLICKHOUSE_URL: http://clickhouse:8123
      MEMORY_CLICKHOUSE_USER: silicon
      MEMORY_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?set AGENT_FLEET_CLICKHOUSE_PASSWORD
        in the repository .env}
      MEMORY_CLICKHOUSE_DATABASE: silicon
      MEMORY_VAULT_ADDR: http://vault:8200
      MEMORY_VAULT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?set AGENT_FLEET_VAULT_DEV_ROOT_TOKEN
        in the repository .env}
      MEMORY_GIT_DIR: /tmp/memory-source/repo
      MEMORY_NATS_URL: nats://nats:4222
      NATS_URL: nats://nats:4222
      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_GRPC_PORT: '9001'
      TELEMETRY_GRPC_TARGET: telemetry:9001
    networks:
    - agent_fleet
networks:
  agent_fleet:
    external: true
    name: agent_fleet_default
