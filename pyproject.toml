# =============================================================================
# pyproject.toml — canonical installable package for this repo.
#
# Install (from this directory):
#   pip install -e .
#   pip install -e ".[dev]"            # pytest extras
#   pip install -e ".[all-providers]"  # all LangChain LLM provider extras
#
# Registers the `agentctl` console script → cli.agentctl:main
# =============================================================================

# --- Build backend: how pip/build creates the wheel/sdist --------------------
[build-system]
# Minimum setuptools that understands pyproject package discovery tables.
requires = ["setuptools>=61", "wheel"]
# Entry point setuptools exposes to PEP 517 builders.
build-backend = "setuptools.build_meta"

# --- Core project metadata (PEP 621) ----------------------------------------
[project]
# Distribution / import-adjacent name used on PyPI-style installs.
name = "agent_fleet"
# Semver for this control-plane release line.
version = "2.0.0"
# One-line summary shown by pip show / package indexes.
description = "Agent fleet control plane: fleet server, gateway, shared packages"
# Long description file packaged / shown on indexes.
readme = "README.md"
# Interpreter floor; matches async/FastAPI stack assumptions.
requires-python = ">=3.10"
# Runtime dependencies installed with a plain `pip install -e .`
dependencies = [
    "grpcio>=1.71.0",              # gRPC runtime (fleet-server, stubs)
    "grpcio-tools>=1.71.0",        # Generate/refresh protobuf Python stubs
    "protobuf>=4.25.0",            # Protobuf runtime for generated *_pb2 modules
    "asyncpg",                     # Async Postgres driver (DATABASE_URL asyncpg://)
    "python-dotenv",               # Load repo-root .env for local runs
    "sqlalchemy",                  # ORM models in packages/fleet_sdk
    "greenlet",                    # Required by SQLAlchemy async on some hosts
    "fastapi>=0.100.0",            # Gateway + telemetry HTTP frameworks
    "uvicorn[standard]>=0.22.0",   # ASGI server process for FastAPI apps
    "pulp",                        # LP allocator math backend
    "pydantic>=2.0",               # Request/response and domain models
    "tabulate",                    # agentctl table formatting
    "httpx>=0.27.0",               # HTTP client (events, health, SDKs)
    "PyYAML>=6.0.1",               # Fleet YAML + agent config.yaml
    "jsonschema>=4.17.0",          # Validate agent YAML against schema
    "click",                       # CLI option parsing for agentctl
    "nats-py>=2.7.0",              # NATS client (events / jetstream consumers)
    "pyarrow>=15.0.0",             # Parquet I/O for storage-writer telemetry
    "python-multipart>=0.0.9",     # FastAPI multipart form/file uploads
    "opencv-python-headless>=4.9.0",  # Optional vision helpers without GUI deps
    "langchain>=0.2.0",            # LLM orchestration for planners/agents
    "langchain-core>=0.2.0",       # Shared LangChain primitives
    "redis>=5.0.0",                # Optional cache / coordination backend
    "boto3>=1.34.0",               # S3-compatible client (MinIO artifact store)
    "cassandra-driver>=3.29.0",    # Cassandra journal memory plane
]

# --- Optional extras: pip install -e ".[name]" ------------------------------
[project.optional-dependencies]
# LangChain OpenAI chat models.
openai = ["langchain-openai>=0.1.0"]
# LangChain Anthropic chat models.
anthropic = ["langchain-anthropic>=0.1.0"]
# LangChain Ollama local models.
ollama = ["langchain-ollama>=0.1.0"]
# LangChain Google Generative AI models.
google = ["langchain-google-genai>=1.0.0"]
# Explicit S3 extra (boto3 also in main deps for MinIO).
s3 = ["boto3>=1.34.0"]
# Convenience bundle of every LLM provider extra above.
all-providers = ["langchain-openai>=0.1.0", "langchain-anthropic>=0.1.0", "langchain-ollama>=0.1.0", "langchain-google-genai>=1.0.0"]
# Test runner stack for local/CI.
dev = ["pytest", "pytest-asyncio"]

# --- Console scripts installed onto PATH ------------------------------------
[project.scripts]
# `agentctl` → Python entry `cli.agentctl:main` (register agents, plans, etc.).
agentctl = "cli.agentctl:main"

# --- setuptools: which directories become importable packages ---------------
[tool.setuptools.packages.find]
# Search roots relative to this pyproject (repo root).
where = ["."]
# Only ship these top-level trees as packages (not docs/, fleets/, scripts/).
include = ["packages*", "services*", "cli*", "agents*", "domains*"]

# Map the empty package-dir key so imports are rooted at repo root:
# `import packages...`, `import services...`, `import domains...`, etc.
# So that "packages" is the top-level import (packages.proto, packages.fleet_sdk, etc.)
[tool.setuptools.package-dir]
"" = "."
