[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_fleet"
version = "2.0.0"
description = "Robot fleet control plane: fleet server, gateway, shared packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "protobuf>=4.25.0",
    "asyncpg",
    "python-dotenv",
    "sqlalchemy",
    "openai",
    "greenlet",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pulp",
    "pydantic>=2.0",
    "tabulate",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "jsonschema>=4.17.0",
    "click",
    "nats-py>=2.7.0",
    "pyarrow>=15.0.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
robotctl = "cli.robotctl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "cli*"]

# So that "packages" is the top-level import (packages.proto, packages.fleet_sdk, etc.)
[tool.setuptools.package-dir]
"" = "."
