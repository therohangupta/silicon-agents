# =============================================================================
# Big DAG Planner catalog summary (dashboard / docs metadata — not loaded as code)
# =============================================================================

# Numeric strategy/catalog id for this planner entry.
id: 3
# Human-readable display name.
name: Big DAG Planner

# Describes unified cross-goal DAG behavior and when to choose it.
description: >
  Generates a single unified DAG that spans ALL goals together. Tasks from
  different goals can depend on each other, enabling cross-goal optimization.
  Best for coordinating multiple agents on interrelated objectives.

# LLM-backed planning method.
method_type: foundation model

# Documents node fields including optional agent_type suggestions.
output_format: >
  JSON with 'nodes' array. Each node has: id (string like "node0", "node1"),
  description, goal_id, agent_type (suggested), depends_on (list of node IDs).
  Unlike DAG planner, dependencies can cross goal boundaries.

# Co-located prompt inventory for operators.
prompts:
  # system.prompt — cross-goal coordination rules.
  - type: system
    description: System prompt for unified cross-goal planning
  # user.prompt — multi-goal context + agent capabilities.
  - type: user
    description: Template with multiple goals, agent context, and coordination instructions

# Example unified DAG spanning two goals (docs only).
example_output: |
  {
    "nodes": [
      {"id": "node0", "description": "Extract requirements for the dma block", "goal_id": 1, "agent_type": "requirements", "depends_on": []},
      {"id": "node1", "description": "Implement the dma RTL candidate", "goal_id": 2, "agent_type": "rtl_implementation", "depends_on": ["node0"]},
      {"id": "node2", "description": "Check the dma candidate against its requirements", "goal_id": 2, "agent_type": "rtl_implementation", "depends_on": ["node1"]}
    ]
  }
