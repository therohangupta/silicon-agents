# Fleet manifest for the Errata Drafting agent (errata_drafting).
# Parsed by EdaAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: errata_drafting
  # UI label shown in the dashboard and logs.
  display_name: Errata and Issue-Drafting Agent
  # One-paragraph charter for planners and operators.
  description: Draft a traceable internal issue or erratum with reproduction steps, affected configurations,
    evidence, severity, and proposed mitigations.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Draft a traceable internal issue or erratum with reproduction steps, affected configurations,
  evidence, severity, and proposed mitigations.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the errata_drafting manifest: Create a draft issue
  - Create a draft issue
  # List entry consumed by the errata_drafting manifest: Cite primary evidence
  - Cite primary evidence
  # List entry consumed by the errata_drafting manifest: Write a draft erratum for human review
  - Write a draft erratum for human review
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the errata_drafting manifest: Close the issue
  - Close the issue
  # List entry consumed by the errata_drafting manifest: Publish customer errata without human approval
  - Publish customer errata without human approval
  # List entry consumed by the errata_drafting manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the errata_drafting manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the errata_drafting manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8270
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for errata_drafting (validation).
- id: draft_issue
  # One-paragraph charter for planners and operators.
  description: Draft an internal issue with reproduction steps and evidence.
# Manifest field '- id' for errata_drafting (validation).
- id: draft_errata
  # One-paragraph charter for planners and operators.
  description: Draft an erratum record for human review.
# Manifest field '- id' for errata_drafting (validation).
- id: write_reproduction_steps
  # One-paragraph charter for planners and operators.
  description: Write the steps that reproduce the issue.
# Manifest field '- id' for errata_drafting (validation).
- id: write_affected_configurations
  # One-paragraph charter for planners and operators.
  description: Write the revisions, modes, and conditions the issue affects.
# Manifest field '- id' for errata_drafting (validation).
- id: write_errata_severity
  # One-paragraph charter for planners and operators.
  description: Write the severity assessment and what it is based on.
# Manifest field '- id' for errata_drafting (validation).
- id: write_proposed_mitigation
  # One-paragraph charter for planners and operators.
  description: Write a proposed workaround. This does not approve it.
# Manifest field '- id' for errata_drafting (validation).
- id: cite_primary_evidence
  # One-paragraph charter for planners and operators.
  description: Attach the primary logs, waves, or measurements the draft relies on.
# Manifest field '- id' for errata_drafting (validation).
- id: read_source_finding
  # One-paragraph charter for planners and operators.
  description: Read the validated finding this draft is based on.
# Manifest field '- id' for errata_drafting (validation).
- id: diff_errata_drafts
  # One-paragraph charter for planners and operators.
  description: Show what changed between two drafts.
# Manifest field '- id' for errata_drafting (validation).
- id: flag_errata_without_evidence
  # One-paragraph charter for planners and operators.
  description: Publish a draft whose claims have no primary evidence.
# Manifest field '- id' for errata_drafting (validation).
- id: flag_customer_release_attempt
  # One-paragraph charter for planners and operators.
  description: Publish a request to release customer errata that has no human approval.
# Manifest field '- id' for errata_drafting (validation).
- id: record_errata_lineage
  # One-paragraph charter for planners and operators.
  description: Record the finding, evidence refs, and draft revision.
# Concrete tool bindings: module, callable, action, params.
skills:
# Manifest field '- id' for errata_drafting (validation).
- id: draft_issue
  # Python module (relative) that defines the callable.
  module: tools
  # Function name exported from tools.py.
  callable: draft_issue
  # One-paragraph charter for planners and operators.
  description: Draft an internal issue with reproduction steps and evidence.
  # Default argument values when the LLM omits them.
  args_defaults:
    # One-sentence finding text published to engineering memory.
    summary: ''
    # Comma-separated artifact URIs backing a finding.
    evidence_refs: ''
    # Finding severity: low, medium, high, or critical.
    severity: ''
    # Agent id that should act on a published finding.
    recommended_recipient: ''
  # ToolAction enum semantic (create_workflow, read_reports, …).
  action: publish_finding
