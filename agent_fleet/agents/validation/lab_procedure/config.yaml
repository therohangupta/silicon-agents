# Fleet manifest for the Lab Procedure agent (lab_procedure).
# Parsed by EdaAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: lab_procedure
  # UI label shown in the dashboard and logs.
  display_name: Lab Procedure Agent
  # One-paragraph charter for planners and operators.
  description: Turn bring-up intent into a versioned procedure with prerequisites, safe bounds, expected
    observations, rollback, and human-approval points.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Turn bring-up intent into a versioned procedure with prerequisites, safe bounds, expected
  observations, rollback, and human-approval points.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the lab_procedure manifest: Write a procedure draft
  - Write a procedure draft
  # List entry consumed by the lab_procedure manifest: List human approval points
  - List human approval points
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the lab_procedure manifest: Run the procedure
  - Run the procedure
  # List entry consumed by the lab_procedure manifest: Widen a safety bound
  - Widen a safety bound
  # List entry consumed by the lab_procedure manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the lab_procedure manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the lab_procedure manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8264
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for lab_procedure (validation).
- id: draft_lab_procedure
  # One-paragraph charter for planners and operators.
  description: Write prerequisites, steps, expected observations, and rollback.
# Manifest field '- id' for lab_procedure (validation).
- id: write_procedure_prerequisites
  # One-paragraph charter for planners and operators.
  description: Write the setup that must be true before the first step.
# Manifest field '- id' for lab_procedure (validation).
- id: write_safe_operating_bounds
  # One-paragraph charter for planners and operators.
  description: Write voltage, current, and temperature bounds. Bounds may only be copied from an approved
    limit.
# Manifest field '- id' for lab_procedure (validation).
- id: write_expected_observations
  # One-paragraph charter for planners and operators.
  description: Write the measurements that mean the step passed.
# Manifest field '- id' for lab_procedure (validation).
- id: write_rollback_steps
  # One-paragraph charter for planners and operators.
  description: Write how to return the bench to a safe state.
# Manifest field '- id' for lab_procedure (validation).
- id: write_approval_points
  # One-paragraph charter for planners and operators.
  description: Mark the steps that require a human before they run.
# Manifest field '- id' for lab_procedure (validation).
- id: revise_procedure_draft
  # One-paragraph charter for planners and operators.
  description: Edit a draft that has not been approved.
# Manifest field '- id' for lab_procedure (validation).
- id: read_bringup_intent
  # One-paragraph charter for planners and operators.
  description: Read the bring-up intent this procedure implements.
# Manifest field '- id' for lab_procedure (validation).
- id: list_approval_points
  # One-paragraph charter for planners and operators.
  description: List the steps that require a human before they run.
# Manifest field '- id' for lab_procedure (validation).
- id: diff_procedure_revisions
  # One-paragraph charter for planners and operators.
  description: Show what changed between two procedure revisions.
# Manifest field '- id' for lab_procedure (validation).
- id: flag_missing_rollback
  # One-paragraph charter for planners and operators.
  description: Publish a procedure with no rollback.
# Manifest field '- id' for lab_procedure (validation).
- id: flag_widened_safety_bound
  # One-paragraph charter for planners and operators.
  description: Publish a draft whose bounds exceed the approved limit.
# Manifest field '- id' for lab_procedure (validation).
- id: record_procedure_version
  # One-paragraph charter for planners and operators.
  description: Record the procedure revision and the intent it traces to.
# Concrete tool bindings: module, callable, action, params.
skills:
# Manifest field '- id' for lab_procedure (validation).
- id: draft_lab_procedure
  # Python module (relative) that defines the callable.
