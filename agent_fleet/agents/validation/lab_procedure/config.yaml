    candidate_ref: ''
    # Manifest field 'baseline_ref' for lab_procedure (validation).
    baseline_ref: ''
    # Manifest field 'hypothesis' for lab_procedure (validation).
    hypothesis: ''
  # ToolAction enum semantic (create_workflow, read_reports, …).
  action: write_candidate
  # Documented parameters the planner/LLM may fill.
  params:
  # Manifest field '- name' for lab_procedure (validation).
  - name: candidate_ref
    # One-paragraph charter for planners and operators.
    description: Isolated candidate to edit. Empty means create one from the baseline.
  # Manifest field '- name' for lab_procedure (validation).
  - name: baseline_ref
