  # One-paragraph charter for planners and operators.
  description: Record the board, lot, points, and prediction revision.
  # Default argument values when the LLM omits them.
  args_defaults:
    # One-sentence finding text published to engineering memory.
    summary: ''
    # Comma-separated artifact URIs backing a finding.
    evidence_refs: ''
    # Finding severity: low, medium, high, or critical.
    severity: ''
    # Agent id that should act on a published finding.
    recommended_recipient: ''
  # ToolAction enum semantic (create_workflow, read_reports, …).
  action: publish_finding
  # Documented parameters the planner/LLM may fill.
  params:
  # Manifest field '- name' for characterization (validation).
  - name: summary
    # One-paragraph charter for planners and operators.
    description: One-sentence finding.
  # Manifest field '- name' for characterization (validation).
  - name: evidence_refs
    # One-paragraph charter for planners and operators.
    description: Comma-separated artifact URIs that support the finding.
  # Manifest field '- name' for characterization (validation).
  - name: severity
    # One-paragraph charter for planners and operators.
    description: low, medium, high, or critical.
  # Manifest field '- name' for characterization (validation).
  - name: recommended_recipient
    # One-paragraph charter for planners and operators.
    description: Agent id that should act on the finding.
# Local and shared engineering-memory configuration.
memory:
  # Named memory stores this agent may touch.
  stores:
  # Manifest field '- id' for characterization (validation).
  - id: journal
    # One-paragraph charter for planners and operators.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend adapter type (none means tool_observation returns not_run).
    type: list
    # Where the store is kept (file vs ephemeral).
    persistence: file
    # Store-specific configuration block.
    config:
      # Filesystem root for silicon memory (env-substitutable).
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry stream configuration.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where skill_calls and artifacts are ingested.
  telemetry:
    # Telemetry service base URL (TELEMETRY_URL).
    endpoint: ${TELEMETRY_URL}
    # Named high-level telemetry stream categories.
    streams:
    # Manifest field '- name' for characterization (validation).
    - name: skill_calls
      # One-paragraph charter for planners and operators.
      description: Tool invocations.
    # Manifest field '- name' for characterization (validation).
    - name: artifacts
      # One-paragraph charter for planners and operators.
      description: Structured task results.
# Container image and Dockerfile pointers for compose.
deployment:
  # Published image tag for this agent.
  image: agentfleet/characterization:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Env vars injected into the container.
  environment:
    # Optional bound EDA/lab framework adapter name.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context assembly policy for engineering memory.
context:
  # Record kinds always preferred into the context package.
  include:
  # List entry consumed by the characterization manifest: experiments
  - experiments
  # List entry consumed by the characterization manifest: gates
  - gates
  # List entry consumed by the characterization manifest: decisions
  - decisions
  # List entry consumed by the characterization manifest: open_findings
  - open_findings
  # List entry consumed by the characterization manifest: canonical_source
  - canonical_source
  # Record kinds filtered out before ranking.
  exclude:
  # List entry consumed by the characterization manifest: stale_candidates
  - stale_candidates
  # Validation states removed before context ranking.
  drop:
  # List entry consumed by the characterization manifest: rejected
  - rejected
  # Most-trusted authorship/validation states first.
  precedence:
  # List entry consumed by the characterization manifest: validated
  - validated
  # List entry consumed by the characterization manifest: provisional
  - provisional
  # States never dropped solely for token budget.
  protect: []
  # Approximate token cap for the assembled context package.
  token_budget: 80000
