  description: Write the temperature points inside the approved bound.
# Manifest field '- id' for characterization (validation).
- id: define_workload_points
  # One-paragraph charter for planners and operators.
  description: Write the workloads the sweep will run.
# Manifest field '- id' for characterization (validation).
- id: check_sweep_against_bounds
  # One-paragraph charter for planners and operators.
  description: Check every point against the approved voltage, current, and temperature limits.
# Manifest field '- id' for characterization (validation).
- id: submit_sweep_point
  # One-paragraph charter for planners and operators.
  description: Submit one sweep point to the lab adapter.
# Manifest field '- id' for characterization (validation).
- id: submit_sweep_batch
  # One-paragraph charter for planners and operators.
  description: Submit the approved points as one batch.
# Manifest field '- id' for characterization (validation).
- id: read_sweep_measurements
  # One-paragraph charter for planners and operators.
  description: Read measured shmoo and workload results, including outliers.
# Manifest field '- id' for characterization (validation).
- id: fit_operating_envelope
  # One-paragraph charter for planners and operators.
  description: Fit the measured envelope and the guardband. Outliers stay in the fit.
# Manifest field '- id' for characterization (validation).
- id: compare_with_presilicon
  # One-paragraph charter for planners and operators.
  description: Compare the measured distribution with the pre-silicon prediction.
# Manifest field '- id' for characterization (validation).
- id: flag_sweep_outlier
  # One-paragraph charter for planners and operators.
  description: Publish an outlier that the guardband must include.
# Manifest field '- id' for characterization (validation).
- id: flag_out_of_bounds_point
  # One-paragraph charter for planners and operators.
  description: Publish a requested point that sits outside the approved bounds. It must not be submitted.
# Manifest field '- id' for characterization (validation).
- id: record_characterization_provenance
  # One-paragraph charter for planners and operators.
  description: Record the board, lot, points, and prediction revision.
