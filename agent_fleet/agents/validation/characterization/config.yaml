# Fleet manifest for the Characterization agent (characterization).
# Parsed by EdaAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: characterization
  # UI label shown in the dashboard and logs.
  display_name: Characterization Agent
  # One-paragraph charter for planners and operators.
  description: Plan and execute voltage, frequency, temperature, and workload sweeps inside approved bounds,
    fit the operating envelope, and compare it with pre-silicon predictions.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Plan and execute voltage, frequency, temperature, and workload sweeps inside approved
  bounds, fit the operating envelope, and compare it with pre-silicon predictions.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the characterization manifest: Write a sweep plan
  - Write a sweep plan
  # List entry consumed by the characterization manifest: Submit sweep points that sit inside approved bounds
  - Submit sweep points that sit inside approved bounds
  # List entry consumed by the characterization manifest: Publish an operating envelope
  - Publish an operating envelope
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the characterization manifest: Submit a point outside the approved bounds
  - Submit a point outside the approved bounds
  # List entry consumed by the characterization manifest: Drop an outlier to tighten a guardband
  - Drop an outlier to tighten a guardband
  # List entry consumed by the characterization manifest: Widen a safety bound
  - Widen a safety bound
  # List entry consumed by the characterization manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the characterization manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the characterization manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8268
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for characterization (validation).
- id: plan_pvt_sweep
  # One-paragraph charter for planners and operators.
  description: Plan a voltage, frequency, temperature, and workload sweep.
# Manifest field '- id' for characterization (validation).
- id: define_voltage_points
  # One-paragraph charter for planners and operators.
  description: Write the voltage points. Each point must sit inside the approved bound.
# Manifest field '- id' for characterization (validation).
- id: define_frequency_points
  # One-paragraph charter for planners and operators.
  description: Write the frequency points.
# Manifest field '- id' for characterization (validation).
- id: define_temperature_points
