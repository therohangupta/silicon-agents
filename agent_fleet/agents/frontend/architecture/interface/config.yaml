# Agent specification for Interface Agent (`interface`).
# Stage: architecture. Role: worker. HTTP port: 8205.
# Interface contracts define signals, ordering, errors, and performance between blocks, plus the assertions and coverpoints those contracts imply for later verification.
# Every key below is loaded by EdaAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `interface` used in routing and telemetry.
  name: interface
  # Dashboard title for `interface`.
  display_name: Interface Agent
  # Charter shown to planners and operators.
  description: Define inter-block protocols and contracts, including the assertions those contracts imply.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `architecture` for planner routing.
    stage: architecture
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `architecture` for planner routing.
stage: architecture
# Charter repeated at the top level for validators and planners.
responsibility: Define inter-block protocols and contracts, including the assertions those contracts imply.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read block boundaries and requirements
  - Read block boundaries and requirements
  # Allowed action: Write an interface contract into an isolated candidate
  - Write an interface contract into an isolated candidate
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Change block ownership
  - Change block ownership
  # Forbidden action: Weaken a protocol to hide a failed assertion
  - Weaken a protocol to hide a failed assertion
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8205).
  port: 8205
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `define_interface_contract` under `capabilities` for `interface`.
- id: define_interface_contract
  # One-line charter of what this agent owns in the chip flow.
  description: Write the signals, ordering, and error behavior for one interface.
# Identifier `define_signal_list` under `capabilities` for `interface`.
- id: define_signal_list
  # One-line charter of what this agent owns in the chip flow.
  description: Write names, widths, directions, and reset values for one interface.
# Identifier `define_ordering_rules` under `capabilities` for `interface`.
- id: define_ordering_rules
  # One-line charter of what this agent owns in the chip flow.
  description: Write legal transaction ordering and outstanding-count rules.
# Identifier `define_error_behavior` under `capabilities` for `interface`.
- id: define_error_behavior
  # One-line charter of what this agent owns in the chip flow.
  description: Write how the interface reports and recovers from an error.
# Identifier `define_performance_contract` under `capabilities` for `interface`.
- id: define_performance_contract
  # One-line charter of what this agent owns in the chip flow.
  description: Write bandwidth, latency, and backpressure obligations.
# Identifier `generate_interface_assertions` under `capabilities` for `interface`.
- id: generate_interface_assertions
  # One-line charter of what this agent owns in the chip flow.
  description: Draft assertions that check this interface contract, not general block properties.
# Identifier `generate_interface_coverpoints` under `capabilities` for `interface`.
- id: generate_interface_coverpoints
  # One-line charter of what this agent owns in the chip flow.
  description: Draft coverpoints for the legal and illegal transactions of this interface.
# Identifier `revise_interface_draft` under `capabilities` for `interface`.
- id: revise_interface_draft
  # One-line charter of what this agent owns in the chip flow.
  description: Edit a draft contract that has not been qualified.
# Identifier `read_interface_contract` under `capabilities` for `interface`.
- id: read_interface_contract
  # One-line charter of what this agent owns in the chip flow.
  description: Read the current contract for one interface.
# Identifier `diff_interface_revisions` under `capabilities` for `interface`.
- id: diff_interface_revisions
  # One-line charter of what this agent owns in the chip flow.
  description: Show what changed between two contract revisions.
# Identifier `check_contract_against_ports` under `capabilities` for `interface`.
- id: check_contract_against_ports
  # One-line charter of what this agent owns in the chip flow.
  description: Compare the contract signal list with the RTL or netlist ports.
# Identifier `flag_protocol_conflict` under `capabilities` for `interface`.
- id: flag_protocol_conflict
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a contract clause that contradicts a requirement or another interface.
# Binding of capability ids to Python callables and action kinds.
skills:
# Identifier `define_interface_contract` under `skills` for `interface`.
- id: define_interface_contract
  # Module path exporting the skill callable (always `tools` here).
  module: tools
  # Python function in tools.py implementing this skill.
  callable: define_interface_contract
  # One-line charter of what this agent owns in the chip flow.
  description: Write the signals, ordering, and error behavior for one interface.
  # Default argument values when the planner omits them.
  args_defaults:
    # Artifact URI of the isolated design candidate this skill reads or edits; empty often means create-from-baseline.
    candidate_ref: ''
    # Immutable baseline revision the candidate must descend from so lineage stays auditable.
    baseline_ref: ''
    # Single change under test for this edit so experiments stay one-hypothesis-at-a-time.
    hypothesis: ''
    # Stable id of an inter-block interface contract.
    interface_id: ''
  # Mutates only an isolated candidate branch, never the canonical baseline.
  action: write_candidate
  # Documented parameter list for UI and schema generation.
  params:
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: candidate_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Isolated candidate to edit. Empty means create one from the baseline.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: baseline_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Immutable baseline the candidate must descend from.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: hypothesis
    # One-line charter of what this agent owns in the chip flow.
    description: The single change this edit is testing.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: interface_id
    # One-line charter of what this agent owns in the chip flow.
    description: Interface being defined.
