# AgentFleet config for ``coverage`` — functional/code/assertion coverage model and hole analysis specialist.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``coverage`` used across the verification plan graph.
  name: coverage
  # Human-readable title shown in UIs and docs.
  display_name: Coverage Agent
  # Responsibility brief for this verification specialist.
  description: Write the coverage model from requirements, then analyze code, functional, and assertion
    coverage and list meaningful holes.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Write the coverage model from requirements, then analyze code, functional, and assertion
  coverage and list meaningful holes.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for coverage: Write the coverage model on an isolated branch
  - Write the coverage model on an isolated branch
  # Boundary rule for coverage: Read coverage databases
  - Read coverage databases
  # Boundary rule for coverage: Publish holes and suspected unreachable items
  - Publish holes and suspected unreachable items
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for coverage: Delete a coverpoint to raise a score
  - Delete a coverpoint to raise a score
  # Boundary rule for coverage: Edit RTL
  - Edit RTL
  # Boundary rule for coverage: Mark an item unreachable without evidence
  - Mark an item unreachable without evidence
  # Boundary rule for coverage: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for coverage: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for coverage: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8220 for the coverage AgentService (must match Dockerfile EXPOSE).
  port: 8220
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``write_functional_coverage_model`` — must stay aligned with tools.py / plan references.
- id: write_functional_coverage_model
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Write covergroups and bins from the requirements and interface contract.
# Identifier ``write_assertion_coverage_model`` — must stay aligned with tools.py / plan references.
- id: write_assertion_coverage_model
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Write assertion-coverage tracking for the property set.
# Identifier ``write_code_coverage_config`` — must stay aligned with tools.py / plan references.
- id: write_code_coverage_config
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Write the code-coverage configuration for this block.
# Identifier ``bind_covergroups`` — must stay aligned with tools.py / plan references.
- id: bind_covergroups
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Bind covergroups to the monitors in the isolated branch.
# Identifier ``read_coverage_database`` — must stay aligned with tools.py / plan references.
- id: read_coverage_database
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Read the merged coverage database for one regression.
# Identifier ``merge_coverage_databases`` — must stay aligned with tools.py / plan references.
- id: merge_coverage_databases
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Merge coverage databases and return the combined score.
# Identifier ``analyze_code_coverage`` — must stay aligned with tools.py / plan references.
- id: analyze_code_coverage
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Summarize line, toggle, and branch coverage.
# Identifier ``analyze_functional_coverage`` — must stay aligned with tools.py / plan references.
- id: analyze_functional_coverage
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Summarize covergroup and bin coverage.
# Identifier ``analyze_assertion_coverage`` — must stay aligned with tools.py / plan references.
- id: analyze_assertion_coverage
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Summarize which assertions fired.
# Identifier ``list_coverage_holes`` — must stay aligned with tools.py / plan references.
- id: list_coverage_holes
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: List uncovered items with their requirement ids.
# Identifier ``list_suspected_unreachable`` — must stay aligned with tools.py / plan references.
- id: list_suspected_unreachable
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: List items that look unreachable, with the evidence, without excluding them.
# Identifier ``diff_coverage_against_requirements`` — must stay aligned with tools.py / plan references.
- id: diff_coverage_against_requirements
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: List requirements that have no coverpoint.
# Identifier ``flag_coverage_exclusion`` — must stay aligned with tools.py / plan references.
- id: flag_coverage_exclusion
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Publish an exclusion that raises the score without a reviewed rationale.
# Identifier ``record_coverage_model_version`` — must stay aligned with tools.py / plan references.
- id: record_coverage_model_version
  # YAML key ``description`` for the coverage agent (functional/code/assertion coverage model and hole analysis specialist).
  description: Record the coverage model revision and the regression it was graded on.
