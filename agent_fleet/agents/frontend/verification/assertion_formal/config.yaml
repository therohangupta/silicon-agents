# AgentFleet config for ``assertion_formal`` — SVA/formal property and proof campaign specialist.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``assertion_formal`` used across the verification plan graph.
  name: assertion_formal
  # Human-readable title shown in UIs and docs.
  display_name: Assertion/Formal Agent
  # Responsibility brief for this verification specialist.
  description: Create properties and assumptions, and submit formal proof tasks.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Create properties and assumptions, and submit formal proof tasks.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for assertion_formal: Write assertions on an isolated branch
  - Write assertions on an isolated branch
  # Boundary rule for assertion_formal: Submit a formal job
  - Submit a formal job
  # Boundary rule for assertion_formal: Classify counterexamples
  - Classify counterexamples
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for assertion_formal: Add an assumption that hides a failure
  - Add an assumption that hides a failure
  # Boundary rule for assertion_formal: Edit RTL
  - Edit RTL
  # Boundary rule for assertion_formal: Approve a waiver
  - Approve a waiver
  # Boundary rule for assertion_formal: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for assertion_formal: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for assertion_formal: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8218 for the assertion_formal AgentService (must match Dockerfile EXPOSE).
  port: 8218
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``generate_assertions`` — must stay aligned with tools.py / plan references.
- id: generate_assertions
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Write properties for the named requirements.
# Identifier ``write_formal_assumptions`` — must stay aligned with tools.py / plan references.
- id: write_formal_assumptions
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Write environment assumptions. Each assumption cites the contract clause that justifies
    it.
# Identifier ``write_cover_properties`` — must stay aligned with tools.py / plan references.
- id: write_cover_properties
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Write cover properties for the legal scenarios the proof must reach.
# Identifier ``write_assertion_bind`` — must stay aligned with tools.py / plan references.
- id: write_assertion_bind
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Write the bind file that attaches properties to the candidate.
# Identifier ``read_formal_requirements`` — must stay aligned with tools.py / plan references.
- id: read_formal_requirements
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Read the requirements this proof is responsible for.
# Identifier ``submit_formal`` — must stay aligned with tools.py / plan references.
- id: submit_formal
  # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
  description: Submit the property manifest to the bound formal engine.
# Identifier ``read_formal_results`` — must stay aligned with tools.py / plan references.
- id: read_formal_results
