# Local memory configuration layered on shared silicon engineering memory.
memory:
  # Named memory stores this agent may read/write.
  stores:
  # Identifier ``journal`` — must stay aligned with tools.py / plan references.
  - id: journal
    # Human/LLM-facing description of the verification operation.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Memory store type or parameter type depending on parent context.
    type: list
    # How the memory store is persisted (file, ephemeral, …).
    persistence: file
    # Store-specific configuration block.
    config:
      # Filesystem path for file-backed memory (env-expandable).
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry streams for verification operations.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Telemetry sink configuration.
  telemetry:
    # Telemetry collector URL (env-overridable).
    endpoint: ${TELEMETRY_URL}
    # Named streams (skill_calls, artifacts, etc.).
    streams:
    # YAML key ``name`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
    - name: skill_calls
      # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
      description: Tool invocations.
    # YAML key ``name`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
    - name: artifacts
      # YAML key ``description`` for the assertion_formal agent (SVA/formal property and proof campaign specialist).
      description: Structured task results.
# Container image metadata for this specialist.
deployment:
  # Image repository:tag for compose/k8s deployment.
  image: agentfleet/assertion_formal:1.0
  # Dockerfile path relative to this agent directory.
  dockerfile: Dockerfile
  # Environment variables injected at runtime.
  environment:
    # Optional framework adapter selector; empty means unbound.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Which engineering-memory slices are included in the LLM context window.
context:
  # Memory categories to include (gates, findings, decisions, …).
  include:
  # include entry ``requirements`` for assertion_formal.
  - requirements
  # include entry ``interface_contracts`` for assertion_formal.
  - interface_contracts
  # include entry ``canonical_source`` for assertion_formal.
  - canonical_source
  # include entry ``open_findings`` for assertion_formal.
  - open_findings
  # include entry ``experiments`` for assertion_formal.
  - experiments
  # include entry ``decisions`` for assertion_formal.
  - decisions
  # Categories to omit from context packing.
  exclude:
  # exclude entry ``stale_candidates`` for assertion_formal.
  - stale_candidates
  # Statuses to drop (e.g. rejected candidates).
  drop:
  # drop entry ``rejected`` for assertion_formal.
  - rejected
  # Priority order when packing conflicting memory items.
  precedence:
  # precedence entry ``human-authored`` for assertion_formal.
  - human-authored
  # precedence entry ``validated`` for assertion_formal.
  - validated
  # precedence entry ``provisional`` for assertion_formal.
  - provisional
  # Items that must not be dropped under token pressure.
  protect:
  # protect entry ``human-authored`` for assertion_formal.
  - human-authored
  # Max tokens for packed verification context.
  token_budget: 80000
