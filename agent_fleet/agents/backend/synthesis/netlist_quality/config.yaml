# Agent manifest for Netlist Quality (role=worker, stage=synthesis, port=8237).
# EDA focus: Structural netlist audit: loops, fanout, unmapped/dont-use cells, DFT survival, QoR regressions.
# Every mapping key and list entry has a comment; multi-line string values are untouched.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; Agent means a runnable chip-design agent service.
kind: Agent
# Human- and registry-facing identity for this agent.
metadata:
  # Stable agent id used in delegation graphs, findings, and telemetry.
  name: netlist_quality
  # UI-facing title for operators and dashboards.
  display_name: Netlist Quality Agent
  # One-paragraph responsibility statement shown in registries and UIs.
  description: Inspect a netlist for structural defects, high fanout, loops, poor mappings, congestion
    risks, DFT incompatibilities, and suspicious QoR regressions.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent belongs to in the backend flow.
    stage: synthesis
    # lead orchestrates workers; worker executes specialist tools.
    role: worker
# lead orchestrates workers; worker executes specialist tools.
role: worker
# Pipeline stage this agent belongs to in the backend flow.
stage: synthesis
# Authoritative responsibility text mirrored from the design system.
responsibility: Inspect a netlist for structural defects, high fanout, loops, poor mappings, congestion
  risks, DFT incompatibilities, and suspicious QoR regressions.
# Hard may / may_not rules the runtime enforces on tool actions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Entry under `may` for Netlist Quality: Read the netlist and QoR report
  - Read the netlist and QoR report
  # Entry under `may` for Netlist Quality: Submit structural checks
  - Submit structural checks
  # Entry under `may` for Netlist Quality: Publish structural findings
  - Publish structural findings
  # Actions this agent must never perform (promotion, waivers, etc.).
  may_not:
  # Entry under `may_not` for Netlist Quality: Edit the netlist
  - Edit the netlist
  # Entry under `may_not` for Netlist Quality: Ignore a combinational loop
  - Ignore a combinational loop
  # Entry under `may_not` for Netlist Quality: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Entry under `may_not` for Netlist Quality: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Entry under `may_not` for Netlist Quality: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows toward.
delegates_to: []
# Optional validator agent ids that must confirm outcomes.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname inside Docker networks (host.docker.internal for local).
  host: host.docker.internal
  # TCP port this agent's uvicorn server listens on.
  port: 8237
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness/readiness path probed by the fleet.
    health: /health
    # Path that accepts AgentTaskRequest payloads.
    execute: /tasks/execute
# Tool-backend binding; type none means observations are not_run until bound.
backend:
  # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
  type: none
# How the agent runs tools for a task.
execution:
  # direct_function invokes Python callables named in skills.
  mode: direct_function
  # Limits on parallel task handling inside one process.
  concurrency:
    # Maximum simultaneous tasks (1 keeps experiment isolation simple).
    max_tasks: 1
# Timeouts, retries, and failure policy for task handling.
reliability:
  # Wall-clock seconds before a task is considered failed.
  task_timeout_secs: 120
  # How many times the fleet may retry a failed task.
  max_retries: 1
  # Policy when tools fail (replan asks the lead to adjust the graph).
  on_failure: replan
# Declared capability ids surfaced to planners (mirrors skills).
capabilities:
# Stable identifier for this list entry.
- id: inspect_netlist_structure
  # Human-readable description for this manifest entry.
  description: Check loops, undriven logic, high fanout, and unmapped cells.
# Stable identifier for this list entry.
- id: check_high_fanout_nets
  # Human-readable description for this manifest entry.
  description: List nets over the fanout limit.
# Stable identifier for this list entry.
- id: check_undriven_and_unused
  # Human-readable description for this manifest entry.
  description: List undriven, unused, and multiply driven nets.
# Stable identifier for this list entry.
- id: check_unmapped_cells
  # Human-readable description for this manifest entry.
  description: List cells with no library mapping.
# Stable identifier for this list entry.
- id: check_dont_use_violations
  # Human-readable description for this manifest entry.
  description: List cells the library contract marks dont-use.
# Stable identifier for this list entry.
- id: check_dft_scan_compatibility
  # Human-readable description for this manifest entry.
  description: Check that scan cells and test clocks survived synthesis.
# Stable identifier for this list entry.
- id: check_congestion_risk_cells
  # Human-readable description for this manifest entry.
  description: List mappings that are likely to congest placement.
# Stable identifier for this list entry.
- id: read_qor_baseline
  # Human-readable description for this manifest entry.
  description: Read the baseline QoR this netlist is compared with.
# Stable identifier for this list entry.
- id: flag_qor_regressions
  # Human-readable description for this manifest entry.
  description: Publish QoR regressions against the recorded baseline.
# Stable identifier for this list entry.
- id: flag_combinational_loop_in_netlist
  # Human-readable description for this manifest entry.
  description: Publish a combinational loop.
# Stable identifier for this list entry.
- id: flag_dft_incompatible_netlist
  # Human-readable description for this manifest entry.
  description: Publish a netlist that dropped scan or test clocks.
# Stable identifier for this list entry.
- id: record_netlist_quality_evidence
  # Human-readable description for this manifest entry.
  description: Record the netlist ref and the checks that ran.
