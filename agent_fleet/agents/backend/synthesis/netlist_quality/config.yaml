    baseline_ref: ''
    # Field `recipe` in the Netlist Quality agent manifest (synthesis stage, role worker).
    recipe: ''
    # PVT corner filter for report reads.
    corner: ''
    # Operating-mode filter for report reads; empty means every mode.
    mode: ''
