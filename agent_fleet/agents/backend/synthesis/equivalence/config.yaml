# Agent manifest for Equivalence (role=worker, stage=synthesis, port=8236).
# EDA focus: Logical and sequential equivalence between RTL and netlist; setup vs functional triage.
# Every mapping key and list entry has a comment; multi-line string values are untouched.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; Agent means a runnable chip-design agent service.
kind: Agent
# Human- and registry-facing identity for this agent.
metadata:
  # Stable agent id used in delegation graphs, findings, and telemetry.
  name: equivalence
  # UI-facing title for operators and dashboards.
  display_name: Equivalence Agent
  # One-paragraph responsibility statement shown in registries and UIs.
  description: Run and debug logical or sequential equivalence between RTL and a transformed implementation,
    and separate real divergence from setup or constraint problems. This is a check, not an independent
    gate.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent belongs to in the backend flow.
    stage: synthesis
    # lead orchestrates workers; worker executes specialist tools.
    role: worker
# lead orchestrates workers; worker executes specialist tools.
role: worker
# Pipeline stage this agent belongs to in the backend flow.
stage: synthesis
# Authoritative responsibility text mirrored from the design system.
responsibility: Run and debug logical or sequential equivalence between RTL and a transformed implementation,
  and separate real divergence from setup or constraint problems. This is a check, not an independent
  gate.
# Hard may / may_not rules the runtime enforces on tool actions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Entry under `may` for Equivalence: Submit an equivalence job
  - Submit an equivalence job
  # Entry under `may` for Equivalence: Write compare setup on an isolated workspace
  - Write compare setup on an isolated workspace
  # Entry under `may` for Equivalence: Publish failing compare points
  - Publish failing compare points
  # Actions this agent must never perform (promotion, waivers, etc.).
  may_not:
  # Entry under `may_not` for Equivalence: Edit either design
  - Edit either design
  # Entry under `may_not` for Equivalence: Map away a compare point to force a pass
  - Map away a compare point to force a pass
  # Entry under `may_not` for Equivalence: Emit a signoff gate
  - Emit a signoff gate
  # Entry under `may_not` for Equivalence: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Entry under `may_not` for Equivalence: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Entry under `may_not` for Equivalence: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows toward.
delegates_to: []
# Optional validator agent ids that must confirm outcomes.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname inside Docker networks (host.docker.internal for local).
  host: host.docker.internal
  # TCP port this agent's uvicorn server listens on.
  port: 8236
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness/readiness path probed by the fleet.
    health: /health
    # Path that accepts AgentTaskRequest payloads.
    execute: /tasks/execute
# Tool-backend binding; type none means observations are not_run until bound.
backend:
  # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
  type: none
# How the agent runs tools for a task.
execution:
  # direct_function invokes Python callables named in skills.
  mode: direct_function
  # Limits on parallel task handling inside one process.
  concurrency:
    # Maximum simultaneous tasks (1 keeps experiment isolation simple).
    max_tasks: 1
# Timeouts, retries, and failure policy for task handling.
reliability:
  # Wall-clock seconds before a task is considered failed.
  task_timeout_secs: 120
  # How many times the fleet may retry a failed task.
  max_retries: 1
  # Policy when tools fail (replan asks the lead to adjust the graph).
  on_failure: replan
# Declared capability ids surfaced to planners (mirrors skills).
capabilities:
# Stable identifier for this list entry.
- id: write_equivalence_setup
  # Human-readable description for this manifest entry.
  description: Write the compare setup, libraries, and black-box list. This does not edit either design.
# Stable identifier for this list entry.
- id: write_compare_point_map
  # Human-readable description for this manifest entry.
  description: Write an explicit compare-point map. Every mapped-away point needs a justification.
# Stable identifier for this list entry.
- id: run_logical_equivalence
  # Human-readable description for this manifest entry.
  description: Run combinational equivalence between RTL and the netlist.
# Stable identifier for this list entry.
- id: run_sequential_equivalence
  # Human-readable description for this manifest entry.
  description: Run sequential equivalence when retiming or restructuring moved state.
# Stable identifier for this list entry.
- id: read_failing_compare_points
  # Human-readable description for this manifest entry.
  description: Read compare points that failed.
# Stable identifier for this list entry.
- id: read_aborted_compare_points
  # Human-readable description for this manifest entry.
  description: Read compare points the tool aborted.
# Stable identifier for this list entry.
- id: read_unmapped_points
  # Human-readable description for this manifest entry.
  description: Read points present on only one side.
# Stable identifier for this list entry.
- id: classify_compare_points
  # Human-readable description for this manifest entry.
  description: Separate functional mismatches from constraint or setup problems.
# Stable identifier for this list entry.
- id: trace_mismatch_cone
  # Human-readable description for this manifest entry.
  description: Trace one failing compare point to the cone that diverges.
# Stable identifier for this list entry.
- id: flag_mapped_away_point
  # Human-readable description for this manifest entry.
  description: Publish a compare point removed from the map without justification.
# Stable identifier for this list entry.
- id: flag_setup_mismatch
  # Human-readable description for this manifest entry.
  description: Publish a failure caused by a missing clock, black box, or constraint.
# Stable identifier for this list entry.
