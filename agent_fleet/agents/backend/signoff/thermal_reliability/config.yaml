# Agent Fleet manifest for Thermal and Reliability Agent (thermal_reliability).
# Domain: thermal, aging, variation, and reliability margins.
# EDA focus: hotspots, aging margins, thermal feedback to leakage/delay, package assumptions.
# Loaded by agent.py via EdaAgent.read_spec and by server.py via AgentService.from_agent.
# HTTP port 8259 must stay aligned with connection.port, Dockerfile EXPOSE, and deployment.

# Agent Fleet manifest schema version for this Agent resource.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for fleet loaders.
kind: Agent
# Identity and labeling block consumed by discovery and observability.
metadata:
  # Stable agent id `thermal_reliability` used in tool_observation and fleet routing.
  name: thermal_reliability
  # Human-readable agent title shown in UIs and journals.
  display_name: Thermal and Reliability Agent
  # Short charter describing what this signoff agent is responsible for.
  description: Evaluate temperature, aging, variation, and reliability margins, and turn risks into constraints
    or an isolated physical change.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent participates in.
    stage: signoff
    # Fleet role: worker executes tools; lead plans and delegates.
    role: worker
# Fleet role: worker executes tools; lead plans and delegates.
role: worker
# Pipeline stage this agent participates in.
stage: signoff
# Authoritative one-paragraph responsibility used in prompts and docs.
responsibility: Evaluate temperature, aging, variation, and reliability margins, and turn risks into constraints
  or an isolated physical change.
# Hard may / may_not contract enforced by policy and reviewers.
boundary:
  # Operations this agent is allowed to perform in the signoff flow.
  may:
  # Signoff boundary or context item: Read thermal and aging reports
  - Read thermal and aging reports
  # Signoff boundary or context item: Write a proposed constraint or an isolated physical change
  - Write a proposed constraint or an isolated physical change
  # Signoff boundary or context item: Publish a reliability finding
  - Publish a reliability finding
  # Forbidden actions (waiver, promote, edit canonical baseline, etc.).
  may_not:
  # Signoff boundary or context item: Raise a temperature limit to pass
  - Raise a temperature limit to pass
  # Signoff boundary or context item: Edit the package
  - Edit the package
  # Signoff boundary or context item: Edit the canonical database
  - Edit the canonical database
  # Signoff boundary or context item: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Signoff boundary or context item: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Signoff boundary or context item: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks against (empty for pure workers).
delegates_to: []
# Independent validators that must grade this agent's outputs (often empty).
validators: []
# Network binding for the HTTP AgentService inside Docker.
connection:
  # Docker-published host reachable from other fleet services.
  host: host.docker.internal
  # TCP port 8259 for this agent's AgentService (must match Dockerfile EXPOSE).
  port: 8259
  # HTTP paths for health probes and task execution.
  endpoints:
    # Liveness/readiness path returning service health.
    health: /health
    # Path that accepts execute-task requests from the orchestrator.
    execute: /tasks/execute
# LLM/tool backend binding; type none means tools are observations until adapted.
backend:
  # Backend type discriminator for the agent runtime.
  type: none
# How skills are invoked when a task arrives.
execution:
  # Functional/analysis mode filter or target.
  mode: direct_function
  # Limits on parallel signoff jobs for this container.
  concurrency:
    # Maximum concurrent tasks; signoff tools are often serialized at 1.
    max_tasks: 1
# Timeouts and failure policy for long EDA jobs.
reliability:
  # Wall seconds before a hanging tool job is aborted.
  task_timeout_secs: 120
  # Retries before the orchestrator must replan.
  max_retries: 1
  # Orchestrator action when the task fails after retries.
  on_failure: replan
# Advertised capability ids matching tools (discovery surface).
capabilities:
# Stable capability or skill or stream identifier.
- id: read_thermal_map
  # Short charter describing what this signoff agent is responsible for.
  description: Read the temperature distribution.
# Stable capability or skill or stream identifier.
- id: evaluate_thermal_map
  # Short charter describing what this signoff agent is responsible for.
  description: Summarize hotspots and the power sources under them.
# Stable capability or skill or stream identifier.
- id: read_aging_report
  # Short charter describing what this signoff agent is responsible for.
  description: Read aging and variation margins.
# Stable capability or skill or stream identifier.
- id: evaluate_aging_margin
  # Short charter describing what this signoff agent is responsible for.
  description: Report aging and variation margins that miss the requirement.
# Stable capability or skill or stream identifier.
- id: read_reliability_limits
  # Short charter describing what this signoff agent is responsible for.
  description: Read the temperature, EM, and aging limits.
# Stable capability or skill or stream identifier.
- id: write_thermal_constraint_proposal
  # Short charter describing what this signoff agent is responsible for.
  description: Write a proposed timing or placement constraint. This does not edit the canonical constraints.
# Stable capability or skill or stream identifier.
- id: apply_thermal_physical_change
  # Short charter describing what this signoff agent is responsible for.
  description: Apply one physical change on an isolated candidate.
# Stable capability or skill or stream identifier.
- id: check_thermal_feedback
  # Short charter describing what this signoff agent is responsible for.
  description: Check how the temperature map changes leakage and delay.
# Stable capability or skill or stream identifier.
- id: compare_thermal_to_limit
  # Short charter describing what this signoff agent is responsible for.
  description: Compare hotspot temperature with the limit.
# Stable capability or skill or stream identifier.
- id: flag_hotspot_over_limit
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a hotspot over the temperature limit.
# Stable capability or skill or stream identifier.
- id: flag_raised_thermal_limit
  # Short charter describing what this signoff agent is responsible for.
  description: Publish an analysis that passed only because a limit was raised.
# Stable capability or skill or stream identifier.
- id: record_thermal_provenance
  # Short charter describing what this signoff agent is responsible for.
  description: Record the thermal model, power map, and package assumption.
