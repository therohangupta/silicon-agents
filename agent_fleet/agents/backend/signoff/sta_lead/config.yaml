# Agent Fleet manifest for STA Lead (sta_lead).
# Domain: multi-mode multi-corner (MMMC) static timing ownership.
# EDA focus: MMMC coverage, path-group repair coordination, constraint edit requests.
# Loaded by agent.py via EdaAgent.read_spec and by server.py via AgentService.from_agent.
# HTTP port 8255 must stay aligned with connection.port, Dockerfile EXPOSE, and deployment.

# Agent Fleet manifest schema version for this Agent resource.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for fleet loaders.
kind: Agent
# Identity and labeling block consumed by discovery and observability.
metadata:
  # Stable agent id `sta_lead` used in tool_observation and fleet routing.
  name: sta_lead
  # Human-readable agent title shown in UIs and journals.
  display_name: STA Lead
  # Short charter describing what this signoff agent is responsible for.
  description: Own multi-mode multi-corner static timing. Classify failures, trace causes, and coordinate
    bounded repairs.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent participates in.
    stage: signoff
    # Fleet role: worker executes tools; lead plans and delegates.
    role: lead
# Fleet role: worker executes tools; lead plans and delegates.
role: lead
# Pipeline stage this agent participates in.
stage: signoff
# Authoritative one-paragraph responsibility used in prompts and docs.
responsibility: Own multi-mode multi-corner static timing. Classify failures, trace causes, and coordinate
  bounded repairs.
# Hard may / may_not contract enforced by policy and reviewers.
boundary:
  # Operations this agent is allowed to perform in the signoff flow.
  may:
  # Signoff boundary or context item: Publish a timing-debug workflow
  - Publish a timing-debug workflow
  # Signoff boundary or context item: Read extracted parasitics and constraints
  - Read extracted parasitics and constraints
  # Signoff boundary or context item: Request a human decision on a timing tradeoff
  - Request a human decision on a timing tradeoff
  # Forbidden actions (waiver, promote, edit canonical baseline, etc.).
  may_not:
  # Signoff boundary or context item: Change a constraint to close timing
  - Change a constraint to close timing
  # Signoff boundary or context item: Accept a single-corner report as signoff
  - Accept a single-corner report as signoff
  # Signoff boundary or context item: Promote a timing ECO
  - Promote a timing ECO
  # Signoff boundary or context item: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Signoff boundary or context item: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Signoff boundary or context item: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks against (empty for pure workers).
delegates_to:
# Signoff boundary or context item: timing_debug
- timing_debug
# Independent validators that must grade this agent's outputs (often empty).
validators: []
# Network binding for the HTTP AgentService inside Docker.
connection:
  # Docker-published host reachable from other fleet services.
  host: host.docker.internal
  # TCP port 8255 for this agent's AgentService (must match Dockerfile EXPOSE).
  port: 8255
  # HTTP paths for health probes and task execution.
  endpoints:
    # Liveness/readiness path returning service health.
    health: /health
    # Path that accepts execute-task requests from the orchestrator.
    execute: /tasks/execute
# LLM/tool backend binding; type none means tools are observations until adapted.
backend:
  # Backend type discriminator for the agent runtime.
  type: none
# How skills are invoked when a task arrives.
execution:
  # Functional/analysis mode filter or target.
  mode: direct_function
  # Limits on parallel signoff jobs for this container.
  concurrency:
    # Maximum concurrent tasks; signoff tools are often serialized at 1.
    max_tasks: 1
# Timeouts and failure policy for long EDA jobs.
reliability:
  # Wall seconds before a hanging tool job is aborted.
  task_timeout_secs: 120
  # Retries before the orchestrator must replan.
  max_retries: 1
  # Orchestrator action when the task fails after retries.
  on_failure: replan
# Advertised capability ids matching tools (discovery surface).
capabilities:
# Stable capability or skill or stream identifier.
- id: plan_timing_closure
  # Short charter describing what this signoff agent is responsible for.
  description: Emit the timing-debug workflow for the open violations.
# Stable capability or skill or stream identifier.
- id: request_path_group_debug
  # Short charter describing what this signoff agent is responsible for.
  description: Open debug for one path group and check type.
# Stable capability or skill or stream identifier.
- id: request_timing_corner_sweep
  # Short charter describing what this signoff agent is responsible for.
  description: Open STA across the required modes and corners.
# Stable capability or skill or stream identifier.
- id: read_mmmc_status
  # Short charter describing what this signoff agent is responsible for.
  description: Read which modes and corners have reports.
# Stable capability or skill or stream identifier.
- id: read_worst_paths
  # Short charter describing what this signoff agent is responsible for.
  description: Read the worst setup and hold paths.
# Stable capability or skill or stream identifier.
- id: read_timing_constraints_in_force
  # Short charter describing what this signoff agent is responsible for.
  description: Read the constraints the current STA used.
# Stable capability or skill or stream identifier.
- id: request_timing_repair
  # Short charter describing what this signoff agent is responsible for.
  description: Send a classified path group to the owner who can change it.
# Stable capability or skill or stream identifier.
- id: flag_single_corner_signoff
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a signoff claim that is missing a required corner.
# Stable capability or skill or stream identifier.
- id: flag_constraint_edit_request
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a proposed constraint edit so a human can judge it. This agent does not apply it.
# Stable capability or skill or stream identifier.
- id: record_timing_strategy
  # Short charter describing what this signoff agent is responsible for.
  description: Record which path group the next repair will target.
# Stable capability or skill or stream identifier.
- id: recommend_timing_candidate
  # Short charter describing what this signoff agent is responsible for.
  description: Record which repaired candidate should be rechecked. This does not promote it.
# Stable capability or skill or stream identifier.
- id: request_timing_decision
  # Short charter describing what this signoff agent is responsible for.
  description: Ask a human to accept a remaining violation or change a constraint.
# Stable capability or skill or stream identifier.
- id: delegate_tasks
  # Short charter describing what this signoff agent is responsible for.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
