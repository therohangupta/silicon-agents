# Agent manifest for Cross-Partition Boundary Coordinator (id=boundary_coordinator, port=8246).
# EDA role: When a chip is partitioned, abutting blocks must agree on pins, feedthroughs, routing channels, power straps, clock handoff, and timing budgets. This coordinator checks consistency without editing either placement's canonical database.
# Loaded by EdaAgent.read_spec / AgentService.from_agent; skills map to tools.py.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; must be Agent for worker/lead physical-design agents.
kind: Agent
# Identity and labels used by the fleet registry and dashboards.
metadata:
  # Stable agent id ``boundary_coordinator`` used in telemetry and tool_observation.
  name: boundary_coordinator
  # Human-readable title shown in UIs and READMEs.
  display_name: Cross-Partition Boundary Coordinator
  # One-paragraph responsibility for this physical-design stage.
  description: Check timing budgets, interface pins, feedthroughs, routing channels, power continuity,
    clock interactions, and constraint consistency across partitions.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: placement
    # Fleet role: lead orchestrates; worker executes; validator independently checks.
    role: worker
# Fleet role ``worker`` (lead orchestrates; worker executes).
role: worker
# Physical-design stage ``placement`` for planning and context filters.
stage: placement
# Authoritative responsibility string mirrored from description.
responsibility: Check timing budgets, interface pins, feedthroughs, routing channels, power continuity,
  clock interactions, and constraint consistency across partitions.
# Hard may / may_not contract enforced conceptually by planning and permissions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Allowed action: Read both partitions' boundaries
  - Read both partitions' boundaries
  # Allowed action: Write a proposed budget or feedthrough change as a proposal
  - Write a proposed budget or feedthrough change as a proposal
  # Allowed action: Publish a boundary finding
  - Publish a boundary finding
  # Forbidden actions (no silent promotion, no self-signoff, etc.).
  may_not:
  # Forbidden: Edit either partition's placement
  - Edit either partition's placement
  # Forbidden: Change a timing budget on the canonical constraint set
  - Change a timing budget on the canonical constraint set
  # Forbidden: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids a lead may schedule.
delegates_to: []
# Optional independent validator agent ids.
validators: []
# HTTP reachability for AgentService inside Docker/compose.
connection:
  # Hostname peers use to reach this container (host.docker.internal for local).
  host: host.docker.internal
  # HTTP port 8246 for Cross-Partition Boundary Coordinator AgentService endpoints.
  port: 8246
  # Path map for health and execute routes.
  endpoints:
    # Liveness/readiness HTTP path.
    health: /health
    # Task submission HTTP path.
    execute: /tasks/execute
# EDA framework backend binding (none until OpenROAD adapter configured).
backend:
  # Backend type discriminator (none means observations stay not_run).
  type: none
# How skills are invoked by the agent runtime.
execution:
  # Mode parameter (overloaded key; YAML context distinguishes).
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum concurrent tasks for this agent process.
    max_tasks: 1
# Timeouts, retries, and failure policy for tasks.
reliability:
  # Wall-clock timeout for one task attempt.
  task_timeout_secs: 120
  # How many times to retry a failed task before replan/give-up.
  max_retries: 1
  # Planner hint when the task fails (e.g. replan).
  on_failure: replan
# Capability index mirroring skills for UIs and planners.
capabilities:
# Stable id for a capability, skill, memory store, or stream.
- id: read_partition_boundaries
  # One-paragraph responsibility for this physical-design stage.
  description: Read pins, channels, and abstracts for the partitions in scope.
# Stable id for a capability, skill, memory store, or stream.
- id: check_timing_budgets
  # One-paragraph responsibility for this physical-design stage.
  description: Compare interface timing budgets across partitions.
# Stable id for a capability, skill, memory store, or stream.
- id: check_feedthroughs
  # One-paragraph responsibility for this physical-design stage.
  description: Check feedthroughs, channels, and reserved routing tracks.
# Stable id for a capability, skill, memory store, or stream.
- id: check_power_continuity
  # One-paragraph responsibility for this physical-design stage.
  description: Check that supplies continue across the partition boundary.
# Stable id for a capability, skill, memory store, or stream.
- id: check_clock_boundary
  # One-paragraph responsibility for this physical-design stage.
  description: Check clock handoff, skew budget, and generated clocks at the boundary.
# Stable id for a capability, skill, memory store, or stream.
- id: check_constraint_consistency
  # One-paragraph responsibility for this physical-design stage.
  description: Check that both partitions use the same interface exceptions.
# Stable id for a capability, skill, memory store, or stream.
- id: check_pin_agreement
  # One-paragraph responsibility for this physical-design stage.
  description: Check that mating pins share layer, order, and location.
# Stable id for a capability, skill, memory store, or stream.
- id: write_budget_proposal
  # One-paragraph responsibility for this physical-design stage.
  description: Write a proposed timing-budget change. This does not edit the canonical constraints.
# Stable id for a capability, skill, memory store, or stream.
- id: write_feedthrough_proposal
  # One-paragraph responsibility for this physical-design stage.
  description: Write a proposed feedthrough. This does not edit either placement.
# Stable id for a capability, skill, memory store, or stream.
- id: flag_budget_mismatch
  # One-paragraph responsibility for this physical-design stage.
  description: Publish interface budgets that do not add up.
# Stable id for a capability, skill, memory store, or stream.
- id: flag_feedthrough_conflict
  # One-paragraph responsibility for this physical-design stage.
  description: Publish a feedthrough that collides with a channel or pin.
# Stable id for a capability, skill, memory store, or stream.
- id: flag_power_discontinuity
  # One-paragraph responsibility for this physical-design stage.
  description: Publish a supply that stops at the boundary.
# Stable id for a capability, skill, memory store, or stream.
- id: record_boundary_evidence
  # One-paragraph responsibility for this physical-design stage.
  description: Record both partition refs and the reports compared.
