  - name: summary
    # Human-readable description for this manifest entry.
    description: One-sentence finding.
  # Stable agent id used in delegation graphs, findings, and telemetry.
  - name: evidence_refs
    # Human-readable description for this manifest entry.
    description: Comma-separated artifact URIs that support the finding.
  # Stable agent id used in delegation graphs, findings, and telemetry.
  - name: severity
    # Human-readable description for this manifest entry.
    description: low, medium, high, or critical.
  # Stable agent id used in delegation graphs, findings, and telemetry.
  - name: recommended_recipient
    # Human-readable description for this manifest entry.
    description: Agent id that should act on the finding.
# Local journal cache configuration for this agent process.
memory:
  # Named memory stores the agent may touch.
  stores:
  # Stable identifier for this list entry.
  - id: journal
    # Human-readable description for this manifest entry.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
    type: list
    # Persistence medium (file-backed under SILICON_MEMORY_ROOT).
    persistence: file
    # Store-specific configuration map.
    config:
      # Filesystem root for the local journal cache.
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry emission settings.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where structured telemetry streams are POSTed.
  telemetry:
    # Telemetry collector URL (TELEMETRY_URL override).
    endpoint: ${TELEMETRY_URL}
    # Named telemetry streams this agent emits.
    streams:
    # Stable agent id used in delegation graphs, findings, and telemetry.
    - name: skill_calls
      # Human-readable description for this manifest entry.
      description: Tool invocations.
    # Stable agent id used in delegation graphs, findings, and telemetry.
    - name: artifacts
      # Human-readable description for this manifest entry.
      description: Structured task results.
# Container image and runtime environment for this agent.
deployment:
  # Docker image tag published for this agent.
  image: agentfleet/power_grid:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Environment variables injected at container start.
  environment:
    # Optional bound EDA framework name; empty keeps tools not_run.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context-assembly policy for engineering memory records.
context:
  # Record kinds always pulled into the task context package.
  include:
  # Entry under `include` for Power-Grid: canonical_source
  - canonical_source
  # Entry under `include` for Power-Grid: open_findings
  - open_findings
  # Entry under `include` for Power-Grid: experiments
  - experiments
  # Entry under `include` for Power-Grid: gates
  - gates
  # Entry under `include` for Power-Grid: decisions
  - decisions
  # Record kinds omitted from context even if present.
  exclude:
  # Entry under `exclude` for Power-Grid: stale_candidates
  - stale_candidates
  # Validation states stripped from context (e.g. rejected).
  drop:
  # Entry under `drop` for Power-Grid: rejected
  - rejected
  # Preference order when conflicting records exist.
  precedence:
  # Entry under `precedence` for Power-Grid: human-authored
  - human-authored
  # Entry under `precedence` for Power-Grid: validated
  - validated
  # Entry under `precedence` for Power-Grid: provisional
  - provisional
  # Record authorship classes that must not be overwritten lightly.
  protect:
  # Entry under `protect` for Power-Grid: human-authored
  - human-authored
  # Approximate token budget for assembled context sent to the model.
  token_budget: 80000
