# =============================================================================
# docker-compose.yml — platform / memory-plane stack (Compose project default).
#
# Run from repo root:
#   python scripts/render_platform_compose.py --out compose/docker-compose.platform.generated.yml
#   docker compose -f compose/docker-compose.platform.generated.yml up --build
# Or: ./scripts/startup.sh <fleet.yaml>
#
# Frontend: run separately (npm run dev / scripts/startup.sh) and point at
#   http://localhost:8000
#
# Memory plane (section 14.4): db is Postgres + pgvector, cassandra holds
# journals, minio holds artifacts, clickhouse holds QoR, opensearch holds
# full text, nats holds events, vault holds secrets, git serves source.
# Agent containers live in docker-compose.agents.yml (Compose project silicon-agents)
# so Docker Desktop shows them apart from this platform project.
#
# The db container uses a persistent Docker volume (db_data).
# Data survives container restarts/rebuilds.
#
# This is a template. scripts/render_platform_compose.py renders it from
# config/platform.yaml before Docker creates containers. The repository .env
# is reserved for operator-owned secrets and is never generated from YAML.
# Inside the Compose network, services reach each other by name (db, gateway, etc.).
#
# The default network name comes from PLATFORM_NETWORK in that env file so
# docker-compose.agents.yml can attach to it.
# =============================================================================

# Stable project name (independent of the compose/ directory name).
name: agent_fleet

services:
  # ---------------------------------------------------------------------------
  # db — Postgres 15 with pgvector; primary relational + vector memory store.
  # ---------------------------------------------------------------------------
  db:
    # Official pgvector image built on PostgreSQL 15.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?config/platform.yaml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?config/platform.yaml}
      POSTGRES_DB: ${POSTGRES_DB:?config/platform.yaml}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:?config/platform.yaml}:${POSTGRES_CONTAINER_PORT:?config/platform.yaml}"
    volumes:
      # Named volume persists PGDATA across container recreate/rebuild.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # fleet-server waits for this before starting (depends_on condition).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      # Probe every 5 seconds once the container is up.
      interval: 5s
      # Fail a single probe if it takes longer than 5s.
      timeout: 5s
      # Mark unhealthy only after 5 consecutive failures.
      retries: 5

  # ---------------------------------------------------------------------------
  # fleet-server — gRPC control plane (plans, allocation, DAG execution, DB).
  # ---------------------------------------------------------------------------
  fleet-server:
    build:
      # Build context is repo root (this directory).
      context: ..
      # Image recipe for the gRPC orchestration process.
      dockerfile: services/fleet_server/Dockerfile
    env_file:
      # Repo-root .env for secrets like OPENAI_API_KEY.
      - ../.env
    environment:
      DATABASE_URL: ${FLEET_DATABASE_URL:?config/platform.yaml}
      GATEWAY_EVENT_URL: ${GATEWAY_EVENT_URL:?config/platform.yaml}
      DEFAULT_AGENT_HOST: ${DEFAULT_AGENT_HOST:?config/platform.yaml}
      AGENT_FLEET_POSTGRES_PASSWORD: ${AGENT_FLEET_POSTGRES_PASSWORD:?repository .env}
      AGENT_FLEET_MINIO_ROOT_PASSWORD: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?repository .env}
      AGENT_FLEET_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?repository .env}
      AGENT_FLEET_VAULT_DEV_ROOT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?repository .env}
    ports:
      - "${GRPC_PUBLISHED_PORT:?config/platform.yaml}:${GRPC_CONTAINER_PORT:?config/platform.yaml}"
    depends_on:
      # Do not start fleet-server until Postgres accepts connections.
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # nats — JetStream message bus for telemetry/events between services.
  # ---------------------------------------------------------------------------
  nats:
    # Lightweight NATS 2.x Alpine image.
    image: nats:2-alpine
    command:
      # Enable JetStream and persist stream data under /data (bind-mounted).
      ["--jetstream", "--store_dir", "/data"]
    ports:
      - "${NATS_PUBLISHED_CLIENT_PORT:?config/platform.yaml}:${NATS_CLIENT_PORT:?config/platform.yaml}"
      - "${NATS_PUBLISHED_MONITORING_PORT:?config/platform.yaml}:${NATS_MONITORING_PORT:?config/platform.yaml}"
    volumes:
      # Host .data/nats → container /data so JetStream survives restarts.
      - ../.data/nats:/data

  # ---------------------------------------------------------------------------
  # telemetry — HTTP ingest for agent heartbeats; gRPC side channel; blob root.
  # ---------------------------------------------------------------------------
  telemetry:
    build:
      context: ..
      dockerfile: services/telemetry/Dockerfile
    environment:
      GATEWAY_EVENT_URL: ${GATEWAY_EVENT_URL:?config/platform.yaml}
      NATS_URL: ${NATS_CONTAINER_URL:?config/platform.yaml}
      TELEMETRY_GRPC_PORT: ${TELEMETRY_GRPC_PORT:?config/platform.yaml}
      BLOB_STORAGE_ROOT: ${BLOB_STORAGE_ROOT:?config/platform.yaml}
      AGENT_FLEET_POSTGRES_PASSWORD: ${AGENT_FLEET_POSTGRES_PASSWORD:?repository .env}
      AGENT_FLEET_MINIO_ROOT_PASSWORD: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?repository .env}
      AGENT_FLEET_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?repository .env}
      AGENT_FLEET_VAULT_DEV_ROOT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?repository .env}
    ports:
      - "${TELEMETRY_PUBLISHED_HTTP_PORT:?config/platform.yaml}:${TELEMETRY_HTTP_PORT:?config/platform.yaml}"
      - "${TELEMETRY_PUBLISHED_GRPC_PORT:?config/platform.yaml}:${TELEMETRY_GRPC_PORT:?config/platform.yaml}"
    volumes:
      # Shared host dir also mounted by gateway/storage-writer for blobs/parquet.
      - ../.data/telemetry:/data
    depends_on:
      # Needs NATS reachable for publish/subscribe paths.
      - nats

  # ---------------------------------------------------------------------------
  # storage-writer — consumes NATS, writes parquet/blobs under BLOB/PARQUET roots.
  # ---------------------------------------------------------------------------
  storage-writer:
    build:
      context: ..
      dockerfile: services/storage_writer/Dockerfile
    environment:
      NATS_URL: ${NATS_CONTAINER_URL:?config/platform.yaml}
      PARQUET_STORAGE_ROOT: ${PARQUET_STORAGE_ROOT:?config/platform.yaml}
      BLOB_STORAGE_ROOT: ${BLOB_STORAGE_ROOT:?config/platform.yaml}
      AGENT_FLEET_POSTGRES_PASSWORD: ${AGENT_FLEET_POSTGRES_PASSWORD:?repository .env}
      AGENT_FLEET_MINIO_ROOT_PASSWORD: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?repository .env}
      AGENT_FLEET_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?repository .env}
      AGENT_FLEET_VAULT_DEV_ROOT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?repository .env}
    volumes:
      # Same bind mount as telemetry so writer and reader share files.
      - ../.data/telemetry:/data
    depends_on:
      - nats

  # ---------------------------------------------------------------------------
  # gateway — sole client-facing REST/WebSocket API (dashboard, CLI, SDKs).
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      GRPC_SERVER_ADDRESS: ${GRPC_SERVER_ADDRESS:?config/platform.yaml}
      DATABASE_URL: ${FLEET_DATABASE_URL:?config/platform.yaml}
      TELEMETRY_URL: ${TELEMETRY_CONTAINER_URL:?config/platform.yaml}
      NATS_URL: ${NATS_CONTAINER_URL:?config/platform.yaml}
      BLOB_STORAGE_ROOT: ${BLOB_STORAGE_ROOT:?config/platform.yaml}
      AGENT_FLEET_POSTGRES_PASSWORD: ${AGENT_FLEET_POSTGRES_PASSWORD:?repository .env}
      AGENT_FLEET_MINIO_ROOT_PASSWORD: ${AGENT_FLEET_MINIO_ROOT_PASSWORD:?repository .env}
      AGENT_FLEET_CLICKHOUSE_PASSWORD: ${AGENT_FLEET_CLICKHOUSE_PASSWORD:?repository .env}
      AGENT_FLEET_VAULT_DEV_ROOT_TOKEN: ${AGENT_FLEET_VAULT_DEV_ROOT_TOKEN:?repository .env}
    ports:
      - "${GATEWAY_PUBLISHED_PORT:?config/platform.yaml}:${GATEWAY_CONTAINER_PORT:?config/platform.yaml}"
    volumes:
      - ../.data/telemetry:/data
    depends_on:
      # Needs control plane, telemetry, and NATS before serving traffic.
      - fleet-server
      - telemetry
      - nats

  # ---------------------------------------------------------------------------
  # cassandra — wide-column journal store for the memory plane.
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:?config/platform.yaml}
      # Cap JVM heap for laptop-friendly Compose.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 64M
    ports:
      - "${CASSANDRA_PUBLISHED_PORT:?config/platform.yaml}:${CASSANDRA_CONTAINER_PORT:?config/platform.yaml}"
    # Hard memory ceiling so Cassandra cannot starve other services.
    mem_limit: 1536m
    healthcheck:
      # Simple CQL probe; slow to become ready on first boot.
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 15s
      retries: 20
      # Grace period before failures count (Cassandra bootstrap is slow).
      start_period: 50s

  # ---------------------------------------------------------------------------
  # minio — S3-compatible object store for silicon artifacts.
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      # API on :9000 inside the container; console on :9001.
      ["server", "/data", "--console-address", ":${MINIO_CONSOLE_CONTAINER_PORT:?config/platform.yaml}"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?config/platform.yaml}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?config/platform.yaml}
    ports:
      - "${MINIO_PUBLISHED_API_PORT:?config/platform.yaml}:${MINIO_API_CONTAINER_PORT:?config/platform.yaml}"
      - "${MINIO_PUBLISHED_CONSOLE_PORT:?config/platform.yaml}:${MINIO_CONSOLE_CONTAINER_PORT:?config/platform.yaml}"
    volumes:
      # Named volume for object data durability across recreates.
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # clickhouse — columnar store for QoR / analytics style memory.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?config/platform.yaml}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?config/platform.yaml}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?config/platform.yaml}
    ports:
      - "${CLICKHOUSE_PUBLISHED_PORT:?config/platform.yaml}:${CLICKHOUSE_CONTAINER_PORT:?config/platform.yaml}"
    ulimits:
      # ClickHouse wants a high open-file limit.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${CLICKHOUSE_CONTAINER_PORT:?config/platform.yaml}/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # opensearch — full-text / search index for the memory plane.
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      # Single-node cluster suitable for local Compose (no discovery peers).
      discovery.type: single-node
      # Disable security plugin so agents can talk HTTP without TLS/certs in dev.
      DISABLE_SECURITY_PLUGIN: "true"
      # Skip demo users/indexes that the image would otherwise install.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Bound JVM heap for laptop memory budgets.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      # Mount deploy/opensearch.yml over the image default config (read-only).
      - ../deploy/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "${OPENSEARCH_PUBLISHED_PORT:?config/platform.yaml}:${OPENSEARCH_CONTAINER_PORT:?config/platform.yaml}"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${OPENSEARCH_CONTAINER_PORT:?config/platform.yaml}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # vault — HashiCorp Vault in -dev mode for local secrets (NOT for production).
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      # Required so Vault can lock memory pages (mlock).
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?config/platform.yaml}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:${VAULT_CONTAINER_PORT:?config/platform.yaml}
    ports:
      - "${VAULT_PUBLISHED_PORT:?config/platform.yaml}:${VAULT_CONTAINER_PORT:?config/platform.yaml}"
    command:
      # Ephemeral in-memory dev server; data lost on container stop.
      ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:${VAULT_CONTAINER_PORT:?config/platform.yaml}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # git — anonymous git-daemon exporting ./.data/silicon-source as /srv.
  # ---------------------------------------------------------------------------
  git:
    image: alpine:3.21
    entrypoint:
      # Run a shell so the multi-line command below can apk-install and exec.
      ["sh", "-c"]
    command:
      - |
        apk add --no-cache git git-daemon
        git config --global --add safe.directory '*'
        exec git daemon --reuseaddr --base-path=/srv --export-all --listen=0.0.0.0 --port=$$GIT_DAEMON_PORT /srv
    volumes:
      # Host source tree published read-only-style via git protocol to agents.
      - ${GIT_HOST_MOUNT:?config/platform.yaml}:/srv
    environment:
      GIT_DAEMON_PORT: ${GIT_CONTAINER_PORT:?config/platform.yaml}
    ports:
      - "${GIT_PUBLISHED_PORT:?config/platform.yaml}:${GIT_CONTAINER_PORT:?config/platform.yaml}"

# Named volumes declared for Postgres and MinIO persistent data.
volumes:
  # Postgres PGDATA volume (see db.volumes).
  db_data:
  # MinIO object store volume (see minio.volumes).
  minio_data:

# Explicit default network name so agent Compose can attach as external.
networks:
  default:
    name: ${PLATFORM_NETWORK:?config/platform.yaml}
