# Agent Fleet manifest for Extraction Agent (extraction).
# Domain: parasitic extraction (SPEF) for signoff STA and power.
# EDA focus: SPEF completeness, extraction corners, OpenROAD estimate_parasitics.
# Loaded by agent.py via EdaAgent.read_spec and by server.py via AgentService.from_agent.
# HTTP port 8254 must stay aligned with connection.port, Dockerfile EXPOSE, and deployment.

# Agent Fleet manifest schema version for this Agent resource.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for fleet loaders.
kind: Agent
# Identity and labeling block consumed by discovery and observability.
metadata:
  # Stable agent id `extraction` used in tool_observation and fleet routing.
  name: extraction
  # Human-readable agent title shown in UIs and journals.
  display_name: Extraction Agent
  # Short charter describing what this signoff agent is responsible for.
  description: 'Produce versioned parasitic models from the routed design and record completeness and
    corner configuration. Adapter target: OpenROAD estimate_parasitics, then a signoff extractor behind
    the same operations.'
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent participates in.
    stage: signoff
    # Fleet role: worker executes tools; lead plans and delegates.
    role: worker
# Fleet role: worker executes tools; lead plans and delegates.
role: worker
# Pipeline stage this agent participates in.
stage: signoff
# Authoritative one-paragraph responsibility used in prompts and docs.
responsibility: 'Produce versioned parasitic models from the routed design and record completeness and
  corner configuration. Adapter target: OpenROAD estimate_parasitics, then a signoff extractor behind
  the same operations.'
# Hard may / may_not contract enforced by policy and reviewers.
boundary:
  # Operations this agent is allowed to perform in the signoff flow.
  may:
  # Signoff boundary or context item: Submit extraction
  - Submit extraction
  # Signoff boundary or context item: Write the corner configuration
  - Write the corner configuration
  # Signoff boundary or context item: Publish RC artifact references
  - Publish RC artifact references
  # Forbidden actions (waiver, promote, edit canonical baseline, etc.).
  may_not:
  # Signoff boundary or context item: Edit the routed design
  - Edit the routed design
  # Signoff boundary or context item: Drop a required corner
  - Drop a required corner
  # Signoff boundary or context item: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Signoff boundary or context item: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Signoff boundary or context item: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks against (empty for pure workers).
delegates_to: []
# Independent validators that must grade this agent's outputs (often empty).
validators: []
# Network binding for the HTTP AgentService inside Docker.
connection:
  # Docker-published host reachable from other fleet services.
  host: host.docker.internal
  # TCP port 8254 for this agent's AgentService (must match Dockerfile EXPOSE).
  port: 8254
  # HTTP paths for health probes and task execution.
  endpoints:
    # Liveness/readiness path returning service health.
    health: /health
    # Path that accepts execute-task requests from the orchestrator.
    execute: /tasks/execute
# LLM/tool backend binding; type none means tools are observations until adapted.
backend:
  # Backend type discriminator for the agent runtime.
  type: none
# How skills are invoked when a task arrives.
execution:
  # Functional/analysis mode filter or target.
  mode: direct_function
  # Limits on parallel signoff jobs for this container.
  concurrency:
    # Maximum concurrent tasks; signoff tools are often serialized at 1.
    max_tasks: 1
# Timeouts and failure policy for long EDA jobs.
reliability:
  # Wall seconds before a hanging tool job is aborted.
  task_timeout_secs: 120
  # Retries before the orchestrator must replan.
  max_retries: 1
  # Orchestrator action when the task fails after retries.
  on_failure: replan
# Advertised capability ids matching tools (discovery surface).
capabilities:
# Stable capability or skill or stream identifier.
- id: read_required_extraction_corners
  # Short charter describing what this signoff agent is responsible for.
  description: Read the corners extraction must produce.
# Stable capability or skill or stream identifier.
- id: write_extraction_config
  # Short charter describing what this signoff agent is responsible for.
  description: Write the extraction configuration and corner list.
# Stable capability or skill or stream identifier.
- id: extract_parasitics
  # Short charter describing what this signoff agent is responsible for.
  description: 'Extract parasitics for the configured corners. Adapter target: OpenROAD estimate_parasitics
    or the bound extractor.'
# Stable capability or skill or stream identifier.
- id: write_spef
  # Short charter describing what this signoff agent is responsible for.
  description: Write the SPEF for one corner.
# Stable capability or skill or stream identifier.
- id: validate_extraction_corners
  # Short charter describing what this signoff agent is responsible for.
  description: Check that every required corner was extracted.
# Stable capability or skill or stream identifier.
- id: check_extraction_completeness
  # Short charter describing what this signoff agent is responsible for.
  description: Check for missing nets, layers, and couplings.
# Stable capability or skill or stream identifier.
- id: check_spef_header
  # Short charter describing what this signoff agent is responsible for.
  description: Check design name, units, and divider in the SPEF header.
# Stable capability or skill or stream identifier.
- id: compare_spef_to_routed_nets
  # Short charter describing what this signoff agent is responsible for.
  description: Compare extracted nets with the routed netlist.
# Stable capability or skill or stream identifier.
- id: read_extraction_log
  # Short charter describing what this signoff agent is responsible for.
  description: Read the extraction log and warnings.
# Stable capability or skill or stream identifier.
- id: flag_missing_extraction_corner
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a required corner that was not extracted.
# Stable capability or skill or stream identifier.
- id: flag_incomplete_extraction
  # Short charter describing what this signoff agent is responsible for.
  description: Publish missing nets or couplings.
# Stable capability or skill or stream identifier.
- id: record_extraction_provenance
  # Short charter describing what this signoff agent is responsible for.
  description: Record the extractor, version, rule deck, and SPEF refs.
