skills:
# Stable capability or skill or stream identifier.
- id: read_required_extraction_corners
  # Python module providing the callable (tools for this package).
  module: tools
  # Function name inside the module invoked for this skill.
  callable: read_required_extraction_corners
  # Short charter describing what this signoff agent is responsible for.
  description: Read the corners extraction must produce.
  # Default argument values when the orchestrator omits fields.
  args_defaults:
    # Candidate artifact the skill reads or analyzes.
    candidate_ref: ''
    # Report artifact URI; empty selects latest for the candidate.
    report_ref: ''
    # PVT/extraction/timing corner filter or target.
    corner: ''
    # Functional/analysis mode filter or target.
    mode: ''
  # Framework action verb (submit_tool_job, read_reports, publish_finding, etc.).
  action: read_reports
  # Documented parameters the skill accepts from the task payload.
  params:
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: candidate_ref
    # Short charter describing what this signoff agent is responsible for.
    description: Candidate whose reports are read.
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: report_ref
    # Short charter describing what this signoff agent is responsible for.
    description: Artifact URI of the report. Empty reads the latest report for this candidate.
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: corner
    # Short charter describing what this signoff agent is responsible for.
    description: Corner filter. Empty reads every available corner.
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: mode
    # Short charter describing what this signoff agent is responsible for.
    description: Mode filter. Empty reads every available mode.
