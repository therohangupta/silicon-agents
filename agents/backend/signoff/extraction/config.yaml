    type: list
    # How the store survives process restarts (file, etc.).
    persistence: file
    # Store-specific configuration map.
    config:
      # Filesystem root for journal cache keys under SILICON_MEMORY_ROOT.
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry emission settings.
observability:
  # Seconds between liveness heartbeats to the fleet.
  heartbeat_interval_secs: 5
  # Remote telemetry sink configuration.
  telemetry:
    # Telemetry service URL (overridable via TELEMETRY_URL).
    endpoint: ${TELEMETRY_URL}
    # Named telemetry streams this agent emits.
    streams:
    # Stable agent id used in routing, findings, and agent_id tool observations.
    - name: skill_calls
      # Short charter describing what this signoff agent is responsible for.
      description: Tool invocations.
    # Stable agent id used in routing, findings, and agent_id tool observations.
    - name: artifacts
      # Short charter describing what this signoff agent is responsible for.
      description: Structured task results.
# Container image and runtime environment for this agent.
deployment:
  # Container image tag for deploying the Extraction Agent.
  image: agentfleet/extraction:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Environment variables injected at container start.
  environment:
    # Optional bound EDA framework name; empty until an adapter is configured.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context-pack rules for what engineering memory the agent may see.
context:
  # Context categories always considered for prompts.
  include:
  # Signoff boundary or context item: canonical_source
  - canonical_source
  # Signoff boundary or context item: open_findings
  - open_findings
  # Signoff boundary or context item: experiments
  - experiments
  # Signoff boundary or context item: gates
  - gates
  # Signoff boundary or context item: decisions
  - decisions
  # Context categories withheld from this agent.
  exclude:
  # Signoff boundary or context item: stale_candidates
  - stale_candidates
  # Statuses that cause context entries to be dropped.
  drop:
  # Signoff boundary or context item: rejected
  - rejected
  # Ordering when multiple context sources conflict.
  precedence:
  # Signoff boundary or context item: human-authored
  - human-authored
  # Signoff boundary or context item: validated
  - validated
  # Signoff boundary or context item: provisional
  - provisional
  # Context classes that must not be overwritten by lower-trust sources.
  protect:
  # Signoff boundary or context item: human-authored
  - human-authored
  # Approximate token budget for assembled context windows.
  token_budget: 80000
