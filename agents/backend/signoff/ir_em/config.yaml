  # Short charter describing what this signoff agent is responsible for.
  description: Publish the weak regions and the current that causes them.
# Stable capability or skill or stream identifier.
- id: propose_grid_repair
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a strap, via, or rail change.
# Stable capability or skill or stream identifier.
