- id: verify_ir_repair_timing_route
  # Short charter describing what this signoff agent is responsible for.
  description: Check timing and routing impact of the repair.
# Stable capability or skill or stream identifier.
- id: flag_unchecked_ir_repair
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a repair that has no timing or routing check.
# Stable capability or skill or stream identifier.
- id: record_ir_em_provenance
  # Short charter describing what this signoff agent is responsible for.
  description: Record the current source, windows, and tool version.
