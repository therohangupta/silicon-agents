# Agent Fleet manifest for Independent Signoff Validator (signoff_validator).
# Domain: independent signoff gate grading and waiver audit.
# EDA focus: reproduce STA/DRC/LVS, audit waivers, emit pass/fail signoff gate.
# Loaded by agent.py via EdaAgent.read_spec and by server.py via AgentService.from_agent.
# HTTP port 8262 must stay aligned with connection.port, Dockerfile EXPOSE, and deployment.

# Agent Fleet manifest schema version for this Agent resource.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for fleet loaders.
kind: Agent
# Identity and labeling block consumed by discovery and observability.
metadata:
  # Stable agent id `signoff_validator` used in tool_observation and fleet routing.
  name: signoff_validator
  # Human-readable agent title shown in UIs and journals.
  display_name: Independent Signoff Validator
  # Short charter describing what this signoff agent is responsible for.
  description: Read primary signoff artifacts, reproduce critical checks, audit waivers, and decide whether
    every required gate passed.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent participates in.
    stage: signoff
    # Fleet role: worker executes tools; lead plans and delegates.
    role: validator
# Fleet role: worker executes tools; lead plans and delegates.
role: validator
# Pipeline stage this agent participates in.
stage: signoff
# Authoritative one-paragraph responsibility used in prompts and docs.
responsibility: Read primary signoff artifacts, reproduce critical checks, audit waivers, and decide whether
  every required gate passed.
# Hard may / may_not contract enforced by policy and reviewers.
boundary:
  # Operations this agent is allowed to perform in the signoff flow.
  may:
  # Signoff boundary or context item: Read a frozen candidate and frozen recipes
  - Read a frozen candidate and frozen recipes
  # Signoff boundary or context item: Reproduce critical checks
  - Reproduce critical checks
  # Signoff boundary or context item: Emit a signoff gate
  - Emit a signoff gate
  # Signoff boundary or context item: Publish missing inputs
  - Publish missing inputs
  # Forbidden actions (waiver, promote, edit canonical baseline, etc.).
  may_not:
  # Signoff boundary or context item: Modify the candidate
  - Modify the candidate
  # Signoff boundary or context item: Change a rule deck
  - Change a rule deck
  # Signoff boundary or context item: Suppress a violation
  - Suppress a violation
  # Signoff boundary or context item: Approve a waiver
  - Approve a waiver
  # Signoff boundary or context item: Release a tapeout package
  - Release a tapeout package
  # Signoff boundary or context item: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Signoff boundary or context item: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Signoff boundary or context item: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks against (empty for pure workers).
delegates_to: []
# Independent validators that must grade this agent's outputs (often empty).
validators: []
# Network binding for the HTTP AgentService inside Docker.
connection:
  # Docker-published host reachable from other fleet services.
  host: host.docker.internal
  # TCP port 8262 for this agent's AgentService (must match Dockerfile EXPOSE).
  port: 8262
  # HTTP paths for health probes and task execution.
  endpoints:
    # Liveness/readiness path returning service health.
    health: /health
    # Path that accepts execute-task requests from the orchestrator.
    execute: /tasks/execute
# LLM/tool backend binding; type none means tools are observations until adapted.
backend:
  # Backend type discriminator for the agent runtime.
  type: none
# How skills are invoked when a task arrives.
execution:
  # Functional/analysis mode filter or target.
  mode: direct_function
  # Limits on parallel signoff jobs for this container.
  concurrency:
    # Maximum concurrent tasks; signoff tools are often serialized at 1.
    max_tasks: 1
# Timeouts and failure policy for long EDA jobs.
reliability:
  # Wall seconds before a hanging tool job is aborted.
  task_timeout_secs: 120
  # Retries before the orchestrator must replan.
  max_retries: 1
  # Orchestrator action when the task fails after retries.
  on_failure: replan
# Advertised capability ids matching tools (discovery surface).
capabilities:
# Stable capability or skill or stream identifier.
- id: read_frozen_signoff_candidate
  # Short charter describing what this signoff agent is responsible for.
  description: Read the pinned candidate being graded.
# Stable capability or skill or stream identifier.
- id: read_frozen_signoff_recipes
  # Short charter describing what this signoff agent is responsible for.
  description: Read the frozen tool recipes and rule decks.
# Stable capability or skill or stream identifier.
- id: read_primary_signoff_artifacts
  # Short charter describing what this signoff agent is responsible for.
  description: Read timing, power, IR, DRC, LVS, and extraction artifacts.
# Stable capability or skill or stream identifier.
- id: check_signoff_provenance
  # Short charter describing what this signoff agent is responsible for.
  description: Check tool versions, SPEF, SDC, and rule decks against the frozen flow.
# Stable capability or skill or stream identifier.
- id: reproduce_signoff_checks
  # Short charter describing what this signoff agent is responsible for.
  description: Re-run the critical signoff checks from primary artifacts.
# Stable capability or skill or stream identifier.
- id: reproduce_signoff_sta
  # Short charter describing what this signoff agent is responsible for.
  description: Re-run static timing on the frozen SPEF and SDC.
# Stable capability or skill or stream identifier.
- id: reproduce_signoff_drc_lvs
  # Short charter describing what this signoff agent is responsible for.
  description: Re-run DRC and LVS with the frozen rule deck.
# Stable capability or skill or stream identifier.
- id: audit_waivers
  # Short charter describing what this signoff agent is responsible for.
  description: Check that every waiver has an owner, scope, and expiration.
# Stable capability or skill or stream identifier.
- id: list_missing_signoff_inputs
  # Short charter describing what this signoff agent is responsible for.
  description: List required reports that are absent.
# Stable capability or skill or stream identifier.
- id: compare_signoff_summary
  # Short charter describing what this signoff agent is responsible for.
  description: Compare producing agents' summaries with the primary artifacts.
# Stable capability or skill or stream identifier.
- id: emit_signoff_gate
  # Short charter describing what this signoff agent is responsible for.
  description: Record whether the signoff contract passed. A missing input fails the gate.
# Stable capability or skill or stream identifier.
- id: publish_signoff_disagreement
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a place where a summary and a primary artifact disagree.
# Stable capability or skill or stream identifier.
- id: publish_missing_signoff_input
  # Short charter describing what this signoff agent is responsible for.
  description: Publish an input that blocks the signoff grade.
# Stable capability or skill or stream identifier.
- id: publish_waiver_audit_gap
  # Short charter describing what this signoff agent is responsible for.
  description: Publish a waiver that lacks an owner, scope, or expiration.
