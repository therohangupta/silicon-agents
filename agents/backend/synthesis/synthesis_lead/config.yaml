# Agent manifest for Synthesis Lead (role=lead, stage=synthesis, port=8232).
# EDA focus: RTL-to-gate synthesis orchestration: constraints, experiments, retiming, equivalence, and netlist quality. PPA and equivalence decide advancement.
# Every mapping key and list entry has a comment; multi-line string values are untouched.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; Agent means a runnable chip-design agent service.
kind: Agent
# Human- and registry-facing identity for this agent.
metadata:
  # Stable agent id used in delegation graphs, findings, and telemetry.
  name: synthesis_lead
  # UI-facing title for operators and dashboards.
  display_name: Synthesis Lead
  # One-paragraph responsibility statement shown in registries and UIs.
  description: Own the RTL-to-netlist workflow. Define synthesis experiments and acceptance criteria,
    and recommend candidates that satisfy functional and PPA requirements.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent belongs to in the backend flow.
    stage: synthesis
    # lead orchestrates workers; worker executes specialist tools.
    role: lead
# lead orchestrates workers; worker executes specialist tools.
role: lead
# Pipeline stage this agent belongs to in the backend flow.
stage: synthesis
# Authoritative responsibility text mirrored from the design system.
responsibility: Own the RTL-to-netlist workflow. Define synthesis experiments and acceptance criteria,
  and recommend candidates that satisfy functional and PPA requirements.
# Hard may / may_not rules the runtime enforces on tool actions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Entry under `may` for Synthesis Lead: Publish a synthesis workflow
  - Publish a synthesis workflow
  # Entry under `may` for Synthesis Lead: Read RTL, constraints, and QoR reports
  - Read RTL, constraints, and QoR reports
  # Entry under `may` for Synthesis Lead: Request a human decision when two netlists remain feasible
  - Request a human decision when two netlists remain feasible
  # Actions this agent must never perform (promotion, waivers, etc.).
  may_not:
  # Entry under `may_not` for Synthesis Lead: Accept a netlist that failed equivalence
  - Accept a netlist that failed equivalence
  # Entry under `may_not` for Synthesis Lead: Relax a constraint to improve WNS
  - Relax a constraint to improve WNS
  # Entry under `may_not` for Synthesis Lead: Promote a netlist onto the baseline
  - Promote a netlist onto the baseline
  # Entry under `may_not` for Synthesis Lead: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Entry under `may_not` for Synthesis Lead: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Entry under `may_not` for Synthesis Lead: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows toward.
delegates_to:
# Entry under `delegates_to` for Synthesis Lead: constraint_generation
- constraint_generation
# Entry under `delegates_to` for Synthesis Lead: synthesis_experiment
- synthesis_experiment
# Entry under `delegates_to` for Synthesis Lead: retiming_mapping
- retiming_mapping
# Entry under `delegates_to` for Synthesis Lead: equivalence
- equivalence
# Entry under `delegates_to` for Synthesis Lead: netlist_quality
- netlist_quality
# Optional validator agent ids that must confirm outcomes.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname inside Docker networks (host.docker.internal for local).
  host: host.docker.internal
  # TCP port this agent's uvicorn server listens on.
  port: 8232
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness/readiness path probed by the fleet.
    health: /health
    # Path that accepts AgentTaskRequest payloads.
    execute: /tasks/execute
# Tool-backend binding; type none means observations are not_run until bound.
backend:
  # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
  type: none
# How the agent runs tools for a task.
execution:
  # direct_function invokes Python callables named in skills.
  mode: direct_function
  # Limits on parallel task handling inside one process.
  concurrency:
    # Maximum simultaneous tasks (1 keeps experiment isolation simple).
    max_tasks: 1
# Timeouts, retries, and failure policy for task handling.
reliability:
  # Wall-clock seconds before a task is considered failed.
  task_timeout_secs: 120
  # How many times the fleet may retry a failed task.
  max_retries: 1
  # Policy when tools fail (replan asks the lead to adjust the graph).
  on_failure: replan
# Declared capability ids surfaced to planners (mirrors skills).
capabilities:
# Stable identifier for this list entry.
- id: plan_synthesis_experiments
  # Human-readable description for this manifest entry.
  description: Emit the synthesis and equivalence workflow.
# Stable identifier for this list entry.
- id: request_constraint_audit
  # Human-readable description for this manifest entry.
  description: Open constraint generation and audit before experiments run.
# Stable identifier for this list entry.
- id: request_synthesis_experiment
  # Human-readable description for this manifest entry.
  description: Open one isolated synthesis experiment with a named hypothesis.
# Stable identifier for this list entry.
- id: request_retiming_study
  # Human-readable description for this manifest entry.
  description: Open a state-preserving retiming or mapping study.
# Stable identifier for this list entry.
- id: request_equivalence_check
  # Human-readable description for this manifest entry.
  description: Open equivalence between the RTL and a netlist candidate.
# Stable identifier for this list entry.
- id: request_netlist_quality_audit
  # Human-readable description for this manifest entry.
  description: Open a structural quality audit of one netlist.
# Stable identifier for this list entry.
- id: read_synthesis_acceptance
  # Human-readable description for this manifest entry.
  description: Read the PPA and equivalence criteria for this block.
# Stable identifier for this list entry.
- id: read_experiment_qor
  # Human-readable description for this manifest entry.
  description: Read QoR for every experiment against the same baseline.
# Stable identifier for this list entry.
- id: read_equivalence_status
  # Human-readable description for this manifest entry.
  description: Read whether each netlist passed equivalence.
# Stable identifier for this list entry.
- id: compare_synthesis_candidates
  # Human-readable description for this manifest entry.
  description: Rank candidates on timing, area, power, and runtime. A failed equivalence check stays ineligible.
# Stable identifier for this list entry.
- id: recommend_netlist_candidate
  # Human-readable description for this manifest entry.
  description: Record which experiment should advance, with its QoR and equivalence status. This does
    not promote it.
# Stable identifier for this list entry.
- id: flag_ineligible_netlist
  # Human-readable description for this manifest entry.
  description: Publish a netlist that improved QoR and failed equivalence or a hard constraint.
# Stable identifier for this list entry.
- id: record_synthesis_strategy
  # Human-readable description for this manifest entry.
  description: Record which knobs the next experiment batch will change.
# Stable identifier for this list entry.
- id: request_netlist_decision
  # Human-readable description for this manifest entry.
  description: Ask a human to choose among feasible netlists.
# Stable identifier for this list entry.
- id: delegate_tasks
  # Human-readable description for this manifest entry.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
