# Agent manifest for Constraint Generation and Validation (role=worker, stage=synthesis, port=8233).
# EDA focus: SDC authorship and audit: clocks, I/O delays, uncertainty, exceptions, and case analysis.
# Every mapping key and list entry has a comment; multi-line string values are untouched.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; Agent means a runnable chip-design agent service.
kind: Agent
# Human- and registry-facing identity for this agent.
metadata:
  # Stable agent id used in delegation graphs, findings, and telemetry.
  name: constraint_generation
  # UI-facing title for operators and dashboards.
  display_name: Constraint Generation and Validation Agent
  # One-paragraph responsibility statement shown in registries and UIs.
  description: Create and audit clocks, generated clocks, I/O delays, uncertainties, exceptions, operating
    modes, and environment assumptions.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent belongs to in the backend flow.
    stage: synthesis
    # lead orchestrates workers; worker executes specialist tools.
    role: worker
# lead orchestrates workers; worker executes specialist tools.
role: worker
# Pipeline stage this agent belongs to in the backend flow.
stage: synthesis
# Authoritative responsibility text mirrored from the design system.
responsibility: Create and audit clocks, generated clocks, I/O delays, uncertainties, exceptions, operating
  modes, and environment assumptions.
# Hard may / may_not rules the runtime enforces on tool actions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Entry under `may` for Constraint Generation and Validation: Write constraints on an isolated candidate
  - Write constraints on an isolated candidate
  # Entry under `may` for Constraint Generation and Validation: Audit exceptions
  - Audit exceptions
  # Entry under `may` for Constraint Generation and Validation: Submit a constraint check
  - Submit a constraint check
  # Actions this agent must never perform (promotion, waivers, etc.).
  may_not:
  # Entry under `may_not` for Constraint Generation and Validation: Add a false path to hide a violation
  - Add a false path to hide a violation
  # Entry under `may_not` for Constraint Generation and Validation: Edit RTL
  - Edit RTL
  # Entry under `may_not` for Constraint Generation and Validation: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Entry under `may_not` for Constraint Generation and Validation: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Entry under `may_not` for Constraint Generation and Validation: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows toward.
delegates_to: []
# Optional validator agent ids that must confirm outcomes.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname inside Docker networks (host.docker.internal for local).
  host: host.docker.internal
  # TCP port this agent's uvicorn server listens on.
  port: 8233
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness/readiness path probed by the fleet.
    health: /health
    # Path that accepts AgentTaskRequest payloads.
    execute: /tasks/execute
# Tool-backend binding; type none means observations are not_run until bound.
backend:
  # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
  type: none
# How the agent runs tools for a task.
execution:
  # direct_function invokes Python callables named in skills.
  mode: direct_function
  # Limits on parallel task handling inside one process.
  concurrency:
    # Maximum simultaneous tasks (1 keeps experiment isolation simple).
    max_tasks: 1
# Timeouts, retries, and failure policy for task handling.
reliability:
  # Wall-clock seconds before a task is considered failed.
  task_timeout_secs: 120
  # How many times the fleet may retry a failed task.
  max_retries: 1
  # Policy when tools fail (replan asks the lead to adjust the graph).
  on_failure: replan
# Declared capability ids surfaced to planners (mirrors skills).
capabilities:
# Stable identifier for this list entry.
- id: write_create_clock
  # Human-readable description for this manifest entry.
  description: Write create_clock constraints for the declared clocks.
# Stable identifier for this list entry.
- id: write_generated_clock
