# Fleet manifest for the Bring-up Lead agent (bringup_lead).
# Parsed by EdaAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: bringup_lead
  # UI label shown in the dashboard and logs.
  display_name: Bring-Up Lead
  # One-paragraph charter for planners and operators.
  description: Own the path from first power-on to validated operation. Order safety checks and keep the
    bring-up decision record. Irreversible actions stay with a human.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: lead
# Role class: lead, specialist, or validator.
role: lead
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Own the path from first power-on to validated operation. Order safety checks and keep
  the bring-up decision record. Irreversible actions stay with a human.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the bringup_lead manifest: Publish a bring-up workflow
  - Publish a bring-up workflow
  # List entry consumed by the bringup_lead manifest: Read lab procedures and silicon findings
  - Read lab procedures and silicon findings
  # List entry consumed by the bringup_lead manifest: Request a human decision before an irreversible or out-of-bounds action
  - Request a human decision before an irreversible or out-of-bounds action
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the bringup_lead manifest: Authorize a destructive lab action
  - Authorize a destructive lab action
  # List entry consumed by the bringup_lead manifest: Change a signoff waiver
  - Change a signoff waiver
  # List entry consumed by the bringup_lead manifest: Widen a safety bound
  - Widen a safety bound
  # List entry consumed by the bringup_lead manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the bringup_lead manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the bringup_lead manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to:
# List entry consumed by the bringup_lead manifest: lab_procedure
- lab_procedure
# List entry consumed by the bringup_lead manifest: instrument_control
- instrument_control
# List entry consumed by the bringup_lead manifest: firmware_test_program
- firmware_test_program
# List entry consumed by the bringup_lead manifest: telemetry_log_analysis
- telemetry_log_analysis
# List entry consumed by the bringup_lead manifest: characterization
- characterization
# List entry consumed by the bringup_lead manifest: failure_correlation
- failure_correlation
# List entry consumed by the bringup_lead manifest: errata_drafting
- errata_drafting
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8263
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
