# Fleet manifest for the Instrument Control agent (instrument_control).
# Parsed by EdaAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: instrument_control
  # UI label shown in the dashboard and logs.
  display_name: Instrument-Control Agent
  # One-paragraph charter for planners and operators.
  description: Operate approved instruments through a typed safety-enforcing adapter and record every
    command and measurement.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Operate approved instruments through a typed safety-enforcing adapter and record every
  command and measurement.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the instrument_control manifest: Submit an approved procedure inside its safe bounds
  - Submit an approved procedure inside its safe bounds
  # List entry consumed by the instrument_control manifest: Record measurements
  - Record measurements
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the instrument_control manifest: Exceed a configured limit
  - Exceed a configured limit
  # List entry consumed by the instrument_control manifest: Run a procedure that has no approval-point record
  - Run a procedure that has no approval-point record
  # List entry consumed by the instrument_control manifest: Widen a limit
  - Widen a limit
  # List entry consumed by the instrument_control manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the instrument_control manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the instrument_control manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8265
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for instrument_control (validation).
- id: run_instrument_procedure
  # One-paragraph charter for planners and operators.
  description: Execute one approved procedure through the lab adapter.
# Manifest field '- id' for instrument_control (validation).
- id: arm_power_supply
  # One-paragraph charter for planners and operators.
  description: Set a power supply inside the approved voltage and current limits.
# Manifest field '- id' for instrument_control (validation).
- id: capture_oscilloscope
  # One-paragraph charter for planners and operators.
  description: Capture one oscilloscope waveform inside the approved setup.
# Manifest field '- id' for instrument_control (validation).
- id: capture_logic_analyzer
  # One-paragraph charter for planners and operators.
  description: Capture one logic-analyzer trace.
# Manifest field '- id' for instrument_control (validation).
- id: set_thermal_setpoint
  # One-paragraph charter for planners and operators.
  description: Set a thermal chamber or plate inside the approved temperature limit.
# Manifest field '- id' for instrument_control (validation).
- id: read_instrument_state
  # One-paragraph charter for planners and operators.
  description: Read the live state of one instrument.
# Manifest field '- id' for instrument_control (validation).
- id: read_procedure_approval
  # One-paragraph charter for planners and operators.
  description: Read the approval record required before this procedure runs.
# Manifest field '- id' for instrument_control (validation).
- id: check_command_against_bounds
  # One-paragraph charter for planners and operators.
  description: Check a command against the approved voltage, current, and temperature limits.
# Manifest field '- id' for instrument_control (validation).
- id: record_instrument_command
  # One-paragraph charter for planners and operators.
  description: Record the command, instrument, limits, and operator approval ref.
# Manifest field '- id' for instrument_control (validation).
- id: record_measurement
  # One-paragraph charter for planners and operators.
  description: Store the measurement with board, voltage, temperature, and instrument state.
# Manifest field '- id' for instrument_control (validation).
- id: flag_command_over_limit
  # One-paragraph charter for planners and operators.
  description: Publish a command that would exceed a configured limit. The adapter must not run it.
# Manifest field '- id' for instrument_control (validation).
- id: flag_unapproved_procedure
  # One-paragraph charter for planners and operators.
  description: Publish a run requested without an approval-point record.
# Manifest field '- id' for instrument_control (validation).
- id: record_instrument_session
  # One-paragraph charter for planners and operators.
  description: Record every command and measurement in this session.
