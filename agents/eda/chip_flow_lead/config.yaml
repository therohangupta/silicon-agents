  # List entry consumed by the chip_flow_lead manifest: experiments
  - experiments
  # Record kinds filtered out before ranking.
  exclude:
  # List entry consumed by the chip_flow_lead manifest: stale_candidates
  - stale_candidates
  # Validation states removed before context ranking.
  drop:
  # List entry consumed by the chip_flow_lead manifest: rejected
  - rejected
  # Most-trusted authorship/validation states first.
  precedence:
  # List entry consumed by the chip_flow_lead manifest: human-authored
  - human-authored
  # List entry consumed by the chip_flow_lead manifest: validated
  - validated
  # List entry consumed by the chip_flow_lead manifest: provisional
  - provisional
  # States never dropped solely for token budget.
  protect:
  # List entry consumed by the chip_flow_lead manifest: human-authored
  - human-authored
