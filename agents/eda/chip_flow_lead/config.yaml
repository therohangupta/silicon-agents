  # One-paragraph charter for planners and operators.
  description: Replace a broad objective with a smaller workflow the stage can finish.
# Manifest field '- id' for chip_flow_lead (chip_flow).
- id: read_program_status
  # One-paragraph charter for planners and operators.
  description: Read milestone status for every active stage.
# Manifest field '- id' for chip_flow_lead (chip_flow).
- id: read_milestone_gates
