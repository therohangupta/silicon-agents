# Fleet manifest for the Chip Flow Lead agent (chip_flow_lead).
# Parsed by EDAAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: chip_flow_lead
  # UI label shown in the dashboard and logs.
  display_name: Chip Flow Lead
  # One-paragraph charter for planners and operators.
  description: Own the program plan from design intent through release. Keep milestone gates, route cross-stage
    findings backward, and revise the task graph when a stage reports that its strategy is invalid.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: program
    # Role class: lead, specialist, or validator.
    role: lead
# Role class: lead, specialist, or validator.
role: lead
# Pipeline stage this agent owns or serves.
stage: program
# Normative statement of what this agent owes the program.
responsibility: Own the program plan from design intent through release. Keep milestone gates, route cross-stage
  findings backward, and revise the task graph when a stage reports that its strategy is invalid.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the chip_flow_lead manifest: Read design intent and every stage's gate status
  - Read design intent and every stage's gate status
  # List entry consumed by the chip_flow_lead manifest: Publish a program workflow that names stage leads and milestone order
  - Publish a program workflow that names stage leads and milestone order
  # List entry consumed by the chip_flow_lead manifest: Request a human decision when a tradeoff exceeds delegated authority
  - Request a human decision when a tradeoff exceeds delegated authority
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the chip_flow_lead manifest: Edit RTL, constraints, or a physical database
  - Edit RTL, constraints, or a physical database
  # List entry consumed by the chip_flow_lead manifest: Mark a milestone passed without the stage's independent gate
  - Mark a milestone passed without the stage's independent gate
  # List entry consumed by the chip_flow_lead manifest: Drop a hard requirement to keep a schedule
  - Drop a hard requirement to keep a schedule
  # List entry consumed by the chip_flow_lead manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the chip_flow_lead manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the chip_flow_lead manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to:
# List entry consumed by the chip_flow_lead manifest: requirements
- requirements
# List entry consumed by the chip_flow_lead manifest: architecture_lead
- architecture_lead
# List entry consumed by the chip_flow_lead manifest: rtl_lead
- rtl_lead
# List entry consumed by the chip_flow_lead manifest: verification_lead
- verification_lead
# List entry consumed by the chip_flow_lead manifest: dft_lead
- dft_lead
# List entry consumed by the chip_flow_lead manifest: synthesis_lead
- synthesis_lead
# List entry consumed by the chip_flow_lead manifest: floorplanning_lead
- floorplanning_lead
# List entry consumed by the chip_flow_lead manifest: placement_lead
- placement_lead
# List entry consumed by the chip_flow_lead manifest: cts
- cts
# List entry consumed by the chip_flow_lead manifest: clock_validation
- clock_validation
# List entry consumed by the chip_flow_lead manifest: routing_lead
- routing_lead
# List entry consumed by the chip_flow_lead manifest: extraction
- extraction
# List entry consumed by the chip_flow_lead manifest: sta_lead
- sta_lead
# List entry consumed by the chip_flow_lead manifest: signoff_validator
- signoff_validator
# List entry consumed by the chip_flow_lead manifest: bringup_lead
- bringup_lead
# Independent gate agents that must grade this agent's output.
validators:
# List entry consumed by the chip_flow_lead manifest: signoff_validator
- signoff_validator
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8201
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for chip_flow_lead (chip_flow).
- id: revise_program_plan
  # One-paragraph charter for planners and operators.
  description: Publish a revised program workflow from current gate status and open findings.
