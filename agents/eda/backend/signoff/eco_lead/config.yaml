    objective: ''
    # Parent task correlation id.
    parent_task_id: ''
    # Block/partition scope for planning.
    scope_block: ''
  # Framework action verb (submit_tool_job, read_reports, publish_finding, etc.).
  action: create_workflow
  # Documented parameters the skill accepts from the task payload.
  params:
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: objective
    # Short charter describing what this signoff agent is responsible for.
    description: Outcome the child workflow must achieve.
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: parent_task_id
    # Short charter describing what this signoff agent is responsible for.
    description: Task that owns this workflow.
  # Stable agent id used in routing, findings, and agent_id tool observations.
  - name: scope_block
    # Short charter describing what this signoff agent is responsible for.
    description: Block the workflow applies to. Empty means the task's current block.
