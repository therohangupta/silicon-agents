# Agent Fleet manifest for ECO Lead (eco_lead).
# Domain: engineering change orders (ECO) for late RTL/timing/power/physical fixes.
# EDA focus: ECO scope, equivalence, impacted STA/DRC/LVS gates, human authorization.
# Loaded by agent.py via EDAAgent.read_spec and by server.py via AgentService.from_agent.
# HTTP port 8261 must stay aligned with connection.port, Dockerfile EXPOSE, and deployment.

# Agent Fleet manifest schema version for this Agent resource.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for fleet loaders.
kind: Agent
# Identity and labeling block consumed by discovery and observability.
metadata:
  # Stable agent id `eco_lead` used in tool_observation and fleet routing.
  name: eco_lead
  # Human-readable agent title shown in UIs and journals.
  display_name: ECO Lead
  # Short charter describing what this signoff agent is responsible for.
  description: Plan a late functional, timing, power, or physical change. Minimize disruption, preserve
    equivalence, and name every check the change invalidates.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent participates in.
    stage: signoff
    # Fleet role: worker executes tools; lead plans and delegates.
    role: lead
# Fleet role: worker executes tools; lead plans and delegates.
role: lead
# Pipeline stage this agent participates in.
stage: signoff
# Authoritative one-paragraph responsibility used in prompts and docs.
responsibility: Plan a late functional, timing, power, or physical change. Minimize disruption, preserve
  equivalence, and name every check the change invalidates.
# Hard may / may_not contract enforced by policy and reviewers.
boundary:
  # Operations this agent is allowed to perform in the signoff flow.
  may:
  # Signoff boundary or context item: Publish an ECO workflow
  - Publish an ECO workflow
  # Signoff boundary or context item: Read the open finding and the current baseline
  - Read the open finding and the current baseline
  # Signoff boundary or context item: Request a human decision before an ECO is applied
  - Request a human decision before an ECO is applied
  # Forbidden actions (waiver, promote, edit canonical baseline, etc.).
  may_not:
  # Signoff boundary or context item: Apply the ECO without equivalence when function changes
  - Apply the ECO without equivalence when function changes
  # Signoff boundary or context item: Skip an impacted signoff check
  - Skip an impacted signoff check
  # Signoff boundary or context item: Promote the ECO
  - Promote the ECO
  # Signoff boundary or context item: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Signoff boundary or context item: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Signoff boundary or context item: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks against (empty for pure workers).
delegates_to:
# Signoff boundary or context item: rtl_implementation
- rtl_implementation
# Signoff boundary or context item: equivalence
- equivalence
# Signoff boundary or context item: timing_debug
- timing_debug
# Signoff boundary or context item: drc_lvs
- drc_lvs
# Independent validators that must grade this agent's outputs (often empty).
validators: []
# Network binding for the HTTP AgentService inside Docker.
connection:
  # Docker-published host reachable from other fleet services.
  host: host.docker.internal
  # TCP port 8261 for this agent's AgentService (must match Dockerfile EXPOSE).
  port: 8261
  # HTTP paths for health probes and task execution.
  endpoints:
    # Liveness/readiness path returning service health.
    health: /health
    # Path that accepts execute-task requests from the orchestrator.
    execute: /tasks/execute
# LLM/tool backend binding; type none means tools are observations until adapted.
backend:
  # Backend type discriminator for the agent runtime.
  type: none
# How skills are invoked when a task arrives.
execution:
  # Functional/analysis mode filter or target.
  mode: direct_function
  # Limits on parallel signoff jobs for this container.
  concurrency:
    # Maximum concurrent tasks; signoff tools are often serialized at 1.
    max_tasks: 1
# Timeouts and failure policy for long EDA jobs.
reliability:
  # Wall seconds before a hanging tool job is aborted.
  task_timeout_secs: 120
  # Retries before the orchestrator must replan.
  max_retries: 1
  # Orchestrator action when the task fails after retries.
  on_failure: replan
# Advertised capability ids matching tools (discovery surface).
capabilities:
# Stable capability or skill or stream identifier.
- id: plan_eco
  # Short charter describing what this signoff agent is responsible for.
  description: Emit the smallest workflow that implements and revalidates one ECO.
# Stable capability or skill or stream identifier.
- id: request_eco_rtl_edit
  # Short charter describing what this signoff agent is responsible for.
  description: Open one bounded RTL edit for a functional ECO.
# Stable capability or skill or stream identifier.
- id: request_eco_equivalence
  # Short charter describing what this signoff agent is responsible for.
  description: Open equivalence for an ECO that changes logic.
# Stable capability or skill or stream identifier.
- id: request_eco_timing
  # Short charter describing what this signoff agent is responsible for.
  description: Open timing on the paths the ECO can move.
# Stable capability or skill or stream identifier.
- id: request_eco_physical_verification
  # Short charter describing what this signoff agent is responsible for.
  description: Open DRC and LVS for a physical ECO.
# Stable capability or skill or stream identifier.
- id: list_impacted_checks
  # Short charter describing what this signoff agent is responsible for.
  description: List the gates this ECO invalidates.
# Stable capability or skill or stream identifier.
- id: read_eco_finding
  # Short charter describing what this signoff agent is responsible for.
  description: Read the finding this ECO is supposed to close.
# Stable capability or skill or stream identifier.
- id: read_eco_baseline
  # Short charter describing what this signoff agent is responsible for.
  description: Read the baseline the ECO must descend from.
# Stable capability or skill or stream identifier.
- id: estimate_eco_disruption
  # Short charter describing what this signoff agent is responsible for.
  description: List files, nets, and path groups the ECO touches.
# Stable capability or skill or stream identifier.
- id: flag_missing_eco_check
  # Short charter describing what this signoff agent is responsible for.
  description: Publish an impacted check the workflow does not rerun.
# Stable capability or skill or stream identifier.
- id: record_eco_scope
  # Short charter describing what this signoff agent is responsible for.
  description: Record the hypothesis, the baseline, and the checks that must rerun.
# Stable capability or skill or stream identifier.
- id: request_eco_authorization
  # Short charter describing what this signoff agent is responsible for.
  description: Ask a human to authorize the ECO before it is applied.
# Stable capability or skill or stream identifier.
- id: delegate_tasks
  # Short charter describing what this signoff agent is responsible for.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
# Concrete skill bindings: module/callable plus action and params.
skills:
# Stable capability or skill or stream identifier.
- id: plan_eco
  # Python module providing the callable (tools for this package).
  module: tools
  # Function name inside the module invoked for this skill.
  callable: plan_eco
  # Short charter describing what this signoff agent is responsible for.
  description: Emit the smallest workflow that implements and revalidates one ECO.
  # Default argument values when the orchestrator omits fields.
  args_defaults:
