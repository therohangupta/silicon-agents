# Stable capability or skill or stream identifier.
- id: report_leakage_power
  # Short charter describing what this signoff agent is responsible for.
  description: Report leakage power.
# Stable capability or skill or stream identifier.
- id: report_clock_network_power
  # Short charter describing what this signoff agent is responsible for.
  description: Report clock-network power from the power analysis.
# Stable capability or skill or stream identifier.
- id: identify_power_contributors
  # Short charter describing what this signoff agent is responsible for.
  description: List the blocks and clocks that dominate power.
# Stable capability or skill or stream identifier.
- id: compare_power_to_budget
  # Short charter describing what this signoff agent is responsible for.
  description: Compare the estimate with the block and chip budgets.
# Stable capability or skill or stream identifier.
- id: report_activity_uncertainty
  # Short charter describing what this signoff agent is responsible for.
  description: Report which power numbers move when activity changes.
# Stable capability or skill or stream identifier.
- id: flag_power_over_budget
  # Short charter describing what this signoff agent is responsible for.
  description: Publish an estimate that crosses the budget.
# Stable capability or skill or stream identifier.
- id: record_power_analysis_provenance
  # Short charter describing what this signoff agent is responsible for.
  description: Record the activity file, corner, and tool version.
