# Local journal cache configuration for this agent process.
memory:
  # Named memory stores the agent may touch.
  stores:
  # Stable identifier for this list entry.
  - id: journal
    # Human-readable description for this manifest entry.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
    type: list
    # Persistence medium (file-backed under SILICON_MEMORY_ROOT).
    persistence: file
    # Store-specific configuration map.
    config:
      # Filesystem root for the local journal cache.
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry emission settings.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where structured telemetry streams are POSTed.
  telemetry:
    # Telemetry collector URL (TELEMETRY_URL override).
    endpoint: ${TELEMETRY_URL}
    # Named telemetry streams this agent emits.
    streams:
    # Stable agent id used in delegation graphs, findings, and telemetry.
    - name: skill_calls
      # Human-readable description for this manifest entry.
      description: Tool invocations.
    # Stable agent id used in delegation graphs, findings, and telemetry.
    - name: artifacts
      # Human-readable description for this manifest entry.
      description: Structured task results.
# Container image and runtime environment for this agent.
deployment:
  # Docker image tag published for this agent.
  image: agentfleet/floorplanning_lead:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Environment variables injected at container start.
  environment:
    # Optional bound EDA framework name; empty keeps tools not_run.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Field `plan` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
plan:
# Stable identifier for this list entry.
- id: macro_placement
  # Field `agent` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  agent: macro_placement
  # Field `depends_on` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  depends_on: []
  # Planner-facing outcome string for child workflows.
  objective: Generate macro placements
# Stable identifier for this list entry.
- id: pin_assignment
  # Field `agent` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  agent: pin_assignment
  # Field `depends_on` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  depends_on:
  # Entry under `depends_on` for Floorplanning Lead: macro_placement
  - macro_placement
  # Planner-facing outcome string for child workflows.
  objective: Assign pins
# Stable identifier for this list entry.
- id: power_grid
  # Field `agent` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  agent: power_grid
  # Field `depends_on` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  depends_on:
  # Entry under `depends_on` for Floorplanning Lead: macro_placement
  - macro_placement
  # Planner-facing outcome string for child workflows.
  objective: Build an early power grid
# Stable identifier for this list entry.
- id: early_congestion_timing
  # Field `agent` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  agent: early_congestion_timing
  # Field `depends_on` in the Floorplanning Lead agent manifest (floorplan stage, role lead).
  depends_on:
  # Entry under `depends_on` for Floorplanning Lead: pin_assignment
  - pin_assignment
  # Entry under `depends_on` for Floorplanning Lead: power_grid
  - power_grid
  # Planner-facing outcome string for child workflows.
  objective: Estimate routability and timing
# Context-assembly policy for engineering memory records.
context:
  # Record kinds always pulled into the task context package.
  include:
  # Entry under `include` for Floorplanning Lead: gates
  - gates
  # Entry under `include` for Floorplanning Lead: workflows
  - workflows
  # Entry under `include` for Floorplanning Lead: open_findings
  - open_findings
  # Entry under `include` for Floorplanning Lead: decisions
  - decisions
  # Entry under `include` for Floorplanning Lead: experiments
  - experiments
  # Record kinds omitted from context even if present.
  exclude:
  # Entry under `exclude` for Floorplanning Lead: stale_candidates
  - stale_candidates
  # Validation states stripped from context (e.g. rejected).
  drop:
  # Entry under `drop` for Floorplanning Lead: rejected
  - rejected
  # Preference order when conflicting records exist.
  precedence:
  # Entry under `precedence` for Floorplanning Lead: human-authored
  - human-authored
  # Entry under `precedence` for Floorplanning Lead: validated
  - validated
  # Entry under `precedence` for Floorplanning Lead: provisional
  - provisional
  # Record authorship classes that must not be overwritten lightly.
  protect:
  # Entry under `protect` for Floorplanning Lead: human-authored
  - human-authored
  # Approximate token budget for assembled context sent to the model.
  token_budget: 80000
