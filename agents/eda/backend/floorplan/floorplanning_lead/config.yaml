# Agent manifest for Floorplanning Lead (role=lead, stage=floorplan, port=8238).
# EDA focus: Partition floorplanning: macros, pins, PDN, blockages, early routability/timing; recommend without promote.
# Every mapping key and list entry has a comment; multi-line string values are untouched.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; Agent means a runnable chip-design agent service.
kind: Agent
# Human- and registry-facing identity for this agent.
metadata:
  # Stable agent id used in delegation graphs, findings, and telemetry.
  name: floorplanning_lead
  # UI-facing title for operators and dashboards.
  display_name: Floorplanning Lead
  # One-paragraph responsibility statement shown in registries and UIs.
  description: Own macro, pin, power-grid, blockage, and utilization decisions for one partition, and
    recommend a candidate for placement.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent belongs to in the backend flow.
    stage: floorplan
    # lead orchestrates workers; worker executes specialist tools.
    role: lead
# lead orchestrates workers; worker executes specialist tools.
role: lead
# Pipeline stage this agent belongs to in the backend flow.
stage: floorplan
# Authoritative responsibility text mirrored from the design system.
responsibility: Own macro, pin, power-grid, blockage, and utilization decisions for one partition, and
  recommend a candidate for placement.
# Hard may / may_not rules the runtime enforces on tool actions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Entry under `may` for Floorplanning Lead: Publish a floorplan exploration workflow
  - Publish a floorplan exploration workflow
  # Entry under `may` for Floorplanning Lead: Read the netlist, constraints, and package contract
  - Read the netlist, constraints, and package contract
  # Entry under `may` for Floorplanning Lead: Request an upstream decision when the floorplan is infeasible
  - Request an upstream decision when the floorplan is infeasible
  # Actions this agent must never perform (promotion, waivers, etc.).
  may_not:
  # Entry under `may_not` for Floorplanning Lead: Edit RTL when the floorplan is infeasible
  - Edit RTL when the floorplan is infeasible
  # Entry under `may_not` for Floorplanning Lead: Advance a candidate that breaks a hard physical limit
  - Advance a candidate that breaks a hard physical limit
  # Entry under `may_not` for Floorplanning Lead: Promote a floorplan
  - Promote a floorplan
  # Entry under `may_not` for Floorplanning Lead: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Entry under `may_not` for Floorplanning Lead: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Entry under `may_not` for Floorplanning Lead: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows toward.
delegates_to:
# Entry under `delegates_to` for Floorplanning Lead: macro_placement
- macro_placement
# Entry under `delegates_to` for Floorplanning Lead: pin_assignment
- pin_assignment
# Entry under `delegates_to` for Floorplanning Lead: power_grid
- power_grid
# Entry under `delegates_to` for Floorplanning Lead: early_congestion_timing
- early_congestion_timing
# Optional validator agent ids that must confirm outcomes.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname inside Docker networks (host.docker.internal for local).
  host: host.docker.internal
  # TCP port this agent's uvicorn server listens on.
  port: 8238
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness/readiness path probed by the fleet.
    health: /health
    # Path that accepts AgentTaskRequest payloads.
    execute: /tasks/execute
# Tool-backend binding; type none means observations are not_run until bound.
backend:
  # Backend adapter type (none until OpenROAD/Yosys/etc. is wired).
  type: none
# How the agent runs tools for a task.
execution:
  # direct_function invokes Python callables named in skills.
  mode: direct_function
  # Limits on parallel task handling inside one process.
  concurrency:
    # Maximum simultaneous tasks (1 keeps experiment isolation simple).
    max_tasks: 1
# Timeouts, retries, and failure policy for task handling.
reliability:
  # Wall-clock seconds before a task is considered failed.
  task_timeout_secs: 120
  # How many times the fleet may retry a failed task.
  max_retries: 1
  # Policy when tools fail (replan asks the lead to adjust the graph).
  on_failure: replan
# Declared capability ids surfaced to planners (mirrors skills).
capabilities:
# Stable identifier for this list entry.
- id: plan_floorplan_exploration
  # Human-readable description for this manifest entry.
  description: Emit the floorplan workflow for this partition.
# Stable identifier for this list entry.
- id: request_macro_alternatives
  # Human-readable description for this manifest entry.
  description: Open another macro-placement batch with one changed constraint.
# Stable identifier for this list entry.
- id: request_pin_assignment
  # Human-readable description for this manifest entry.
  description: Open pin assignment for the current macro candidate.
# Stable identifier for this list entry.
- id: request_power_grid
  # Human-readable description for this manifest entry.
  description: Open an early power-grid candidate.
# Stable identifier for this list entry.
- id: request_early_physical_estimate
  # Human-readable description for this manifest entry.
  description: Open trial placement, global route, and early timing.
# Stable identifier for this list entry.
- id: read_floorplan_inputs
  # Human-readable description for this manifest entry.
  description: Read die, utilization, macros, constraints, and package contract.
# Stable identifier for this list entry.
- id: read_floorplan_metrics
  # Human-readable description for this manifest entry.
  description: Read congestion, early timing, pin density, and IR proxy for each candidate.
# Stable identifier for this list entry.
- id: compare_floorplan_candidates
  # Human-readable description for this manifest entry.
  description: Rank candidates that satisfy hard physical limits.
# Stable identifier for this list entry.
- id: recommend_floorplan_candidate
  # Human-readable description for this manifest entry.
  description: Record which floorplan should advance to placement. This does not promote it.
# Stable identifier for this list entry.
- id: request_floorplan_upstream_change
  # Human-readable description for this manifest entry.
  description: Publish evidence when pin density or hierarchy makes the floorplan infeasible.
# Stable identifier for this list entry.
- id: flag_hard_physical_limit
  # Human-readable description for this manifest entry.
  description: Publish a candidate that breaks a keepout, pin-density, or IR limit.
# Stable identifier for this list entry.
- id: record_floorplan_strategy
  # Human-readable description for this manifest entry.
  description: Record which physical variable the next batch will change.
# Stable identifier for this list entry.
- id: request_floorplan_decision
  # Human-readable description for this manifest entry.
  description: Ask a human to choose among feasible floorplans or to change an upstream contract.
# Stable identifier for this list entry.
- id: delegate_tasks
  # Human-readable description for this manifest entry.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
