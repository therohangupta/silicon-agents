# Agent manifest for Routing Lead (id=routing_lead, port=8249).
# EDA role: Global and detailed routing closure. Coordinates congestion relief, timing-driven route choices, signal-integrity (SI) noise repair, antenna fixes, and manufacturability checks before any routed candidate advances.
# Loaded by EDAAgent.read_spec / AgentService.from_agent; skills map to tools.py.

# Fleet schema version for this Agent manifest (agentfleet/v1).
apiVersion: agentfleet/v1
# Resource kind; must be Agent for worker/lead physical-design agents.
kind: Agent
# Identity and labels used by the fleet registry and dashboards.
metadata:
  # Stable agent id ``routing_lead`` used in telemetry and tool_observation.
  name: routing_lead
  # Human-readable title shown in UIs and READMEs.
  display_name: Routing Lead
  # One-paragraph responsibility for this physical-design stage.
  description: Own global and detailed routing closure, including congestion, timing, signal integrity,
    antenna, and manufacturability.
  # Labels expose stage and role.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: routing
    # Fleet role: lead orchestrates; worker executes; validator independently checks.
    role: lead
# Fleet role ``lead`` (lead orchestrates; worker executes).
role: lead
# Physical-design stage ``routing`` for planning and context filters.
stage: routing
# Authoritative responsibility string mirrored from description.
responsibility: Own global and detailed routing closure, including congestion, timing, signal integrity,
  antenna, and manufacturability.
# Hard may / may_not contract enforced conceptually by planning and permissions.
boundary:
  # Actions this agent is allowed to perform.
  may:
  # Allowed action: Publish a routing workflow
  - Publish a routing workflow
  # Allowed action: Read the placed and clocked candidate
  - Read the placed and clocked candidate
  # Allowed action: Recommend which routed candidate advances
  - Recommend which routed candidate advances
  # Forbidden actions (no silent promotion, no self-signoff, etc.).
  may_not:
  # Forbidden: Advance a routed database that failed antenna or SI checks
  - Advance a routed database that failed antenna or SI checks
  # Forbidden: Edit placement directly
  - Edit placement directly
  # Forbidden: Promote a route
  - Promote a route
  # Forbidden: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids a lead may schedule.
delegates_to:
# Child agent id this lead may schedule: global_routing
- global_routing
# Child agent id this lead may schedule: detailed_routing_repair
- detailed_routing_repair
# Child agent id this lead may schedule: si_noise_repair
- si_noise_repair
# Child agent id this lead may schedule: antenna_manufacturability
- antenna_manufacturability
# Optional independent validator agent ids.
validators: []
# HTTP reachability for AgentService inside Docker/compose.
connection:
  # Hostname peers use to reach this container (host.docker.internal for local).
  host: host.docker.internal
  # HTTP port 8249 for Routing Lead AgentService endpoints.
  port: 8249
  # Path map for health and execute routes.
  endpoints:
    # Liveness/readiness HTTP path.
    health: /health
    # Task submission HTTP path.
    execute: /tasks/execute
# EDA framework backend binding (none until OpenROAD adapter configured).
backend:
  # Backend type discriminator (none means observations stay not_run).
  type: none
# How skills are invoked by the agent runtime.
execution:
  # Mode parameter (overloaded key; YAML context distinguishes).
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum concurrent tasks for this agent process.
    max_tasks: 1
# Timeouts, retries, and failure policy for tasks.
reliability:
  # Wall-clock timeout for one task attempt.
  task_timeout_secs: 120
  # How many times to retry a failed task before replan/give-up.
  max_retries: 1
  # Planner hint when the task fails (e.g. replan).
  on_failure: replan
# Capability index mirroring skills for UIs and planners.
capabilities:
# Stable id for a capability, skill, memory store, or stream.
- id: plan_routing_closure
  # One-paragraph responsibility for this physical-design stage.
  description: Emit the routing and repair workflow.
# Stable id for a capability, skill, memory store, or stream.
- id: request_global_route_trial
  # One-paragraph responsibility for this physical-design stage.
  description: Open one global-route experiment.
# Stable id for a capability, skill, memory store, or stream.
- id: request_detailed_route_repair
  # One-paragraph responsibility for this physical-design stage.
  description: Open a localized detailed-route repair.
# Stable id for a capability, skill, memory store, or stream.
- id: request_si_repair
  # One-paragraph responsibility for this physical-design stage.
  description: Open an SI repair for nets over the noise limit.
# Stable id for a capability, skill, memory store, or stream.
- id: request_antenna_repair
  # One-paragraph responsibility for this physical-design stage.
  description: Open antenna and manufacturability repair.
# Stable id for a capability, skill, memory store, or stream.
- id: read_routing_status
  # One-paragraph responsibility for this physical-design stage.
  description: Read congestion, DRC, SI, antenna, and timing for each routed candidate.
# Stable id for a capability, skill, memory store, or stream.
- id: read_routing_acceptance
  # One-paragraph responsibility for this physical-design stage.
  description: Read the DRC, SI, antenna, and timing criteria for advancement.
# Stable id for a capability, skill, memory store, or stream.
- id: compare_routed_candidates
  # One-paragraph responsibility for this physical-design stage.
  description: Rank routed candidates that meet every hard check.
# Stable id for a capability, skill, memory store, or stream.
- id: recommend_routed_candidate
  # One-paragraph responsibility for this physical-design stage.
  description: Record which routed candidate should advance to extraction. This does not promote it.
# Stable id for a capability, skill, memory store, or stream.
- id: flag_failed_route_check
  # One-paragraph responsibility for this physical-design stage.
  description: Publish a candidate that improved congestion and failed antenna, SI, or DRC.
# Stable id for a capability, skill, memory store, or stream.
- id: record_routing_strategy
  # One-paragraph responsibility for this physical-design stage.
  description: Record the layer, cost, or repair change for the next trial.
# Stable id for a capability, skill, memory store, or stream.
- id: request_routing_decision
  # One-paragraph responsibility for this physical-design stage.
  description: Ask a human to choose among routed candidates or to change a physical limit.
# Stable id for a capability, skill, memory store, or stream.
- id: delegate_tasks
  # One-paragraph responsibility for this physical-design stage.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
