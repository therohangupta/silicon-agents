# Engineering-memory configuration for this agent.
memory:
  # Named local memory stores (journal cache, etc.).
  stores:
  # Stable id for a capability, skill, memory store, or stream.
  - id: journal
    # One-paragraph responsibility for this physical-design stage.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend type discriminator (none means observations stay not_run).
    type: list
    # Persistence medium (file, ...).
    persistence: file
    # Store-specific configuration block.
    config:
      # Filesystem path template for file-backed memory.
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry export settings.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where skill_calls/artifacts streams are shipped.
  telemetry:
    # Telemetry service URL (env-overridable).
    endpoint: ${TELEMETRY_URL}
    # Named telemetry streams this agent emits.
    streams:
    # Stable agent id (matches tool_observation agent_id and deployment naming).
    - name: skill_calls
      # One-paragraph responsibility for this physical-design stage.
      description: Tool invocations.
    # Stable agent id (matches tool_observation agent_id and deployment naming).
    - name: artifacts
      # One-paragraph responsibility for this physical-design stage.
      description: Structured task results.
# Container image and environment for compose/k8s.
deployment:
  # Container image name:tag for this agent.
  image: agentfleet/detailed_routing_repair:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Environment variables injected at runtime.
  environment:
    # Optional framework selector for adapters (empty = unbound).
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context assembly policy for engineering memory records.
context:
  # Record categories always considered for the prompt/context package.
  include:
  # Context include category: canonical_source
  - canonical_source
  # Context include category: open_findings
  - open_findings
  # Context include category: experiments
  - experiments
  # Context include category: gates
  - gates
  # Context include category: decisions
  - decisions
  # Record categories omitted from context.
  exclude:
  # Context exclude category: stale_candidates
  - stale_candidates
  # Statuses that cause records to be dropped.
  drop:
  # Drop records with status: rejected
  - rejected
  # Preference order when conflicting records exist.
  precedence:
  # Context precedence preference: human-authored
  - human-authored
  # Context precedence preference: validated
  - validated
  # Context precedence preference: provisional
  - provisional
  # Record classes that must not be auto-dropped.
  protect:
  # Protected record class: human-authored
  - human-authored
  # Approximate token budget for assembled context.
  token_budget: 80000
