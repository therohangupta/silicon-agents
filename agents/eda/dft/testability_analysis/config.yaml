# Local and shared engineering-memory configuration.
memory:
  # Named memory stores this agent may touch.
  stores:
  # Manifest field '- id' for testability_analysis (dft).
  - id: journal
    # One-paragraph charter for planners and operators.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend adapter type (none means tool_observation returns not_run).
    type: list
    # Where the store is kept (file vs ephemeral).
    persistence: file
    # Store-specific configuration block.
    config:
      # Filesystem root for silicon memory (env-substitutable).
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry stream configuration.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where skill_calls and artifacts are ingested.
  telemetry:
    # Telemetry service base URL (TELEMETRY_URL).
    endpoint: ${TELEMETRY_URL}
    # Named high-level telemetry stream categories.
    streams:
    # Manifest field '- name' for testability_analysis (dft).
    - name: skill_calls
      # One-paragraph charter for planners and operators.
      description: Tool invocations.
    # Manifest field '- name' for testability_analysis (dft).
    - name: artifacts
      # One-paragraph charter for planners and operators.
      description: Structured task results.
# Container image and Dockerfile pointers for compose.
deployment:
  # Published image tag for this agent.
  image: agentfleet/testability_analysis:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Env vars injected into the container.
  environment:
    # Optional bound EDA/lab framework adapter name.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context assembly policy for engineering memory.
context:
  # Record kinds always preferred into the context package.
  include:
  # List entry consumed by the testability_analysis manifest: requirements
  - requirements
  # List entry consumed by the testability_analysis manifest: canonical_source
  - canonical_source
  # List entry consumed by the testability_analysis manifest: open_findings
  - open_findings
  # List entry consumed by the testability_analysis manifest: gates
  - gates
  # Record kinds filtered out before ranking.
  exclude:
  # List entry consumed by the testability_analysis manifest: stale_candidates
  - stale_candidates
  # Validation states removed before context ranking.
  drop:
  # List entry consumed by the testability_analysis manifest: rejected
  - rejected
  # Most-trusted authorship/validation states first.
  precedence:
  # List entry consumed by the testability_analysis manifest: human-authored
  - human-authored
  # List entry consumed by the testability_analysis manifest: validated
  - validated
  # List entry consumed by the testability_analysis manifest: provisional
  - provisional
  # States never dropped solely for token budget.
  protect:
  # List entry consumed by the testability_analysis manifest: human-authored
  - human-authored
  # Approximate token cap for the assembled context package.
  token_budget: 80000
