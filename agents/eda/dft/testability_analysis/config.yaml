# Fleet manifest for the Testability Analysis agent (testability_analysis).
# Parsed by EDAAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: testability_analysis
  # UI label shown in the dashboard and logs.
  display_name: Testability Analysis Agent
  # One-paragraph charter for planners and operators.
  description: Find controllability and observability limits, X sources, and structures that block coverage,
    and propose a bounded change.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: dft
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: dft
# Normative statement of what this agent owes the program.
responsibility: Find controllability and observability limits, X sources, and structures that block coverage,
  and propose a bounded change.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the testability_analysis manifest: Read RTL and ATPG reports
  - Read RTL and ATPG reports
  # List entry consumed by the testability_analysis manifest: Write a proposal for a bounded RTL, constraint, or DFT change
  - Write a proposal for a bounded RTL, constraint, or DFT change
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the testability_analysis manifest: Apply the RTL change on the design candidate
  - Apply the RTL change on the design candidate
  # List entry consumed by the testability_analysis manifest: Mark faults untestable without evidence
  - Mark faults untestable without evidence
  # List entry consumed by the testability_analysis manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the testability_analysis manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the testability_analysis manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8228
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for testability_analysis (dft).
- id: read_atpg_untestables
  # One-paragraph charter for planners and operators.
  description: Read faults the ATPG tool marked untestable.
# Manifest field '- id' for testability_analysis (dft).
- id: find_x_sources
  # One-paragraph charter for planners and operators.
  description: List X sources that block controllability or observability.
# Manifest field '- id' for testability_analysis (dft).
- id: find_uncontrollable_logic
  # One-paragraph charter for planners and operators.
  description: List logic with no controllable path from a scan cell or primary input.
# Manifest field '- id' for testability_analysis (dft).
- id: find_unobservable_logic
  # One-paragraph charter for planners and operators.
  description: List logic with no observable path to a scan cell or primary output.
# Manifest field '- id' for testability_analysis (dft).
- id: trace_blocked_fault
  # One-paragraph charter for planners and operators.
  description: Trace one untestable fault to the structure that blocks it.
# Manifest field '- id' for testability_analysis (dft).
- id: classify_untestable_cause
  # One-paragraph charter for planners and operators.
  description: Classify a blocked fault as X, black box, constraint, or architecture.
# Manifest field '- id' for testability_analysis (dft).
- id: write_testability_proposal
  # One-paragraph charter for planners and operators.
  description: Write a bounded RTL, constraint, or DFT-architecture proposal. This does not edit the design
    candidate.
# Manifest field '- id' for testability_analysis (dft).
- id: estimate_coverage_recovery
  # One-paragraph charter for planners and operators.
  description: Estimate how many faults the proposal would recover.
# Manifest field '- id' for testability_analysis (dft).
- id: propose_testability_change
  # One-paragraph charter for planners and operators.
  description: Publish the proposal, the faults it targets, and who must apply it.
# Manifest field '- id' for testability_analysis (dft).
- id: flag_unjustified_untestable
  # One-paragraph charter for planners and operators.
  description: Publish a fault marked untestable without a traced cause.
# Manifest field '- id' for testability_analysis (dft).
- id: flag_blackbox_coverage_hole
  # One-paragraph charter for planners and operators.
  description: Publish a black box that hides required faults.
# Manifest field '- id' for testability_analysis (dft).
- id: record_testability_evidence
  # One-paragraph charter for planners and operators.
  description: Record the ATPG report and RTL revision this analysis used.
