# Manifest field '- id' for dft_lead (dft).
- id: request_dft_coverage_decision
  # Python module (relative) that defines the callable.
  module: tools
  # Function name exported from tools.py.
  callable: request_dft_coverage_decision
  # One-paragraph charter for planners and operators.
  description: Ask a human to accept or reject a coverage miss. This agent cannot waive it.
  # Default argument values when the LLM omits them.
  args_defaults:
    # Human decision prompt text.
    decision: ''
    # Comma-separated feasible options for a human.
    options: ''
    # Comma-separated artifact URIs backing a finding.
    evidence_refs: ''
    # ISO-8601 time after which the decision blocks schedule.
    deadline: ''
  # ToolAction enum semantic (create_workflow, read_reports, …).
  action: request_human_decision
  # Documented parameters the planner/LLM may fill.
  params:
  # Manifest field '- name' for dft_lead (dft).
  - name: decision
    # One-paragraph charter for planners and operators.
    description: The choice a human must make.
  # Manifest field '- name' for dft_lead (dft).
  - name: options
    # One-paragraph charter for planners and operators.
    description: Comma-separated feasible options.
  # Manifest field '- name' for dft_lead (dft).
  - name: evidence_refs
    # One-paragraph charter for planners and operators.
    description: Comma-separated artifact URIs for the tradeoff.
  # Manifest field '- name' for dft_lead (dft).
  - name: deadline
    # One-paragraph charter for planners and operators.
    description: ISO-8601 time after which the decision blocks the schedule.
# Local and shared engineering-memory configuration.
memory:
  # Named memory stores this agent may touch.
  stores:
  # Manifest field '- id' for dft_lead (dft).
  - id: journal
    # One-paragraph charter for planners and operators.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Backend adapter type (none means tool_observation returns not_run).
    type: list
    # Where the store is kept (file vs ephemeral).
    persistence: file
    # Store-specific configuration block.
    config:
      # Filesystem root for silicon memory (env-substitutable).
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry stream configuration.
observability:
  # Seconds between liveness heartbeats.
  heartbeat_interval_secs: 5
  # Where skill_calls and artifacts are ingested.
  telemetry:
    # Telemetry service base URL (TELEMETRY_URL).
    endpoint: ${TELEMETRY_URL}
    # Named high-level telemetry stream categories.
    streams:
    # Manifest field '- name' for dft_lead (dft).
    - name: skill_calls
      # One-paragraph charter for planners and operators.
      description: Tool invocations.
    # Manifest field '- name' for dft_lead (dft).
    - name: artifacts
      # One-paragraph charter for planners and operators.
      description: Structured task results.
# Container image and Dockerfile pointers for compose.
deployment:
  # Published image tag for this agent.
  image: agentfleet/dft_lead:1.0
  # Relative Dockerfile path used to build the image.
  dockerfile: Dockerfile
  # Env vars injected into the container.
  environment:
    # Optional bound EDA/lab framework adapter name.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Context assembly policy for engineering memory.
context:
  # Record kinds always preferred into the context package.
  include:
  # List entry consumed by the dft_lead manifest: gates
  - gates
  # List entry consumed by the dft_lead manifest: workflows
  - workflows
  # List entry consumed by the dft_lead manifest: open_findings
  - open_findings
  # List entry consumed by the dft_lead manifest: decisions
  - decisions
  # List entry consumed by the dft_lead manifest: experiments
  - experiments
  # Record kinds filtered out before ranking.
  exclude:
  # List entry consumed by the dft_lead manifest: stale_candidates
  - stale_candidates
  # Validation states removed before context ranking.
  drop:
  # List entry consumed by the dft_lead manifest: rejected
  - rejected
  # Most-trusted authorship/validation states first.
  precedence:
  # List entry consumed by the dft_lead manifest: human-authored
  - human-authored
  # List entry consumed by the dft_lead manifest: validated
  - validated
  # List entry consumed by the dft_lead manifest: provisional
  - provisional
  # States never dropped solely for token budget.
  protect:
  # List entry consumed by the dft_lead manifest: human-authored
  - human-authored
  # Approximate token cap for the assembled context package.
  token_budget: 80000
