# Fleet manifest for the DFT Lead agent (dft_lead).
# Parsed by EDAAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: dft_lead
  # UI label shown in the dashboard and logs.
  display_name: DFT Lead
  # One-paragraph charter for planners and operators.
  description: Own the block and chip test strategy. Decompose it into scan, ATPG, self-test, and physical-integration
    work, and coordinate closure against coverage, test time, area, power, and timing.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: dft
    # Role class: lead, specialist, or validator.
    role: lead
# Role class: lead, specialist, or validator.
role: lead
# Pipeline stage this agent owns or serves.
stage: dft
# Normative statement of what this agent owes the program.
responsibility: Own the block and chip test strategy. Decompose it into scan, ATPG, self-test, and physical-integration
  work, and coordinate closure against coverage, test time, area, power, and timing.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the dft_lead manifest: Publish a DFT workflow
  - Publish a DFT workflow
  # List entry consumed by the dft_lead manifest: Read RTL and test requirements
  - Read RTL and test requirements
  # List entry consumed by the dft_lead manifest: Request a human decision on a coverage miss
  - Request a human decision on a coverage miss
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the dft_lead manifest: Edit functional RTL to chase coverage without a finding
  - Edit functional RTL to chase coverage without a finding
  # List entry consumed by the dft_lead manifest: Waive fault coverage
  - Waive fault coverage
  # List entry consumed by the dft_lead manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the dft_lead manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the dft_lead manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to:
# List entry consumed by the dft_lead manifest: scan_insertion
- scan_insertion
# List entry consumed by the dft_lead manifest: atpg_campaign
- atpg_campaign
# List entry consumed by the dft_lead manifest: testability_analysis
- testability_analysis
# List entry consumed by the dft_lead manifest: mbist_lbist
- mbist_lbist
# List entry consumed by the dft_lead manifest: dft_physical_timing
- dft_physical_timing
# List entry consumed by the dft_lead manifest: dft_validator
- dft_validator
# Independent gate agents that must grade this agent's output.
validators:
# List entry consumed by the dft_lead manifest: dft_validator
- dft_validator
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8225
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for dft_lead (dft).
- id: plan_dft_closure
  # One-paragraph charter for planners and operators.
  description: Emit the DFT workflow for this revision.
# Manifest field '- id' for dft_lead (dft).
- id: request_scan_insertion
