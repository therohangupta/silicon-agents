# Manifest field '- id' for scan_insertion (dft).
- id: read_scan_connectivity
  # One-paragraph charter for planners and operators.
  description: Read chain counts, lockup cells, and broken connections.
# Manifest field '- id' for scan_insertion (dft).
- id: read_scan_chain_lengths
