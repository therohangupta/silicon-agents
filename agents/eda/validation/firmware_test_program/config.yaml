# Fleet manifest for the Firmware / Test Program agent (firmware_test_program).
# Parsed by EDAAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: firmware_test_program
  # UI label shown in the dashboard and logs.
  display_name: Firmware and Test-Program Agent
  # One-paragraph charter for planners and operators.
  description: Draft and debug low-level firmware, diagnostics, boot flows, and test programs used to
    exercise silicon.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Draft and debug low-level firmware, diagnostics, boot flows, and test programs used to
  exercise silicon.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the firmware_test_program manifest: Edit firmware on an isolated branch
  - Edit firmware on an isolated branch
  # List entry consumed by the firmware_test_program manifest: Draft a test program
  - Draft a test program
  # List entry consumed by the firmware_test_program manifest: Compile the firmware
  - Compile the firmware
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the firmware_test_program manifest: Flash a part
  - Flash a part
  # List entry consumed by the firmware_test_program manifest: Change bring-up limits
  - Change bring-up limits
  # List entry consumed by the firmware_test_program manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the firmware_test_program manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the firmware_test_program manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8266
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for firmware_test_program (validation).
- id: draft_firmware_change
  # One-paragraph charter for planners and operators.
  description: Write one bounded firmware or diagnostic change.
# Manifest field '- id' for firmware_test_program (validation).
- id: write_boot_flow
  # One-paragraph charter for planners and operators.
  description: Write or edit the boot sequence on the isolated branch.
# Manifest field '- id' for firmware_test_program (validation).
- id: write_diagnostic
  # One-paragraph charter for planners and operators.
  description: Write one diagnostic that exercises a named block.
# Manifest field '- id' for firmware_test_program (validation).
- id: draft_test_program
  # One-paragraph charter for planners and operators.
  description: Write a characterization or production test program.
# Manifest field '- id' for firmware_test_program (validation).
- id: write_test_limits
  # One-paragraph charter for planners and operators.
  description: Write pass limits copied from the approved specification. This agent cannot widen them.
# Manifest field '- id' for firmware_test_program (validation).
- id: write_test_pattern
  # One-paragraph charter for planners and operators.
  description: Write one pattern the test program applies.
# Manifest field '- id' for firmware_test_program (validation).
- id: compile_firmware
  # One-paragraph charter for planners and operators.
  description: Compile the firmware branch.
# Manifest field '- id' for firmware_test_program (validation).
- id: compile_test_program
  # One-paragraph charter for planners and operators.
  description: Compile the test program.
# Manifest field '- id' for firmware_test_program (validation).
- id: read_firmware_diff
  # One-paragraph charter for planners and operators.
  description: Read the diff against the firmware baseline.
# Manifest field '- id' for firmware_test_program (validation).
- id: flag_limit_widening
  # One-paragraph charter for planners and operators.
  description: Publish a test program whose limits are looser than the approved specification.
# Manifest field '- id' for firmware_test_program (validation).
- id: flag_firmware_without_diagnostic
  # One-paragraph charter for planners and operators.
  description: Publish a change that has no way to observe the block it touches.
# Manifest field '- id' for firmware_test_program (validation).
- id: record_firmware_revision
  # One-paragraph charter for planners and operators.
  description: Record the firmware revision, compiler, and test program.
