# Fleet manifest for the Failure Correlation agent (failure_correlation).
# Parsed by EDAAgent.read_spec / gateway YAML scanner. Comments are documentation only.

# Fleet schema version for the agent manifest parser.
apiVersion: agentfleet/v1
# Resource kind; must be Agent for gateway YAML scanning.
kind: Agent
# Human- and machine-readable identity for dashboards and fleet select.
metadata:
  # Stable agent id used in delegates_to, tool agent_id, and routing.
  name: failure_correlation
  # UI label shown in the dashboard and logs.
  display_name: Failure-Correlation Agent
  # One-paragraph charter for planners and operators.
  description: Correlate a silicon failure with simulation, formal, signoff, firmware, and manufacturing
    evidence, and name the earliest abstraction that reproduces it.
  # Stage and role for this agent.
  labels:
    # Pipeline stage this agent owns or serves.
    stage: validation
    # Role class: lead, specialist, or validator.
    role: worker
# Role class: lead, specialist, or validator.
role: worker
# Pipeline stage this agent owns or serves.
stage: validation
# Normative statement of what this agent owes the program.
responsibility: Correlate a silicon failure with simulation, formal, signoff, firmware, and manufacturing
  evidence, and name the earliest abstraction that reproduces it.
# Hard may / may_not envelope enforced in planning and reviews.
boundary:
  # Actions this agent is allowed to take on candidates and memory.
  may:
  # List entry consumed by the failure_correlation manifest: Read silicon and pre-silicon evidence
  - Read silicon and pre-silicon evidence
  # List entry consumed by the failure_correlation manifest: Name the earliest abstraction that reproduces the failure
  - Name the earliest abstraction that reproduces the failure
  # Forbidden actions (waivers, baseline promotion, self-signoff, etc.).
  may_not:
  # List entry consumed by the failure_correlation manifest: Close the failure
  - Close the failure
  # List entry consumed by the failure_correlation manifest: Edit RTL
  - Edit RTL
  # List entry consumed by the failure_correlation manifest: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # List entry consumed by the failure_correlation manifest: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # List entry consumed by the failure_correlation manifest: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open workflows for.
delegates_to: []
# Independent gate agents that must grade this agent's output.
validators: []
# How other services reach this agent's HTTP process.
connection:
  # Hostname from sibling containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port exposed by this agent's Dockerfile / server.
  port: 8269
  # HTTP paths the AgentService registers.
  endpoints:
    # Liveness probe path for orchestrators.
    health: /health
    # Task execution POST path used by the fleet server.
    execute: /tasks/execute
# EDA tool backend binding; none until a framework adapter is attached.
backend:
  # Backend adapter type (none means tool_observation returns not_run).
  type: none
# How tools are invoked inside the agent process.
execution:
  # Functional or test-mode filter for report reads.
  mode: direct_function
  # Parallelism limits for in-flight tasks.
  concurrency:
    # Maximum simultaneous tasks for this specialist.
    max_tasks: 1
# Timeouts and retry policy for failed DFT/lab work.
reliability:
  # Wall-clock seconds before a task is abandoned.
  task_timeout_secs: 120
  # Automatic retries before on_failure policy applies.
  max_retries: 1
  # Planner reaction when the specialist fails (e.g. replan).
  on_failure: replan
# Advertised capability ids for planners (may mirror skills).
capabilities:
# Manifest field '- id' for failure_correlation (validation).
- id: read_silicon_symptom
  # One-paragraph charter for planners and operators.
  description: Read the silicon symptom, board, and conditions.
# Manifest field '- id' for failure_correlation (validation).
- id: read_simulation_evidence
  # One-paragraph charter for planners and operators.
  description: Read simulation failures that share the symptom.
# Manifest field '- id' for failure_correlation (validation).
- id: read_formal_evidence
  # One-paragraph charter for planners and operators.
  description: Read formal counterexamples that share the symptom.
# Manifest field '- id' for failure_correlation (validation).
- id: read_signoff_evidence
  # One-paragraph charter for planners and operators.
  description: Read timing, power, and reliability results at the failing condition.
# Manifest field '- id' for failure_correlation (validation).
- id: read_firmware_evidence
  # One-paragraph charter for planners and operators.
  description: Read the firmware revision and diagnostic output.
# Manifest field '- id' for failure_correlation (validation).
- id: read_manufacturing_evidence
  # One-paragraph charter for planners and operators.
  description: Read lot, wafer, and test-program results.
# Manifest field '- id' for failure_correlation (validation).
- id: correlate_silicon_failure
  # One-paragraph charter for planners and operators.
  description: Link a silicon symptom to pre-silicon and manufacturing evidence.
# Manifest field '- id' for failure_correlation (validation).
- id: identify_earliest_abstraction
  # One-paragraph charter for planners and operators.
  description: Name the earliest model that reproduces the failure.
# Manifest field '- id' for failure_correlation (validation).
- id: rank_correlation_hypotheses
  # One-paragraph charter for planners and operators.
  description: Rank likely causes with the evidence for and against each.
# Manifest field '- id' for failure_correlation (validation).
- id: flag_uncorrelated_symptom
  # One-paragraph charter for planners and operators.
  description: Publish a symptom with no matching pre-silicon evidence.
# Manifest field '- id' for failure_correlation (validation).
- id: record_correlation_evidence
  # One-paragraph charter for planners and operators.
  description: Record every artifact the correlation used.
# Manifest field '- id' for failure_correlation (validation).
- id: publish_failure_correlation
  # One-paragraph charter for planners and operators.
  description: Publish the symptom, the earliest reproducing abstraction, and the evidence refs.
# Concrete tool bindings: module, callable, action, params.
skills:
# Manifest field '- id' for failure_correlation (validation).
- id: read_silicon_symptom
