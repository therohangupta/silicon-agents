  description: Read the silicon symptom, board, and conditions.
  # Default argument values when the LLM omits them.
  args_defaults:
    # Artifact URI of the RTL/netlist/physical candidate under test.
    candidate_ref: ''
    # Artifact URI of a DFT or lab report; empty means latest.
    report_ref: ''
    # PVT corner filter for report reads.
    corner: ''
    # Functional or test-mode filter for report reads.
    mode: ''
  # ToolAction enum semantic (create_workflow, read_reports, …).
  action: read_reports
  # Documented parameters the planner/LLM may fill.
  params:
  # Manifest field '- name' for failure_correlation (validation).
  - name: candidate_ref
    # One-paragraph charter for planners and operators.
    description: Candidate whose reports are read.
  # Manifest field '- name' for failure_correlation (validation).
  - name: report_ref
    # One-paragraph charter for planners and operators.
    description: Artifact URI of the report. Empty reads the latest report for this candidate.
  # Manifest field '- name' for failure_correlation (validation).
  - name: corner
    # One-paragraph charter for planners and operators.
