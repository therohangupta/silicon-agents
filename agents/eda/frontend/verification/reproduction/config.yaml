# AgentFleet config for ``reproduction`` — failing-seed/waveform minimization specialist.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``reproduction`` used across the verification plan graph.
  name: reproduction
  # Human-readable title shown in UIs and docs.
  display_name: Reproduction Agent
  # Responsibility brief for this verification specialist.
  description: Produce a minimal stable reproduction and a waveform slice for one failure cluster.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Produce a minimal stable reproduction and a waveform slice for one failure cluster.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for reproduction: Write a minimized test on an isolated branch
  - Write a minimized test on an isolated branch
  # Boundary rule for reproduction: Read the failing waveform
  - Read the failing waveform
  # Boundary rule for reproduction: Rerun the minimized test to confirm it still fails
  - Rerun the minimized test to confirm it still fails
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for reproduction: Edit RTL
  - Edit RTL
  # Boundary rule for reproduction: Declare the root cause fixed
  - Declare the root cause fixed
  # Boundary rule for reproduction: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for reproduction: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for reproduction: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8223 for the reproduction AgentService (must match Dockerfile EXPOSE).
  port: 8223
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``read_failing_waveform`` — must stay aligned with tools.py / plan references.
- id: read_failing_waveform
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Read the waveform for the seed that represents this cluster.
# Identifier ``minimize_failure`` — must stay aligned with tools.py / plan references.
- id: minimize_failure
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Reduce a failing test to a stable reproduction.
# Identifier ``slice_waveform`` — must stay aligned with tools.py / plan references.
- id: slice_waveform
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Extract the signals and time window that show the failure.
# Identifier ``write_reproduction_test`` — must stay aligned with tools.py / plan references.
- id: write_reproduction_test
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Write the minimized test on an isolated branch.
# Identifier ``confirm_reproduction_fails`` — must stay aligned with tools.py / plan references.
- id: confirm_reproduction_fails
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Rerun the minimized test and confirm it still fails.
# Identifier ``confirm_reproduction_stable`` — must stay aligned with tools.py / plan references.
- id: confirm_reproduction_stable
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Rerun the minimized test across the requested seeds and report which still fail.
# Identifier ``list_reproduction_signals`` — must stay aligned with tools.py / plan references.
- id: list_reproduction_signals
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: List the signals required to see the failure.
# Identifier ``diff_reproduction_against_original`` — must stay aligned with tools.py / plan references.
- id: diff_reproduction_against_original
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Show what the minimization removed.
# Identifier ``flag_unstable_reproduction`` — must stay aligned with tools.py / plan references.
- id: flag_unstable_reproduction
  # YAML key ``description`` for the reproduction agent (failing-seed/waveform minimization specialist).
  description: Publish a minimized test that does not fail reliably.
# Identifier ``flag_reproduction_changed_symptom`` — must stay aligned with tools.py / plan references.
- id: flag_reproduction_changed_symptom
