# AgentFleet config for ``stimulus`` — directed and constrained-random stimulus author for coverage holes.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``stimulus`` used across the verification plan graph.
  name: stimulus
  # Human-readable title shown in UIs and docs.
  display_name: Stimulus Agent
  # Responsibility brief for this verification specialist.
  description: Create directed tests and constrained-random sequences aimed at coverage holes.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Create directed tests and constrained-random sequences aimed at coverage holes.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for stimulus: Write tests on an isolated branch
  - Write tests on an isolated branch
  # Boundary rule for stimulus: Read coverage holes
  - Read coverage holes
  # Boundary rule for stimulus: Compile the tests
  - Compile the tests
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for stimulus: Edit RTL
  - Edit RTL
  # Boundary rule for stimulus: Constrain a test so it avoids a known failure
  - Constrain a test so it avoids a known failure
  # Boundary rule for stimulus: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for stimulus: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for stimulus: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8219 for the stimulus AgentService (must match Dockerfile EXPOSE).
  port: 8219
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``create_directed_tests`` — must stay aligned with tools.py / plan references.
- id: create_directed_tests
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Write directed tests for specific coverage holes.
# Identifier ``create_constrained_random_sequences`` — must stay aligned with tools.py / plan references.
- id: create_constrained_random_sequences
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Write constrained-random sequences from the interface contract.
# Identifier ``create_coverage_directed_sequence`` — must stay aligned with tools.py / plan references.
- id: create_coverage_directed_sequence
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Write a sequence whose constraints target one uncovered bin.
# Identifier ``write_seed_list`` — must stay aligned with tools.py / plan references.
- id: write_seed_list
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Write the seed list for this stimulus set. Do not drop a seed that previously failed.
# Identifier ``write_stimulus_constraints`` — must stay aligned with tools.py / plan references.
- id: write_stimulus_constraints
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Write legal constraints taken from the interface contract.
# Identifier ``read_coverage_holes`` — must stay aligned with tools.py / plan references.
- id: read_coverage_holes
