# Identifier ``read_stimulus_contract`` — must stay aligned with tools.py / plan references.
- id: read_stimulus_contract
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Read the interface constraints stimulus must obey.
# Identifier ``compile_stimulus`` — must stay aligned with tools.py / plan references.
- id: compile_stimulus
  # YAML key ``description`` for the stimulus agent (directed and constrained-random stimulus author for coverage holes).
  description: Compile the new tests against the UVM environment.
# Identifier ``lint_stimulus_constraints`` — must stay aligned with tools.py / plan references.
- id: lint_stimulus_constraints
