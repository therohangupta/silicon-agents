  description: Open stimulus work aimed at the listed coverage holes.
# Identifier ``request_regression_campaign`` — must stay aligned with tools.py / plan references.
- id: request_regression_campaign
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Open a regression for the current test manifest.
# Identifier ``request_failure_reproduction`` — must stay aligned with tools.py / plan references.
- id: request_failure_reproduction
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Open minimization for one failure cluster.
# Identifier ``request_independent_verification_gate`` — must stay aligned with tools.py / plan references.
- id: request_independent_verification_gate
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Hand the pinned candidate to the verification validator.
# Identifier ``read_verification_contract`` — must stay aligned with tools.py / plan references.
- id: read_verification_contract
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Read the requirements, exclusions, and required checks for this candidate.
# Identifier ``read_coverage_summary`` — must stay aligned with tools.py / plan references.
- id: read_coverage_summary
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Read code, functional, and assertion coverage for the current regression.
# Identifier ``read_failure_clusters`` — must stay aligned with tools.py / plan references.
- id: read_failure_clusters
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Read clustered failures and their likely owners.
# Identifier ``read_regression_status`` — must stay aligned with tools.py / plan references.
- id: read_regression_status
