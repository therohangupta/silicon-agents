# AgentFleet config for ``verification_lead`` — lead that owns verification closure for one pinned RTL revision.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``verification_lead`` used across the verification plan graph.
  name: verification_lead
  # Human-readable title shown in UIs and docs.
  display_name: Verification Lead
  # Responsibility brief for this verification specialist.
  description: Own the verification plan and closure workflow for one pinned RTL revision. Do not personally
    write every test or inspect every waveform.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: lead
# Fleet role enum used for privilege and delegation policy.
role: lead
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Own the verification plan and closure workflow for one pinned RTL revision. Do not personally
  write every test or inspect every waveform.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for verification_lead: Read the specification, RTL candidate, and prior findings
  - Read the specification, RTL candidate, and prior findings
  # Boundary rule for verification_lead: Publish a verification workflow and coverage-closure tasks
  - Publish a verification workflow and coverage-closure tasks
  # Boundary rule for verification_lead: Return UPSTREAM_CHANGE_REQUIRED when behavior is ambiguous
  - Return UPSTREAM_CHANGE_REQUIRED when behavior is ambiguous
  # Boundary rule for verification_lead: Request a human decision for an exclusion or waiver
  - Request a human decision for an exclusion or waiver
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for verification_lead: Modify canonical RTL
  - Modify canonical RTL
  # Boundary rule for verification_lead: Waive a requirement
  - Waive a requirement
  # Boundary rule for verification_lead: Grade its own closure
  - Grade its own closure
  # Boundary rule for verification_lead: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for verification_lead: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for verification_lead: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to:
# delegates_to entry ``uvm_environment`` for verification_lead.
- uvm_environment
# delegates_to entry ``reference_model`` for verification_lead.
- reference_model
# delegates_to entry ``assertion_formal`` for verification_lead.
- assertion_formal
# delegates_to entry ``stimulus`` for verification_lead.
- stimulus
# delegates_to entry ``regression`` for verification_lead.
- regression
# delegates_to entry ``coverage`` for verification_lead.
- coverage
# delegates_to entry ``failure_triage`` for verification_lead.
- failure_triage
# delegates_to entry ``reproduction`` for verification_lead.
- reproduction
# delegates_to entry ``verification_validator`` for verification_lead.
- verification_validator
# Independent graders that must pass before promotion/signoff.
validators:
# validators entry ``verification_validator`` for verification_lead.
- verification_validator
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8215 for the verification_lead AgentService (must match Dockerfile EXPOSE).
  port: 8215
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``build_verification_plan`` — must stay aligned with tools.py / plan references.
- id: build_verification_plan
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Emit the closure workflow for this RTL revision.
# Identifier ``request_uvm_environment`` — must stay aligned with tools.py / plan references.
- id: request_uvm_environment
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Open a task to build or update the UVM environment.
# Identifier ``request_reference_model`` — must stay aligned with tools.py / plan references.
- id: request_reference_model
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Open a task to build the behavioral reference model.
# Identifier ``request_formal_campaign`` — must stay aligned with tools.py / plan references.
- id: request_formal_campaign
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Open a formal proof task for the named properties.
# Identifier ``request_stimulus_for_holes`` — must stay aligned with tools.py / plan references.
- id: request_stimulus_for_holes
