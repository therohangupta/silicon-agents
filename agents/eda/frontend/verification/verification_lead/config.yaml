  description: Read pass, fail, and infrastructure-error counts for the campaign.
# Identifier ``publish_coverage_closure_gap`` — must stay aligned with tools.py / plan references.
- id: publish_coverage_closure_gap
  # YAML key ``description`` for the verification_lead agent (lead that owns verification closure for one pinned RTL revision).
  description: Publish holes that the current strategy has not closed.
# Identifier ``escalate_spec_ambiguity`` — must stay aligned with tools.py / plan references.
- id: escalate_spec_ambiguity
