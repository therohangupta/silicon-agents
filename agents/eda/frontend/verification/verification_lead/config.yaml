# Which engineering-memory slices are included in the LLM context window.
context:
  # Memory categories to include (gates, findings, decisions, …).
  include:
  # include entry ``gates`` for verification_lead.
  - gates
  # include entry ``workflows`` for verification_lead.
  - workflows
  # include entry ``open_findings`` for verification_lead.
  - open_findings
  # include entry ``decisions`` for verification_lead.
  - decisions
  # include entry ``experiments`` for verification_lead.
  - experiments
  # Categories to omit from context packing.
  exclude:
  # exclude entry ``stale_candidates`` for verification_lead.
  - stale_candidates
  # Statuses to drop (e.g. rejected candidates).
  drop:
  # drop entry ``rejected`` for verification_lead.
  - rejected
  # Priority order when packing conflicting memory items.
  precedence:
  # precedence entry ``human-authored`` for verification_lead.
  - human-authored
  # precedence entry ``validated`` for verification_lead.
  - validated
  # precedence entry ``provisional`` for verification_lead.
  - provisional
  # Items that must not be dropped under token pressure.
  protect:
  # protect entry ``human-authored`` for verification_lead.
  - human-authored
  # Max tokens for packed verification context.
  token_budget: 80000
