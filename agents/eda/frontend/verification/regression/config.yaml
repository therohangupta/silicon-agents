# AgentFleet config for ``regression`` — regression manifest, sharding, and simulator-farm submission specialist.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``regression`` used across the verification plan graph.
  name: regression
  # Human-readable title shown in UIs and docs.
  display_name: Regression Agent
  # Responsibility brief for this verification specialist.
  description: Select seeds, shard the workload, and run a reproducible regression.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Select seeds, shard the workload, and run a reproducible regression.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for regression: Write a test manifest
  - Write a test manifest
  # Boundary rule for regression: Submit a regression job
  - Submit a regression job
  # Boundary rule for regression: Read results including failing seeds
  - Read results including failing seeds
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for regression: Drop a failing seed from the manifest
  - Drop a failing seed from the manifest
  # Boundary rule for regression: Edit RTL
  - Edit RTL
  # Boundary rule for regression: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for regression: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for regression: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8221 for the regression AgentService (must match Dockerfile EXPOSE).
  port: 8221
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``read_prior_failures`` — must stay aligned with tools.py / plan references.
- id: read_prior_failures
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Read seeds and tests that failed in the previous campaign.
# Identifier ``read_uncovered_bins`` — must stay aligned with tools.py / plan references.
- id: read_uncovered_bins
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Read bins that still need stimulus.
# Identifier ``choose_regression_seeds`` — must stay aligned with tools.py / plan references.
- id: choose_regression_seeds
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Choose seeds from prior failures and uncovered bins. Keep every seed that previously failed.
# Identifier ``write_regression_manifest`` — must stay aligned with tools.py / plan references.
- id: write_regression_manifest
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Write the test, seed, and plusarg manifest for this campaign.
# Identifier ``shard_regression`` — must stay aligned with tools.py / plan references.
- id: shard_regression
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Split the manifest into shards with stable shard ids.
# Identifier ``submit_regression`` — must stay aligned with tools.py / plan references.
- id: submit_regression
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Submit the regression manifest to the bound simulator.
# Identifier ``rerun_failed_shard`` — must stay aligned with tools.py / plan references.
- id: rerun_failed_shard
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Rerun one failed shard with the same idempotency key.
# Identifier ``read_regression_results`` — must stay aligned with tools.py / plan references.
- id: read_regression_results
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: Read pass, fail, and infrastructure-error counts.
# Identifier ``read_failing_seeds`` — must stay aligned with tools.py / plan references.
- id: read_failing_seeds
  # YAML key ``description`` for the regression agent (regression manifest, sharding, and simulator-farm submission specialist).
  description: List failing tests and seeds. Do not omit any.
# Identifier ``compare_regression_to_baseline`` — must stay aligned with tools.py / plan references.
- id: compare_regression_to_baseline
