# Local memory store configuration for this agent process.
memory:
  # Named stores the agent may read/write through the memory API.
  stores:
  # Identifier `journal` under `stores` for `power_area_estimation`.
  - id: journal
    # One-line charter of what this agent owns in the chip flow.
    description: Local cache of task journal keys. Shared engineering memory is the silicon store.
    # Memory store type `list`.
    type: list
    # file means journal keys are cached on local disk.
    persistence: file
    # Store-specific configuration block.
    config:
      # Local journal cache root; override with SILICON_MEMORY_ROOT.
      path: ${SILICON_MEMORY_ROOT:-/tmp/silicon_memory}
# Heartbeat and telemetry wiring for fleet dashboards.
observability:
  # Seconds between liveness heartbeats to telemetry.
  heartbeat_interval_secs: 5
  # Where structured skill and artifact events are shipped.
  telemetry:
    # Telemetry base URL; override with TELEMETRY_URL.
    endpoint: ${TELEMETRY_URL}
    # Named event streams this agent emits.
    streams:
    # Stable agent id used in routing, telemetry, and delegate targets.
    - name: skill_calls
      # One-line charter of what this agent owns in the chip flow.
      description: Tool invocations.
    # Stable agent id used in routing, telemetry, and delegate targets.
    - name: artifacts
      # One-line charter of what this agent owns in the chip flow.
      description: Structured task results.
# Container image metadata used by compose generation.
deployment:
  # Container image tag built from this agent's Dockerfile.
  image: agentfleet/power_area_estimation:1.0
  # Dockerfile path relative to this agent directory.
  dockerfile: Dockerfile
  # Environment variables injected at container start.
  environment:
    # Empty keeps adapters unbound; set to enable real tool execution.
    EDA_FRAMEWORK: ${EDA_FRAMEWORK:-}
# Policy for which shared-memory records enter the LLM context window.
context:
  # Record kinds always considered for context assembly.
  include:
  # Context include kind: human_intent (pulled into LLM context when present).
  - human_intent
  # Context include kind: requirements (pulled into LLM context when present).
  - requirements
  # Context include kind: interface_contracts (pulled into LLM context when present).
  - interface_contracts
  # Context include kind: decisions (pulled into LLM context when present).
  - decisions
  # Context include kind: open_findings (pulled into LLM context when present).
  - open_findings
  # Record kinds never considered even if present.
  exclude:
  # Context exclude kind: stale_candidates (never assembled into prompts).
  - stale_candidates
  # States removed before ranking (e.g. rejected).
  drop:
  # Drop memory state before ranking: rejected.
  - rejected
  # Preferred record states first when trimming to token_budget.
  precedence:
  # Prefer memory state `human-authored` when trimming to token_budget.
  - human-authored
  # Prefer memory state `validated` when trimming to token_budget.
  - validated
  # Prefer memory state `provisional` when trimming to token_budget.
  - provisional
  # States kept even when over budget (usually human-authored).
  protect:
  # Never drop memory state `human-authored` even when over budget.
  - human-authored
  # Approximate max tokens of assembled context (80000).
  token_budget: 80000
