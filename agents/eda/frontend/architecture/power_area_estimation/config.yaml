- id: compare_estimate_to_budget
  # One-line charter of what this agent owns in the chip flow.
  description: Compare an estimate with the block power and area budgets.
# Identifier `record_assumptions` under `capabilities` for `power_area_estimation`.
- id: record_assumptions
  # One-line charter of what this agent owns in the chip flow.
  description: Publish the assumptions behind an estimate so a later stage can reject a stale one.
# Identifier `flag_budget_risk` under `capabilities` for `power_area_estimation`.
- id: flag_budget_risk
  # One-line charter of what this agent owns in the chip flow.
  description: Publish an estimate that crosses a budget inside its uncertainty band.
# Identifier `flag_stale_estimate` under `capabilities` for `power_area_estimation`.
- id: flag_stale_estimate
  # One-line charter of what this agent owns in the chip flow.
  description: Publish an estimate whose architecture revision is no longer current.
# Identifier `record_estimate_lineage` under `capabilities` for `power_area_estimation`.
- id: record_estimate_lineage
  # One-line charter of what this agent owns in the chip flow.
  description: Record the model, activity file, and library used for an estimate.
# Binding of capability ids to Python callables and action kinds.
skills:
# Identifier `collect_estimation_inputs` under `skills` for `power_area_estimation`.
- id: collect_estimation_inputs
  # Module path exporting the skill callable (always `tools` here).
  module: tools
  # Python function in tools.py implementing this skill.
  callable: collect_estimation_inputs
  # One-line charter of what this agent owns in the chip flow.
  description: Read area models, activity, library, and utilization assumptions.
  # Default argument values when the planner omits them.
  args_defaults:
    # Artifact URI of the isolated design candidate this skill reads or edits; empty often means create-from-baseline.
    candidate_ref: ''
    # Artifact URI of a prior report. Empty reads the latest report for this candidate.
    report_ref: ''
    # PVT corner (process/voltage/temperature). Empty when the job is not corner-specific.
    corner: ''
    # direct_function calls Python tools in-process rather than shelling out.
    mode: ''
  # Reads structured report artifacts without mutating the candidate.
  action: read_reports
  # Documented parameter list for UI and schema generation.
  params:
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: candidate_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Candidate whose reports are read.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: report_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Artifact URI of the report. Empty reads the latest report for this candidate.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: corner
    # One-line charter of what this agent owns in the chip flow.
    description: Corner filter. Empty reads every available corner.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: mode
    # One-line charter of what this agent owns in the chip flow.
    description: Mode filter. Empty reads every available mode.
# Identifier `write_estimation_assumptions` under `skills` for `power_area_estimation`.
- id: write_estimation_assumptions
  # Module path exporting the skill callable (always `tools` here).
  module: tools
  # Python function in tools.py implementing this skill.
  callable: write_estimation_assumptions
  # One-line charter of what this agent owns in the chip flow.
  description: Write the activity, library, and utilization assumptions for one estimate.
  # Default argument values when the planner omits them.
  args_defaults:
