# Agent specification for Power/Area Estimation Agent (`power_area_estimation`).
# Stage: architecture. Role: worker. HTTP port: 8206.
# Pre-RTL power and area estimates set block budgets with explicit uncertainty. Stale estimates are flagged when inputs change so physical design does not inherit outdated PPA numbers.
# Every key below is loaded by EDAAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `power_area_estimation` used in routing and telemetry.
  name: power_area_estimation
  # Dashboard title for `power_area_estimation`.
  display_name: Power/Area Estimation Agent
  # Charter shown to planners and operators.
  description: Produce early power and area estimates with explicit uncertainty and assumptions.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `architecture` for planner routing.
    stage: architecture
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `architecture` for planner routing.
stage: architecture
# Charter repeated at the top level for validators and planners.
responsibility: Produce early power and area estimates with explicit uncertainty and assumptions.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read architecture budgets and activity assumptions
  - Read architecture budgets and activity assumptions
  # Allowed action: Publish an estimate with its uncertainty
  - Publish an estimate with its uncertainty
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Treat an early estimate as signoff power
  - Treat an early estimate as signoff power
  # Forbidden action: Hide the activity assumption
  - Hide the activity assumption
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8206).
  port: 8206
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `collect_estimation_inputs` under `capabilities` for `power_area_estimation`.
- id: collect_estimation_inputs
  # One-line charter of what this agent owns in the chip flow.
  description: Read area models, activity, library, and utilization assumptions.
# Identifier `write_estimation_assumptions` under `capabilities` for `power_area_estimation`.
- id: write_estimation_assumptions
  # One-line charter of what this agent owns in the chip flow.
  description: Write the activity, library, and utilization assumptions for one estimate.
# Identifier `estimate_area` under `capabilities` for `power_area_estimation`.
- id: estimate_area
  # One-line charter of what this agent owns in the chip flow.
  description: Produce an early area estimate and its uncertainty.
# Identifier `estimate_power` under `capabilities` for `power_area_estimation`.
- id: estimate_power
  # One-line charter of what this agent owns in the chip flow.
  description: Produce an early dynamic and leakage estimate and its uncertainty.
# Identifier `estimate_ppa` under `capabilities` for `power_area_estimation`.
- id: estimate_ppa
  # One-line charter of what this agent owns in the chip flow.
  description: Produce a combined power, performance, and area estimate.
# Identifier `sweep_utilization` under `capabilities` for `power_area_estimation`.
- id: sweep_utilization
  # One-line charter of what this agent owns in the chip flow.
  description: Rerun the estimate across a utilization range.
# Identifier `read_estimate` under `capabilities` for `power_area_estimation`.
- id: read_estimate
  # One-line charter of what this agent owns in the chip flow.
  description: Read one stored early estimate and its assumptions.
