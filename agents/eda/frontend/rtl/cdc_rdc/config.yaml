# Agent specification for CDC/RDC Agent (`cdc_rdc`).
# Stage: rtl. Role: worker. HTTP port: 8211.
# Clock-domain crossing (CDC) and reset-domain crossing (RDC) analysis sits between RTL implementation and verification. Metastability and reset release hazards are structural bugs that simulation may miss; this agent surfaces crossings, synchronizers, and waiver proposals.
# Every key below is loaded by EDAAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `cdc_rdc` used in routing and telemetry.
  name: cdc_rdc
  # Dashboard title for `cdc_rdc`.
  display_name: CDC/RDC Agent
  # Charter shown to planners and operators.
  description: Analyze clock and reset domain crossings and return evidence for a fix or a human waiver.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `rtl` for planner routing.
    stage: rtl
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `rtl` for planner routing.
stage: rtl
# Charter repeated at the top level for validators and planners.
responsibility: Analyze clock and reset domain crossings and return evidence for a fix or a human waiver.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read RTL and clock intent
  - Read RTL and clock intent
  # Allowed action: Propose a synchronizer or an unsigned waiver record
  - Propose a synchronizer or an unsigned waiver record
  # Allowed action: Edit a synchronizer on an isolated candidate
  - Edit a synchronizer on an isolated candidate
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Approve the waiver
  - Approve the waiver
  # Forbidden action: Delete a crossing from the report
  - Delete a crossing from the report
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8211).
  port: 8211
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `analyze_cdc` under `capabilities` for `cdc_rdc`.
- id: analyze_cdc
  # One-line charter of what this agent owns in the chip flow.
  description: List clock-domain crossings and their synchronizers.
# Identifier `analyze_rdc` under `capabilities` for `cdc_rdc`.
- id: analyze_rdc
  # One-line charter of what this agent owns in the chip flow.
  description: List reset-domain crossings.
# Identifier `read_cdc_report` under `capabilities` for `cdc_rdc`.
- id: read_cdc_report
  # One-line charter of what this agent owns in the chip flow.
  description: Read a CDC report and its waiver candidates.
# Identifier `read_rdc_report` under `capabilities` for `cdc_rdc`.
- id: read_rdc_report
  # One-line charter of what this agent owns in the chip flow.
  description: Read an RDC report.
# Identifier `classify_crossing` under `capabilities` for `cdc_rdc`.
- id: classify_crossing
  # One-line charter of what this agent owns in the chip flow.
  description: Classify one crossing as synchronized, unsynchronized, or waived-pending.
# Identifier `trace_crossing_path` under `capabilities` for `cdc_rdc`.
- id: trace_crossing_path
  # One-line charter of what this agent owns in the chip flow.
  description: Trace the source and destination registers of one crossing.
