- id: check_reconvergence
  # One-line charter of what this agent owns in the chip flow.
  description: Check reconvergent crossings that a single synchronizer does not cover.
# Identifier `propose_waiver_or_fix` under `capabilities` for `cdc_rdc`.
- id: propose_waiver_or_fix
  # One-line charter of what this agent owns in the chip flow.
  description: Publish either a bounded RTL fix or an unsigned waiver proposal.
# Identifier `flag_unsynchronized_crossing` under `capabilities` for `cdc_rdc`.
- id: flag_unsynchronized_crossing
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a crossing that has no synchronizer and no waiver proposal.
