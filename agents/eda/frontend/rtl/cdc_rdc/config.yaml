  - name: baseline_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Baseline used when the job compares against a known result.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: recipe
    # One-line charter of what this agent owns in the chip flow.
    description: Versioned tool recipe. The adapter rejects an unknown recipe.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: corner
    # One-line charter of what this agent owns in the chip flow.
    description: PVT corner. Empty when the job is not corner-specific.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: mode
    # One-line charter of what this agent owns in the chip flow.
    description: Functional or analysis mode. Empty when the job is not mode-specific.
