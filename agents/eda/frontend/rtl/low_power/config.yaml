- id: flag_missing_power_isolation
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a domain crossing with no isolation.
# Identifier `flag_upf_rtl_mismatch` under `capabilities` for `low_power`.
- id: flag_upf_rtl_mismatch
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a module whose UPF domain and RTL hierarchy disagree.
