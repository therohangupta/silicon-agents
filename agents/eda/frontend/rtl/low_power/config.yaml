  description: Add a level shifter on one domain crossing in the candidate.
# Identifier `run_upf_lint` under `capabilities` for `low_power`.
- id: run_upf_lint
  # One-line charter of what this agent owns in the chip flow.
  description: Run UPF consistency checks.
