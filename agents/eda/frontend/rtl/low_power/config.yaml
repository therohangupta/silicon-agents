# Agent specification for Low-Power Agent (`low_power`).
# Stage: rtl. Role: worker. HTTP port: 8212.
# Unified Power Format (UPF) describes power domains, isolation, retention, and level shifters. This agent keeps UPF and RTL consistent so low-power intent survives into backend power analysis.
# Every key below is loaded by EDAAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `low_power` used in routing and telemetry.
  name: low_power
  # Dashboard title for `low_power`.
  display_name: Low-Power Agent
  # Charter shown to planners and operators.
  description: Maintain power domains, isolation, retention, and UPF consistency.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `rtl` for planner routing.
    stage: rtl
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `rtl` for planner routing.
stage: rtl
# Charter repeated at the top level for validators and planners.
responsibility: Maintain power domains, isolation, retention, and UPF consistency.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read UPF and RTL
  - Read UPF and RTL
  # Allowed action: Edit UPF on an isolated candidate
  - Edit UPF on an isolated candidate
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Drop an isolation cell to save area
  - Drop an isolation cell to save area
  # Forbidden action: Change a power domain without a finding
  - Change a power domain without a finding
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8212).
  port: 8212
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `read_upf` under `capabilities` for `low_power`.
- id: read_upf
  # One-line charter of what this agent owns in the chip flow.
  description: Read power domains, supply nets, and isolation strategies.
# Identifier `check_upf_consistency` under `capabilities` for `low_power`.
- id: check_upf_consistency
  # One-line charter of what this agent owns in the chip flow.
  description: Compare UPF domains and RTL hierarchy.
# Identifier `check_isolation_retention` under `capabilities` for `low_power`.
- id: check_isolation_retention
  # One-line charter of what this agent owns in the chip flow.
  description: Check isolation, retention, and level-shifter strategy.
# Identifier `list_power_domains` under `capabilities` for `low_power`.
- id: list_power_domains
  # One-line charter of what this agent owns in the chip flow.
  description: List domains, their supplies, and the modules inside them.
# Identifier `list_domain_crossings` under `capabilities` for `low_power`.
- id: list_domain_crossings
  # One-line charter of what this agent owns in the chip flow.
  description: List signals that cross power domains.
# Identifier `check_retention_registers` under `capabilities` for `low_power`.
- id: check_retention_registers
  # One-line charter of what this agent owns in the chip flow.
  description: Check which registers require retention and which cells implement it.
# Identifier `write_isolation_strategy` under `capabilities` for `low_power`.
- id: write_isolation_strategy
  # One-line charter of what this agent owns in the chip flow.
  description: Add a missing isolation strategy on an isolated UPF candidate.
