skills:
# Identifier `read_upf` under `skills` for `low_power`.
- id: read_upf
  # Module path exporting the skill callable (always `tools` here).
  module: tools
  # Python function in tools.py implementing this skill.
  callable: read_upf
  # One-line charter of what this agent owns in the chip flow.
  description: Read power domains, supply nets, and isolation strategies.
  # Default argument values when the planner omits them.
  args_defaults:
    # Artifact URI of the isolated design candidate this skill reads or edits; empty often means create-from-baseline.
    candidate_ref: ''
    # Artifact URI of a prior report. Empty reads the latest report for this candidate.
    report_ref: ''
    # PVT corner (process/voltage/temperature). Empty when the job is not corner-specific.
    corner: ''
    # direct_function calls Python tools in-process rather than shelling out.
    mode: ''
  # Reads structured report artifacts without mutating the candidate.
  action: read_reports
  # Documented parameter list for UI and schema generation.
  params:
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: candidate_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Candidate whose reports are read.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: report_ref
    # One-line charter of what this agent owns in the chip flow.
    description: Artifact URI of the report. Empty reads the latest report for this candidate.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: corner
    # One-line charter of what this agent owns in the chip flow.
    description: Corner filter. Empty reads every available corner.
  # Stable agent id used in routing, telemetry, and delegate targets.
  - name: mode
    # One-line charter of what this agent owns in the chip flow.
    description: Mode filter. Empty reads every available mode.
