    # Immutable baseline revision the candidate must descend from so lineage stays auditable.
    baseline_ref: ''
    # Versioned EDA-tool recipe name; the framework adapter rejects unknown recipes.
    recipe: ''
    # PVT corner (process/voltage/temperature). Empty when the job is not corner-specific.
    corner: ''
    # direct_function calls Python tools in-process rather than shelling out.
    mode: ''
  # Queues an EDA tool job through the bound adapter (stubbed as not_run until bound).
