# Agent specification for Clock/Reset Agent (`clock_reset`).
# Stage: rtl. Role: worker. HTTP port: 8210.
# Clock and reset intent defines domains, gating, and synchronizer topology before physical CTS. This agent checks RTL against declared clocking so ungated muxes and broken reset trees are caught early.
# Every key below is loaded by EDAAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `clock_reset` used in routing and telemetry.
  name: clock_reset
  # Dashboard title for `clock_reset`.
  display_name: Clock/Reset Agent
  # Charter shown to planners and operators.
  description: Check clocking, reset topology, and clock gating against the declared intent.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `rtl` for planner routing.
    stage: rtl
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `rtl` for planner routing.
stage: rtl
# Charter repeated at the top level for validators and planners.
responsibility: Check clocking, reset topology, and clock gating against the declared intent.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read RTL and clock intent
  - Read RTL and clock intent
  # Allowed action: Publish a clock or reset finding
  - Publish a clock or reset finding
  # Allowed action: Edit clock or reset RTL only on an isolated candidate when the task asks for a fix
  - Edit clock or reset RTL only on an isolated candidate when the task asks for a fix
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Rewrite the clock architecture
  - Rewrite the clock architecture
  # Forbidden action: Add a waiver
  - Add a waiver
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8210).
  port: 8210
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `read_clock_intent` under `capabilities` for `clock_reset`.
- id: read_clock_intent
  # One-line charter of what this agent owns in the chip flow.
  description: Read declared clocks, generated clocks, and gating intent.
# Identifier `analyze_clock_intent` under `capabilities` for `clock_reset`.
- id: analyze_clock_intent
  # One-line charter of what this agent owns in the chip flow.
  description: Check clocks, generated clocks, and gating against the intent.
# Identifier `list_clock_domains` under `capabilities` for `clock_reset`.
- id: list_clock_domains
  # One-line charter of what this agent owns in the chip flow.
  description: List clock domains and the registers in each.
# Identifier `list_generated_clocks` under `capabilities` for `clock_reset`.
- id: list_generated_clocks
  # One-line charter of what this agent owns in the chip flow.
  description: List generated and gated clocks and their sources.
# Identifier `analyze_reset_topology` under `capabilities` for `clock_reset`.
- id: analyze_reset_topology
  # One-line charter of what this agent owns in the chip flow.
  description: Check reset synchronizers, tree shape, and deassertion.
# Identifier `list_reset_domains` under `capabilities` for `clock_reset`.
- id: list_reset_domains
  # One-line charter of what this agent owns in the chip flow.
  description: List reset domains and asynchronous-reset registers.
