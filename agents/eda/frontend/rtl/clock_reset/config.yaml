- id: flag_ungated_clock_mux
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a clock mux or gate that does not match the intent.
# Identifier `flag_reset_tree_issue` under `capabilities` for `clock_reset`.
- id: flag_reset_tree_issue
  # One-line charter of what this agent owns in the chip flow.
  description: Publish a reset that is asynchronous, missing, or reconvergent.
