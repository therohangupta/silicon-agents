# Agent specification for RTL Lead (`rtl_lead`).
# Stage: rtl. Role: lead. HTTP port: 8208.
# The RTL lead plans block implementation, opens qualification and edit tasks, and hands candidates to verification. It coordinates workers without promoting baselines itself.
# Every key below is loaded by EdaAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `rtl_lead` used in routing and telemetry.
  name: rtl_lead
  # Dashboard title for `rtl_lead`.
  display_name: RTL Lead
  # Charter shown to planners and operators.
  description: Plan implementation of one block and coordinate lint, clock, CDC, low-power, and integration checks.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `rtl` for planner routing.
    stage: rtl
    # Agent role `lead` (lead vs worker) controlling delegation rights.
    role: lead
# Agent role `lead` (lead vs worker) controlling delegation rights.
role: lead
# Lifecycle stage `rtl` for planner routing.
stage: rtl
# Charter repeated at the top level for validators and planners.
responsibility: Plan implementation of one block and coordinate lint, clock, CDC, low-power, and integration checks.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read the block specification and architecture budgets
  - Read the block specification and architecture budgets
  # Allowed action: Publish an implementation workflow for this block
  - Publish an implementation workflow for this block
  # Allowed action: Send a finding back to architecture when the spec cannot be implemented
  - Send a finding back to architecture when the spec cannot be implemented
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Edit the canonical RTL directly
  - Edit the canonical RTL directly
  # Forbidden action: Skip lint or CDC because a candidate simulates
  - Skip lint or CDC because a candidate simulates
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to:
# Worker agent id this lead may schedule: rtl_implementation
- rtl_implementation
# Worker agent id this lead may schedule: clock_reset
- clock_reset
# Worker agent id this lead may schedule: cdc_rdc
- cdc_rdc
# Worker agent id this lead may schedule: low_power
- low_power
# Worker agent id this lead may schedule: lint_quality
- lint_quality
# Worker agent id this lead may schedule: rtl_integration
- rtl_integration
# Optional gate agents that must approve before promotion.
validators:
# Validator agent id: verification_validator
- verification_validator
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8208).
  port: 8208
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `plan_block_implementation` under `capabilities` for `rtl_lead`.
- id: plan_block_implementation
  # One-line charter of what this agent owns in the chip flow.
  description: Emit the block workflow from spec through qualification.
# Identifier `request_block_qualification` under `capabilities` for `rtl_lead`.
- id: request_block_qualification
  # One-line charter of what this agent owns in the chip flow.
  description: Ask lint, clock, CDC, low-power, and integration checks to grade the current candidate.
# Identifier `request_rtl_edit` under `capabilities` for `rtl_lead`.
- id: request_rtl_edit
  # One-line charter of what this agent owns in the chip flow.
  description: Open one bounded RTL-edit task with a single hypothesis.
# Identifier `request_integration` under `capabilities` for `rtl_lead`.
- id: request_integration
  # One-line charter of what this agent owns in the chip flow.
  description: Open a merge of block candidates that have passed their local checks.
# Identifier `read_block_spec` under `capabilities` for `rtl_lead`.
- id: read_block_spec
  # One-line charter of what this agent owns in the chip flow.
  description: Read the qualified specification and interface contracts for this block.
