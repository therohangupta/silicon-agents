  description: Publish a required lint, CDC, clock, or low-power check that has not run.
# Identifier `record_block_handoff` under `capabilities` for `rtl_lead`.
- id: record_block_handoff
  # One-line charter of what this agent owns in the chip flow.
  description: Record the candidate ref, checks, and open findings included in a handoff.
