- id: request_verification_handoff
  # One-line charter of what this agent owns in the chip flow.
  description: Open the verification workflow for a candidate that has passed basic compile and lint readiness.
# Identifier `delegate_tasks` under `capabilities` for `rtl_lead`.
- id: delegate_tasks
  # One-line charter of what this agent owns in the chip flow.
  description: Propose a dependency graph for the agents in this scope. Do not execute their tools.
