# Agent specification for RTL Integration Agent (`rtl_integration`).
# Stage: rtl. Role: worker. HTTP port: 8214.
# Block-level candidates that passed local lint/CDC/clock/low-power checks are merged here. Integration marks stale downstream verification results so the fleet does not trust outdated evidence.
# Every key below is loaded by EdaAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `rtl_integration` used in routing and telemetry.
  name: rtl_integration
  # Dashboard title for `rtl_integration`.
  display_name: RTL Integration Agent
  # Charter shown to planners and operators.
  description: Merge compatible block candidates and mark stale downstream results.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `rtl` for planner routing.
    stage: rtl
    # Agent role `worker` (lead vs worker) controlling delegation rights.
    role: worker
# Agent role `worker` (lead vs worker) controlling delegation rights.
role: worker
# Lifecycle stage `rtl` for planner routing.
stage: rtl
# Charter repeated at the top level for validators and planners.
responsibility: Merge compatible block candidates and mark stale downstream results.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read qualified block candidates
  - Read qualified block candidates
  # Allowed action: Write an integration candidate
  - Write an integration candidate
  # Allowed action: Mark downstream artifacts stale
  - Mark downstream artifacts stale
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Merge a candidate that failed its block gate
  - Merge a candidate that failed its block gate
  # Forbidden action: Overwrite a newer baseline silently
  - Overwrite a newer baseline silently
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to: []
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8214).
  port: 8214
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `list_mergeable_candidates` under `capabilities` for `rtl_integration`.
- id: list_mergeable_candidates
  # One-line charter of what this agent owns in the chip flow.
  description: List block candidates whose local gates passed and whose baselines match.
# Identifier `read_candidate_gate` under `capabilities` for `rtl_integration`.
- id: read_candidate_gate
  # One-line charter of what this agent owns in the chip flow.
  description: Read the local gate result for one block candidate.
# Identifier `diff_candidates` under `capabilities` for `rtl_integration`.
- id: diff_candidates
  # One-line charter of what this agent owns in the chip flow.
  description: Show file overlap between two candidates before a merge.
# Identifier `merge_block_candidates` under `capabilities` for `rtl_integration`.
- id: merge_block_candidates
  # One-line charter of what this agent owns in the chip flow.
  description: Combine compatible block revisions into one integration candidate.
# Identifier `resolve_merge_conflict` under `capabilities` for `rtl_integration`.
- id: resolve_merge_conflict
  # One-line charter of what this agent owns in the chip flow.
  description: Apply one explicit resolution in the integration candidate.
# Identifier `write_integration_manifest` under `capabilities` for `rtl_integration`.
- id: write_integration_manifest
  # One-line charter of what this agent owns in the chip flow.
  description: Write the list of block revisions included in the integration candidate.
# Identifier `compile_integration` under `capabilities` for `rtl_integration`.
- id: compile_integration
  # One-line charter of what this agent owns in the chip flow.
  description: Compile the integrated candidate.
