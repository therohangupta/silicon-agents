# AgentFleet config for ``reference_model`` — behavioral reference-model author for scoreboard checking.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``reference_model`` used across the verification plan graph.
  name: reference_model
  # Human-readable title shown in UIs and docs.
  display_name: Reference Model Agent
  # Responsibility brief for this verification specialist.
  description: Produce an executable behavioral reference model from the specification.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: worker
# Fleet role enum used for privilege and delegation policy.
role: worker
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Produce an executable behavioral reference model from the specification.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for reference_model: Read the specification
  - Read the specification
  # Boundary rule for reference_model: Write a reference model on an isolated branch
  - Write a reference model on an isolated branch
  # Boundary rule for reference_model: Run the model against its own directed checks
  - Run the model against its own directed checks
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for reference_model: Copy unreviewed RTL into the reference
  - Copy unreviewed RTL into the reference
  # Boundary rule for reference_model: Change the spec to match the model
  - Change the spec to match the model
  # Boundary rule for reference_model: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for reference_model: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for reference_model: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8217 for the reference_model AgentService (must match Dockerfile EXPOSE).
  port: 8217
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``generate_reference_model`` — must stay aligned with tools.py / plan references.
- id: generate_reference_model
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write a behavioral model that encodes the specification.
# Identifier ``write_model_ports`` — must stay aligned with tools.py / plan references.
- id: write_model_ports
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write the model's ports from the interface contract.
# Identifier ``write_model_transactions`` — must stay aligned with tools.py / plan references.
- id: write_model_transactions
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write legal transaction types and their fields.
# Identifier ``write_model_error_behavior`` — must stay aligned with tools.py / plan references.
- id: write_model_error_behavior
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write how the model reports and recovers from illegal inputs.
# Identifier ``write_model_latency_rule`` — must stay aligned with tools.py / plan references.
- id: write_model_latency_rule
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write the latency or ordering rule the model must obey.
# Identifier ``write_model_selfcheck`` — must stay aligned with tools.py / plan references.
- id: write_model_selfcheck
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Write directed checks that exercise the model without the DUT.
# Identifier ``read_model_specification`` — must stay aligned with tools.py / plan references.
- id: read_model_specification
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Read the specification clauses this model claims to encode.
# Identifier ``diff_model_against_spec`` — must stay aligned with tools.py / plan references.
- id: diff_model_against_spec
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: List specification clauses the model does not yet encode.
# Identifier ``compile_reference_model`` — must stay aligned with tools.py / plan references.
- id: compile_reference_model
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Compile the reference model.
# Identifier ``run_model_selfcheck`` — must stay aligned with tools.py / plan references.
- id: run_model_selfcheck
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Run the model's own checks and return mismatches.
# Identifier ``flag_spec_hole_in_model`` — must stay aligned with tools.py / plan references.
- id: flag_spec_hole_in_model
  # YAML key ``description`` for the reference_model agent (behavioral reference-model author for scoreboard checking).
  description: Publish a specification clause that cannot be encoded because it is ambiguous.
