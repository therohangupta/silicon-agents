# AgentFleet config for ``verification_validator`` — independent verification-contract gate grader.
# This file is the checked-in contract: identity, boundaries, HTTP connection,
# capabilities/skills (bound to tools.py), memory, observability, deployment,
# optional plan graph, and LLM context packing rules.
# Comments below document every key's meaning in silicon verification.
# Do not change values here when only editing documentation.

# AgentFleet manifest schema version for this verification specialist.
apiVersion: agentfleet/v1
# Resource kind: a runnable Agent (not a Fleet or Workflow document).
kind: Agent
# Identity block used by the orchestrator, Docker labels, and telemetry.
metadata:
  # Stable agent id ``verification_validator`` used across the verification plan graph.
  name: verification_validator
  # Human-readable title shown in UIs and docs.
  display_name: Verification Validator
  # Responsibility brief for this verification specialist.
  description: Independently decide whether the verification contract passes for one candidate.
  # Routing labels: stage and role. The spec loader reads only these two.
  labels:
    # Pipeline stage this agent participates in.
    stage: verification
    # Fleet role: lead plans; worker executes; validator independently grades.
    role: validator
# Fleet role enum used for privilege and delegation policy.
role: validator
# Pipeline stage name matching metadata.labels.stage.
stage: verification
# Authoritative responsibility string enforced in prompts/policy.
responsibility: Independently decide whether the verification contract passes for one candidate.
# Hard may / may_not rules for this verification agent.
boundary:
  # Allowed actions in the verification flow.
  may:
  # Boundary rule for verification_validator: Read the pinned candidate and primary reports
  - Read the pinned candidate and primary reports
  # Boundary rule for verification_validator: Re-run critical checks
  - Re-run critical checks
  # Boundary rule for verification_validator: Emit a gate decision
  - Emit a gate decision
  # Boundary rule for verification_validator: Publish missing inputs or a disagreement with the producing summary
  - Publish missing inputs or a disagreement with the producing summary
  # Forbidden actions (waivers, canonical RTL edits, self-signoff, etc.).
  may_not:
  # Boundary rule for verification_validator: Edit the candidate
  - Edit the candidate
  # Boundary rule for verification_validator: Waive a failing property
  - Waive a failing property
  # Boundary rule for verification_validator: Accept the producing agent's summary in place of the report
  - Accept the producing agent's summary in place of the report
  # Boundary rule for verification_validator: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Boundary rule for verification_validator: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Boundary rule for verification_validator: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Child agent ids this lead may open tasks for (empty for pure workers).
delegates_to: []
# Independent graders that must pass before promotion/signoff.
validators: []
# How peers reach this agent's HTTP service inside Docker/compose.
connection:
  # Hostname reachable from other containers (Docker Desktop bridge).
  host: host.docker.internal
  # TCP port 8224 for the verification_validator AgentService (must match Dockerfile EXPOSE).
  port: 8224
  # HTTP paths the orchestrator calls.
  endpoints:
    # Liveness endpoint for fleet health checks.
    health: /health
    # Task execution endpoint for skill/workflow runs.
    execute: /tasks/execute
# EDA tool backend binding (none until a simulator/formal adapter is configured).
backend:
  # Backend kind; none means tools return not_run observations.
  type: none
# How the AgentService schedules work for this process.
execution:
  # Dispatch mode for skill calls (direct_function vs queued).
  mode: direct_function
  # Parallelism limits for in-flight verification tasks.
  concurrency:
    # Max concurrent tasks inside this agent process.
    max_tasks: 1
# Timeouts and retry policy when a verification task fails.
reliability:
  # Seconds before a stuck skill/task is aborted.
  task_timeout_secs: 120
  # Automatic retry count before replan/escalate.
  max_retries: 1
  # Failure policy hook (e.g. replan the workflow).
  on_failure: replan
# Public capability ids advertised to the orchestrator/LLM.
capabilities:
# Identifier ``read_pinned_verification_candidate`` — must stay aligned with tools.py / plan references.
- id: read_pinned_verification_candidate
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Read the exact candidate revision being graded.
# Identifier ``read_primary_verification_reports`` — must stay aligned with tools.py / plan references.
- id: read_primary_verification_reports
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Read simulation, formal, and coverage reports from primary artifacts.
# Identifier ``check_verification_provenance`` — must stay aligned with tools.py / plan references.
- id: check_verification_provenance
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Check simulator, formal engine, and coverage-model versions against the frozen recipe.
# Identifier ``reproduce_critical_simulation`` — must stay aligned with tools.py / plan references.
- id: reproduce_critical_simulation
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Re-run the critical simulation checks.
# Identifier ``reproduce_critical_formal`` — must stay aligned with tools.py / plan references.
- id: reproduce_critical_formal
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Re-run the critical formal checks.
# Identifier ``reproduce_coverage_merge`` — must stay aligned with tools.py / plan references.
- id: reproduce_coverage_merge
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Re-merge coverage and compare it with the reported score.
# Identifier ``compare_verification_summary`` — must stay aligned with tools.py / plan references.
- id: compare_verification_summary
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Compare the producing agent's summary with the primary reports.
# Identifier ``audit_verification_exclusions`` — must stay aligned with tools.py / plan references.
- id: audit_verification_exclusions
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Check that every exclusion has an owner, scope, and rationale.
# Identifier ``list_missing_verification_inputs`` — must stay aligned with tools.py / plan references.
- id: list_missing_verification_inputs
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: List reports or recipe fields required for a gate that are absent.
# Identifier ``emit_verification_gate`` — must stay aligned with tools.py / plan references.
- id: emit_verification_gate
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Record whether the verification contract passed. A missing input fails the gate.
# Identifier ``publish_verification_disagreement`` — must stay aligned with tools.py / plan references.
- id: publish_verification_disagreement
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Publish a place where the summary and the primary report disagree.
# Identifier ``publish_missing_verification_input`` — must stay aligned with tools.py / plan references.
- id: publish_missing_verification_input
  # YAML key ``description`` for the verification_validator agent (independent verification-contract gate grader).
  description: Publish an input that blocks an independent grade.
