# Agent specification for Architecture Lead (`architecture_lead`).
# Stage: architecture. Role: lead. HTTP port: 8203.
# The architecture lead owns decomposition, budgets, and tradeoff selection. It asks workers for performance, interface, power/area, requirements, and security studies, then recommends a revision.
# Every key below is loaded by EdaAgent.read_spec / AgentService at startup.
# Comments are documentation only; they do not change runtime behavior.

# Fleet manifest schema version; must match the agentfleet loader.
apiVersion: agentfleet/v1
# Resource kind. Agent means this YAML is an agent specification.
kind: Agent
# Human-facing identity and labels used by fleet discovery and dashboards.
metadata:
  # Stable agent id `architecture_lead` used in routing and telemetry.
  name: architecture_lead
  # Dashboard title for `architecture_lead`.
  display_name: Architecture Lead
  # Charter shown to planners and operators.
  description: Own decomposition and high-level tradeoffs. Select a qualified architecture revision with block budgets, not an informal conclusion.
  # Labels expose stage and role.
  labels:
    # Lifecycle stage `architecture` for planner routing.
    stage: architecture
    # Agent role `lead` (lead vs worker) controlling delegation rights.
    role: lead
# Agent role `lead` (lead vs worker) controlling delegation rights.
role: lead
# Lifecycle stage `architecture` for planner routing.
stage: architecture
# Charter repeated at the top level for validators and planners.
responsibility: Own decomposition and high-level tradeoffs. Select a qualified architecture revision with block budgets, not an informal conclusion.
# Hard may / may_not limits that prevent unsafe cross-stage edits.
boundary:
  # Actions this agent is allowed to perform on candidates and reports.
  may:
  # Allowed action: Read requirements and workload evidence
  - Read requirements and workload evidence
  # Allowed action: Publish an architecture workflow
  - Publish an architecture workflow
  # Allowed action: Request a human decision when two feasible architectures remain
  - Request a human decision when two feasible architectures remain
  # Actions forbidden even if a tool adapter could physically do them.
  may_not:
  # Forbidden action: Write RTL or a physical database
  - Write RTL or a physical database
  # Forbidden action: Treat a model projection as a measured result
  - Treat a model projection as a measured result
  # Forbidden action: Promote a candidate onto the canonical baseline
  - Promote a candidate onto the canonical baseline
  # Forbidden action: Approve a waiver or relax a hard requirement
  - Approve a waiver or relax a hard requirement
  # Forbidden action: Treat its own summary as independent signoff
  - Treat its own summary as independent signoff
# Worker agent ids this lead may open tasks against.
delegates_to:
# Worker agent id this lead may schedule: requirements
- requirements
# Worker agent id this lead may schedule: performance_modeling
- performance_modeling
# Worker agent id this lead may schedule: interface
- interface
# Worker agent id this lead may schedule: power_area_estimation
- power_area_estimation
# Worker agent id this lead may schedule: security_reliability
- security_reliability
# Optional gate agents that must approve before promotion.
validators: []
# How peer services reach this agent's HTTP surface.
connection:
  # Docker host alias so containers reach the published port on the host.
  host: host.docker.internal
  # TCP port for this agent; must match Dockerfile EXPOSE (8203).
  port: 8203
  # Relative HTTP paths for health and task execution.
  endpoints:
    # Liveness HTTP path for compose/fleet probes.
    health: /health
    # Task execution HTTP path used by the orchestrator.
    execute: /tasks/execute
# Where tool jobs run; type none means stub observations until bound.
backend:
  # none = no live EDA backend; tools return not_run stubs.
  type: none
# How the runtime invokes skills for this agent.
execution:
  # direct_function invokes Python skills in-process.
  mode: direct_function
  # Limits parallel task load on this container.
  concurrency:
    # Serialise tasks when 1 so candidate edits do not race.
    max_tasks: 1
# Timeouts and retry policy for failed tool or LLM turns.
reliability:
  # Abort tasks that exceed 120 seconds.
  task_timeout_secs: 120
  # Retry budget `1` before giving up / replanning.
  max_retries: 1
  # Planner policy `replan` after task failure.
  on_failure: replan
# Advertised skill ids the planner may schedule.
capabilities:
# Identifier `publish_architecture_plan` under `capabilities` for `architecture_lead`.
- id: publish_architecture_plan
  # One-line charter of what this agent owns in the chip flow.
  description: Emit the workflow that produces one architecture revision.
# Identifier `request_block_decomposition` under `capabilities` for `architecture_lead`.
- id: request_block_decomposition
  # One-line charter of what this agent owns in the chip flow.
  description: Ask the decomposition work to divide the chip into blocks and interfaces.
