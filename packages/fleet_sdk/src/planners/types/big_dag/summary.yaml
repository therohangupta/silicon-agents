# =============================================================================
# Big DAG Planner catalog summary (dashboard / docs metadata — not loaded as code)
# =============================================================================

id: 3
name: Big DAG Planner

description: >
  Generates a single unified DAG that spans ALL goals together. Tasks from
  different goals can depend on each other, enabling cross-goal optimization.
  Best for coordinating multiple agents on interrelated objectives.

method_type: foundation model

output_format: >
  JSON with 'nodes' array. Each node has: id (string like "node0", "node1"),
  description, goal_id, agent_type (suggested), depends_on (list of node IDs).
  Unlike DAG planner, dependencies can cross goal boundaries.

prompts:
  - type: system
    description: System prompt for unified cross-goal planning
  - type: user
    description: Template with multiple goals, agent context, and coordination instructions

example_output: |
  {
    "nodes": [
      {"id": "node0", "description": "Gather requirements for objective A", "goal_id": 1, "agent_type": "analysis", "depends_on": []},
      {"id": "node1", "description": "Implement deliverable for objective B", "goal_id": 2, "agent_type": "implementation", "depends_on": ["node0"]},
      {"id": "node2", "description": "Verify deliverable against requirements", "goal_id": 2, "agent_type": "verification", "depends_on": ["node1"]}
    ]
  }
